# PMD_KIOSK_BLADE_V8_NGINX_NO_REDIRECT
# Include this inside each TLS tenant server block BEFORE the generic:
#   location / { try_files $uri $uri/ @next; }
#
# Purpose:
# - Keep /kiosk and /kiosk-reset on Laravel/PHP.
# - Avoid Nginx's automatic directory 301 from /kiosk -> /kiosk/.
#   The Android Kiosk WebView uses the reset page's onPageFinished callback
#   to move into the order screen; an intermediate 301 can race that callback
#   and leave the WebView parked on the reset surface.

location ~ ^/(?<pmd_kiosk_route>kiosk(?:-reset)?)/?$ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    fastcgi_param SCRIPT_FILENAME /var/www/paymydine/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/paymydine;

    # Normalize both slash/no-slash variants to the Laravel route while
    # preserving the kiosk query string/session.
    fastcgi_param REQUEST_URI /$pmd_kiosk_route$is_args$args;

    add_header X-PMD-Kiosk-Nginx "blade-v8-direct" always;
}
