# PMD_TENANT_UNAVAILABLE_PAGE_R1
# Include inside each HTTPS tenant server containing
# "auth_request /__pmd_tenant_access_check;".
# A 401/403 from that gate is a non-active/missing/expired/not-started tenant.
# Keep the original hostname; never open Laravel/Next for the denied request.
error_page 401 403 =503 /__pmd_restaurant_unavailable;

location = /__pmd_restaurant_unavailable {
    internal;
    auth_request off;
    alias /var/www/paymydine/public/restaurant-unavailable.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Retry-After "3600" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
