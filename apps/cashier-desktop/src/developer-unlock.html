<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Exit</title>
  <style>
    :root{font-family:Inter,Roboto,Arial,sans-serif;color:#102f42;background:#f8fbfc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(180deg,rgba(5,58,50,.05),transparent 140px),#f8fbfc}
    .card{width:100%;background:#fff;border:1px solid #d3e1e8;border-radius:18px;padding:24px;box-shadow:0 16px 40px rgba(16,47,66,.12)}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#053a32;margin-bottom:9px}
    h1{font-size:22px;margin:0 0 8px;color:#053a32}
    p{margin:0 0 17px;color:#647d8f;line-height:1.45;font-size:13px}
    label{display:block;font-weight:800;margin-bottom:7px}
    input{width:100%;height:46px;border:1px solid #c9d9df;border-radius:11px;padding:0 12px;font-size:16px;outline:none}
    input:focus{border-color:#d9b76a;box-shadow:0 0 0 3px rgba(217,183,106,.2)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
    button{height:43px;border-radius:10px;border:1px solid #053a32;font-weight:850;cursor:pointer}
    .cancel{background:#fff;color:#053a32}.open{background:#053a32;color:#fff}
    .error{min-height:20px;margin-top:10px;color:#b42318;font-size:13px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">PayMyDine Device Mode</div>
    <h1>Open Windows Desktop</h1>
    <p>This temporarily leaves the restaurant-facing PayMyDine screen. The next reboot/sign-in returns to PayMyDine Device Mode.</p>
    <form id="unlock-form">
      <label for="password">Developer password</label>
      <input id="password" type="password" autocomplete="off" autofocus required>
      <div class="actions">
        <button type="button" class="cancel" id="cancel">Cancel</button>
        <button type="submit" class="open" id="open">Open Windows</button>
      </div>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
  <script src="./developer-unlock.js"></script>
</body>
</html>
