name: PMD Quick Setup Menu V2 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - app/admin/Services/PmdStarterMenuLibraryV2.php
      - app/admin/Services/PmdStarterMenuImageServiceV2.php
      - app/admin/Services/PmdStarterMenuImageServiceV4.php
      - app/admin/Services/PmdTenantQuickSetupServiceV2.php
      - app/admin/controllers/Pmdquicksetup.php
      - app/admin/assets/js/pmd-tenant-quick-setup-v2.js
      - .github/workflows/pmd-quick-setup-menu-v2-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/admin/Services/PmdStarterMenuLibraryV1.php
          php -l app/admin/Services/PmdStarterMenuLibraryV2.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV2.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV3.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV4.php
          php -l app/admin/Services/PmdTenantQuickSetupServiceV2.php
          php -l app/admin/controllers/Pmdquicksetup.php
      - name: JavaScript syntax
        run: node --check app/admin/assets/js/pmd-tenant-quick-setup-v2.js
      - name: Validate all starter packs
        run: |
          php -r '
            require "app/admin/Services/PmdStarterMenuLibraryV1.php";
            require "app/admin/Services/PmdStarterMenuLibraryV2.php";
            $library = new Admin\Services\PmdStarterMenuLibraryV2();
            foreach (array_keys($library->restaurantTypes()) as $type) {
                $pack = $library->pack($type);
                $items = count($pack["items"] ?? []);
                $categories = count($pack["categories"] ?? []);
                echo $type.": ".$items." items / ".$categories." categories\n";
                if ($items < 18 || $categories < 5) exit(20);
            }
          '
      - name: Verify semantic V4
        run: |
          grep -q "requiredAltTokens" app/admin/Services/PmdStarterMenuImageServiceV4.php
          grep -q "pmdstarter_v4_" app/admin/Services/PmdStarterMenuImageServiceV4.php
          grep -q "onCompleteStarterMenu" app/admin/controllers/Pmdquicksetup.php
