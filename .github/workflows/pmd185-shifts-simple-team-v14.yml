name: PMD185 Shifts Simple Team V14

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  qa-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply focused Shifts V14
        run: python3 .github/pmd185_shifts_simple_team_v14_runner.py

      - name: QA focused Shifts V14
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/admin/assets/js/pmd-shifts-v1.js
          php -l app/admin/routes.php
          php -l app/main/routes.php
          git diff --check

          grep -F "PMD_SHIFTS_SIMPLE_TEAM_WORKSPACE_V14" app/admin/views/pmdshifts/index.blade.php
          grep -F "data-pmd-shifts-notification-slot" app/admin/views/pmdshifts/index.blade.php
          grep -F "data-pmd-shifts-team-panel" app/admin/views/pmdshifts/index.blade.php
          grep -F "Create PMD login" app/admin/views/pmdshifts/index.blade.php
          grep -F "data-pmd-team-panel-person-id" app/admin/views/pmdshifts/index.blade.php
          grep -F "teamAccessToggle.checked = false" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "function mountHeaderNotification" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "data-pmd-team-scroll-person" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "pmd-shifts-dashboard-reservations-v4.css?v=14" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "PMD_SHIFTS_SIMPLE_TEAM_WORKSPACE_V14" app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css

          cmp app/admin/routes.php <(git show 915086d9ec6f53699abd7031af58d9a39cead6ad:app/admin/routes.php)
          cmp app/main/routes.php <(git show 915086d9ec6f53699abd7031af58d9a39cead6ad:app/main/routes.php)

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          expected=(
            "app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css"
            "app/admin/assets/js/pmd-shifts-v1.js"
            "app/admin/routes.php"
            "app/admin/views/pmdshifts/index.blade.php"
            "app/main/routes.php"
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

      - name: Commit focused Shifts V14
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css \
            app/admin/assets/js/pmd-shifts-v1.js \
            app/admin/routes.php \
            app/admin/views/pmdshifts/index.blade.php \
            app/main/routes.php
          git commit -m 'Simplify Shifts header and inline member workflow (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
