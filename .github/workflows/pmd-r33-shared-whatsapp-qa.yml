name: R33 One Shared WhatsApp Number QA

on:
  pull_request:
    paths:
      - 'app/Services/WhatsApp/**'
      - 'app/Services/Reservations/PmdGuestCommunicationService.php'
      - 'app/Console/Commands/PmdWhatsAppCommand.php'
      - 'app/Http/Controllers/PmdPublicBookingController.php'
      - 'app/admin/controllers/Pmdwhatsappinbox.php'
      - 'app/admin/views/pmdwhatsappinbox/index.blade.php'
      - 'app/admin/views/pmdsettings/restaurant.blade.php'
      - 'resources/views/pmd/public-booking.blade.php'
      - 'config/pmd_whatsapp.php'
      - 'scripts/pmd-r33-*'
      - '.github/workflows/pmd-r33-shared-whatsapp-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP, booking opt-in and strict tenant-routing contracts
        run: bash scripts/pmd-r33-shared-whatsapp-qa.sh
