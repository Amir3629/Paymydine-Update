name: PMD Menu Image Quality V2 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - app/admin/traits/PmdMenuImageQualityV1.php
      - app/admin/assets/js/pmd-menu-image-quality-v2.js
      - app/admin/assets/css/pmd-menu-image-quality-v2.css
      - app/admin/views/_meta/assets.json
      - .github/workflows/pmd-menu-image-quality-v2-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903
      - name: PHP syntax
        run: php -l app/admin/traits/PmdMenuImageQualityV1.php
      - name: Admin JS syntax
        run: node --check app/admin/assets/js/pmd-menu-image-quality-v2.js
      - name: Manifest JSON
        run: python3 -m json.tool app/admin/views/_meta/assets.json >/dev/null
      - name: Advisory behavior markers
        run: |
          grep -q "PMD_MENU_IMAGE_QUALITY_V2_SOFT_ADVISORY" app/admin/traits/PmdMenuImageQualityV1.php
          grep -q "Low resolution is advisory only" app/admin/traits/PmdMenuImageQualityV1.php
          grep -q "Photo added · quality could be better" app/admin/assets/js/pmd-menu-image-quality-v2.js
          grep -q "pixels < MIN_PIXELS" app/admin/assets/js/pmd-menu-image-quality-v2.js
          grep -q "pmd-menu-image-quality-v2" app/admin/views/_meta/assets.json
          ! grep -q "Photo .* is too small" app/admin/traits/PmdMenuImageQualityV1.php
