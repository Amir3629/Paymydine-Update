name: PMD185 Shifts Final Rota V16

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  qa-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply final Shifts rota V16
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/pmd185_shifts_final_v16.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css')
          path.write_text(path.read_text().rstrip() + '\n')
          PY

      - name: QA final Shifts rota V16
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/admin/assets/js/pmd-shifts-v1.js
          git diff --check

          JS="app/admin/assets/js/pmd-shifts-v1.js"
          CSS="app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css"

          grep -F "pmd-shifts-dashboard-reservations-v4.css?v=16" "$JS"
          grep -F "pmd-shifts-final-screen" "$JS"
          grep -F "pmd-shifts-final-row" "$JS"
          grep -F "pmd-shifts-final-track" "$JS"
          grep -F "data-pmd-shifts-today" "$JS"
          grep -F "function loadDayData" "$JS"
          grep -F "data-pmd-person-slot-create" "$JS"
          grep -F "data-pmd-shift-manage" "$JS"

          ! grep -F "pmd-shifts-resource-table" "$JS"
          ! grep -F "visualColumnCount" "$JS"
          ! grep -F "fillerCount" "$JS"
          ! grep -F "staff hours</span>" "$JS"

          grep -F "PMD_SHIFTS_FINAL_ROTA_V16" "$CSS"
          grep -F ".pmd-shifts-final-board" "$CSS"
          grep -F "grid-template-columns:220px minmax(900px,1fr)!important" "$CSS"
          grep -F ".pmd-shifts-final-shift" "$CSS"
          grep -F ".pmd-shifts-final-slot" "$CSS"

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          expected=(
            "app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css"
            "app/admin/assets/js/pmd-shifts-v1.js"
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

      - name: Commit final Shifts rota V16
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css \
            app/admin/assets/js/pmd-shifts-v1.js
          git commit -m 'Finalize Shifts with staff-row timeline rota (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
