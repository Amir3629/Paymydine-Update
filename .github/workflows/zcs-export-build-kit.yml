name: Export Android Build Kit for ZCS

on:
  push:
    branches:
      - feature/android-local-first-v1
    paths:
      - '.github/workflows/zcs-export-build-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Package portable build kit
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/pmd-zcs-build-kit"
          rm -rf "$OUT"
          mkdir -p "$OUT/source" "$OUT/toolchain/android-sdk"

          cp -a mobile/android "$OUT/source/android"

          cp -a "$JAVA_HOME" "$OUT/toolchain/jdk17"

          mkdir -p "$OUT/toolchain/android-sdk/platforms"
          mkdir -p "$OUT/toolchain/android-sdk/build-tools"

          cp -a "$ANDROID_HOME/platforms/android-36"             "$OUT/toolchain/android-sdk/platforms/android-36"
          cp -a "$ANDROID_HOME/build-tools/35.0.0"             "$OUT/toolchain/android-sdk/build-tools/35.0.0"
          cp -a "$ANDROID_HOME/platform-tools"             "$OUT/toolchain/android-sdk/platform-tools"

          if [[ -d "$ANDROID_HOME/licenses" ]]; then
            cp -a "$ANDROID_HOME/licenses" "$OUT/toolchain/android-sdk/licenses"
          fi

          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          cp -a "$GRADLE_HOME" "$OUT/toolchain/gradle-8.13"

          cat > "$OUT/BUILD_KIT_INFO.txt" <<EOF
          source_commit=$GITHUB_SHA
          java_home=toolchain/jdk17
          android_home=toolchain/android-sdk
          gradle_home=toolchain/gradle-8.13
          EOF

          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum             > "$OUT/SHA256SUMS.txt"

          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pmd-zcs-build-kit.tar.gz"             pmd-zcs-build-kit

          ls -lh "$RUNNER_TEMP/pmd-zcs-build-kit.tar.gz"
          sha256sum "$RUNNER_TEMP/pmd-zcs-build-kit.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pmd-zcs-android-build-kit
          path: ${{ runner.temp }}/pmd-zcs-build-kit.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
