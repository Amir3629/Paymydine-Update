name: PMD Quick Setup Menu V3 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - app/admin/Services/PmdStarterMenuLibraryV3.php
      - app/admin/Services/PmdStarterMenuImageServiceV2.php
      - app/admin/Services/PmdStarterMenuImageServiceV5.php
      - app/admin/Services/PmdTenantQuickSetupServiceV2.php
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
      - .github/workflows/pmd-quick-setup-menu-v3-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l app/admin/Services/PmdStarterMenuLibraryV1.php
          php -l app/admin/Services/PmdStarterMenuLibraryV2.php
          php -l app/admin/Services/PmdStarterMenuLibraryV3.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV2.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV3.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV4.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV5.php
          php -l app/admin/Services/PmdTenantQuickSetupServiceV2.php

      - name: Validate 50 plus starter packs
        run: |
          php -r '
            require "app/admin/Services/PmdStarterMenuLibraryV1.php";
            require "app/admin/Services/PmdStarterMenuLibraryV2.php";
            require "app/admin/Services/PmdStarterMenuLibraryV3.php";
            $library = new Admin\Services\PmdStarterMenuLibraryV3();
            foreach (array_keys($library->restaurantTypes()) as $type) {
                $pack = $library->pack($type);
                $items = (array)($pack["items"] ?? []);
                $categories = (array)($pack["categories"] ?? []);
                $drinkCount = 0;
                $seen = [];
                foreach ($items as $item) {
                    $name = mb_strtolower(trim((string)($item["name"] ?? "")));
                    if ($name === "" || isset($seen[$name])) { fwrite(STDERR, $type." duplicate/empty item\n"); exit(21); }
                    $seen[$name] = true;
                    if (($item["image_family"] ?? "") === "drink") $drinkCount++;
                    foreach (["image_family","image_query","image_fallback_query","image_required"] as $key) {
                        if (empty($item[$key])) { fwrite(STDERR, $type." missing ".$key." for ".$name."\n"); exit(22); }
                    }
                }
                echo $type.": ".count($items)." items / ".count($categories)." categories / ".$drinkCount." drinks\n";
                if (count($items) < 50) exit(23);
                if ($drinkCount < 6) exit(24);
            }
          '

      - name: Verify image V5 and logo contract
        run: |
          grep -q "pmdstarter_v5_" app/admin/Services/PmdStarterMenuImageServiceV5.php
          grep -q "candidateMatchesV5" app/admin/Services/PmdStarterMenuImageServiceV5.php
          grep -q "image_fallback_query" app/admin/Services/PmdStarterMenuLibraryV3.php
          grep -q "PmdStarterMenuLibraryV3" app/admin/Services/PmdTenantQuickSetupServiceV2.php
          grep -q "https://tomo.paymydine.com/brand/paymydine-logo.svg" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/package-lock.json

      - name: Frontend install
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run build
