name: PMD185 Shifts visual polish v9

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  polish-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply visual polish
        run: |
          sed -i 's/;pointer-events:auto!important}/}/g' .github/pmd185_polish_shift_canvas_v9.py
          python3 .github/pmd185_polish_shift_canvas_v9.py
          git checkout -- .github/pmd185_polish_shift_canvas_v9.py
          sed -i 's/data-pmd-shifts-exact-ui-v8/data-pmd-shifts-exact-ui-v9/g' app/admin/assets/js/pmd-shifts-v1.js

      - name: QA
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/admin/assets/js/pmd-shifts-v1.js
          git diff --check
          grep -F 'PMD_SHIFTS_POLISHED_SCHEDULE_CANVAS_V9' app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          ! grep -F 'pmd-yc-day__operations{display:grid!important;gap:4px!important;margin-top:8px!important;min-width:0!important;pointer-events:none!important}' app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          grep -F 'pmd-shifts-dashboard-reservations-v4.css?v=9' app/admin/assets/js/pmd-shifts-v1.js
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css'
          git diff --name-only | grep -Fx 'app/admin/assets/js/pmd-shifts-v1.js'

      - name: Commit product files
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css app/admin/assets/js/pmd-shifts-v1.js
          git commit -m 'Polish Shifts schedule canvas and month cells (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
