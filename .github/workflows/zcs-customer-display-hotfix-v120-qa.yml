name: ZCS Customer Display Hotfix V120 QA

on:
  push:
    branches:
      - fix/zcs-customer-display-live-hotfix-v120
    paths:
      - 'app/admin/assets/js/pmd-qpos-reservation-rail-r2.js'
      - 'app/admin/views/pmd_quick_pos_v1.blade.php'
      - '.github/workflows/zcs-customer-display-hotfix-v120-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate customer display hotfix
        shell: bash
        run: |
          set -euo pipefail
          node --check app/admin/assets/js/pmd-qpos-reservation-rail-r2.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_LIVE_HOTFIX_V120' app/admin/assets/js/pmd-qpos-reservation-rail-r2.js
          grep -Fq 'PayMyDineOffline' app/admin/assets/js/pmd-qpos-reservation-rail-r2.js
          grep -Fq 'Test order' app/admin/assets/js/pmd-qpos-reservation-rail-r2.js
          grep -Fq '20261021-zcs-v120' app/admin/views/pmd_quick_pos_v1.blade.php
          echo 'ZCS CUSTOMER DISPLAY HOTFIX V120 QA: PASS'
