name: R36 Task 2 backend one-shot

on:
  push:
    branches:
      - r36/final-bill-completion
    paths:
      - .github/workflows/r36-task2-backend-one-shot.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 2 branch
        uses: actions/checkout@v4
        with:
          ref: r36/final-bill-completion
          fetch-depth: 0

      - name: Guarded patch preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/r36-task2-backend.patch
          git apply --check .github/r36-task2-backend.patch
          git apply .github/r36-task2-backend.patch
          git diff --check

      - name: PHP syntax and authority markers
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Services/Financial/BillingGroupService.php
          php -l app/Services/Financial/BillingGroupPaymentService.php
          php -l app/Services/Financial/BillingGroupInvoiceService.php
          php -l app/admin/database/migrations/2026_08_21_362000_upgrade_pmd_billing_groups_task2.php
          php -l app/main/routes/api-v1-billing-groups-r36.php
          php -l app/Http/Middleware/PmdBillingGroupSync.php
          php -l app/admin/traits/HasInvoice.php
          php -l app/admin/controllers/concerns/PmdWaiterPosTableStateV154Concern.php
          grep -q 'PMD_R36_FREE_TABLE_FINAL_AUTHORITY' app/admin/controllers/concerns/PmdWaiterPosTableStateV154Concern.php
          grep -q 'pmdR36UsesFinalBillInvoice' app/admin/traits/HasInvoice.php
          grep -q 'billing-group-payments/{paymentId}/cancel' app/main/routes/api-v1-billing-groups-r36.php

      - name: Commit only verified Task 2 backend files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PayMyDine R36 Task Runner'
          git config user.email 'actions@users.noreply.github.com'
          git rm -- .github/r36-task2-backend.patch .github/workflows/r36-task2-backend-one-shot.yml
          git add -- \
            app/Services/Financial/BillingGroupService.php \
            app/Services/Financial/BillingGroupPaymentService.php \
            app/Services/Financial/BillingGroupInvoiceService.php \
            app/admin/database/migrations/2026_08_21_362000_upgrade_pmd_billing_groups_task2.php \
            app/main/routes/api-v1-billing-groups-r36.php \
            app/Http/Middleware/PmdBillingGroupSync.php \
            app/admin/traits/HasInvoice.php \
            app/admin/controllers/concerns/PmdWaiterPosTableStateV154Concern.php \
            app/admin/views/orders/form/order_details.blade.php \
            docs/PMD_R36_TASK2_BACKEND.md
          git diff --cached --check
          git commit -m 'R36 Task 2: wire Final Bill backend and Free Table authority'
          git push origin HEAD:r36/final-bill-completion
