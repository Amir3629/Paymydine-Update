name: PMD185 Staff Portal V13

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  build-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply Staff Portal V13
        run: python3 .github/pmd185_staff_portal_v13.py

      - name: PHP and diff safety
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/Http/Controllers/PmdStaffPortalController.php
          php -l routes/pmd-staff-portal-v1.php
          php -l app/admin/routes.php
          php -l app/admin/Services/PmdRoleLandingService.php
          php -l app/admin/controllers/Mywork.php
          php -l app/admin/controllers/People.php
          git diff --check

      - name: Portal invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "PMD_STAFF_PORTAL_V1" app/Http/Controllers/PmdStaffPortalController.php
          grep -F "Route::get('/staff/login'" routes/pmd-staff-portal-v1.php
          grep -F "Route::get('/staff'" routes/pmd-staff-portal-v1.php
          grep -F "Route::post('/staff/request'" routes/pmd-staff-portal-v1.php
          grep -F "routes/pmd-staff-portal-v1.php" app/admin/routes.php
          grep -F "'pmd-team-member' => 'mywork'" app/admin/Services/PmdRoleLandingService.php
          grep -F "return redirect('/staff');" app/admin/controllers/Mywork.php
          grep -F "Staff sign in at /staff/login" app/admin/controllers/People.php
          grep -F "Staff Portal" app/admin/views/pmdpeople/index.blade.php
          grep -F "action=\"/staff/login\"" resources/views/pmd-staff-portal/login.blade.php
          grep -F "Schedule" resources/views/pmd-staff-portal/index.blade.php
          grep -F "Messages" resources/views/pmd-staff-portal/index.blade.php
          grep -F "Requests" resources/views/pmd-staff-portal/index.blade.php
          grep -F "status' => \$type === 'message' ? 'sent' : 'pending'" app/Http/Controllers/PmdStaffPortalController.php

      - name: Exact product scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git status --porcelain | cut -c4- | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 10
          expected=(
            "app/Http/Controllers/PmdStaffPortalController.php"
            "app/admin/Services/PmdRoleLandingService.php"
            "app/admin/assets/css/pmd-staff-portal-v1.css"
            "app/admin/controllers/Mywork.php"
            "app/admin/controllers/People.php"
            "app/admin/routes.php"
            "app/admin/views/pmdpeople/index.blade.php"
            "resources/views/pmd-staff-portal/index.blade.php"
            "resources/views/pmd-staff-portal/login.blade.php"
            "routes/pmd-staff-portal-v1.php"
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

      - name: Commit reviewed Staff Portal V13
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/Http/Controllers/PmdStaffPortalController.php \
            app/admin/Services/PmdRoleLandingService.php \
            app/admin/assets/css/pmd-staff-portal-v1.css \
            app/admin/controllers/Mywork.php \
            app/admin/controllers/People.php \
            app/admin/routes.php \
            app/admin/views/pmdpeople/index.blade.php \
            resources/views/pmd-staff-portal/index.blade.php \
            resources/views/pmd-staff-portal/login.blade.php \
            routes/pmd-staff-portal-v1.php
          git commit -m 'Add standalone staff portal and fix Team Member login (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
