name: PMD Tenant Welcome R9 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - app/admin/assets/js/pmd-new-tenant-onboarding-r7.js
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/page.tsx
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.module.css
      - .github/workflows/pmd-tenant-welcome-r9-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903

      - name: Admin JavaScript syntax
        run: node --check app/admin/assets/js/pmd-new-tenant-onboarding-r7.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/package-lock.json

      - name: Install frontend
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm ci

      - name: Typecheck
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run typecheck

      - name: Production build
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run build

      - name: Welcome wiring guard
        run: |
          grep -q "Paymydinelogo.png" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
          grep -q "Your digital menu is ready to set up" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
          ! grep -q "locale" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
          grep -q "pmd-owner-welcome-r9" app/admin/assets/js/pmd-new-tenant-onboarding-r7.js
          grep -q "fetch('/api/v1/menu'" app/admin/assets/js/pmd-new-tenant-onboarding-r7.js
          grep -q "Build your digital menu" app/admin/assets/js/pmd-new-tenant-onboarding-r7.js
