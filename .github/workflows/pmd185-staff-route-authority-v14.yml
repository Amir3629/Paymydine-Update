name: PMD185 Staff Portal Route Authority V14

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  qa-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply canonical route authority patch
        run: python3 .github/pmd185_staff_route_authority_v14.py

      - name: PHP and route authority QA
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/admin/routes.php
          php -l app/main/routes.php
          php -l app/main/routes/main-app-before.php
          php -l routes/pmd-staff-portal-v1.php
          git diff --check
          grep -F "PMD_STAFF_PORTAL_V1_PUBLIC_ROUTE_LOADER" app/main/routes/main-app-before.php
          grep -F "require_once base_path('routes/pmd-staff-portal-v1.php');" app/main/routes/main-app-before.php
          grep -F "require_once __DIR__.'/next-proxy.php';" app/main/routes/main-app-before.php
          if grep -F "require_once base_path('routes/pmd-staff-portal-v1.php');" app/main/routes.php; then
            echo "ERROR: standalone Main loader still exists"
            exit 1
          fi
          if grep -F "require_once base_path('routes/pmd-staff-portal-v1.php');" app/admin/routes.php; then
            echo "ERROR: Admin loader returned"
            exit 1
          fi
          if grep -F "App::before" routes/pmd-staff-portal-v1.php; then
            echo "ERROR: nested App::before remains in Staff Portal route module"
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "app/main/routes.php"
          test "${changed[1]}" = "app/main/routes/main-app-before.php"
          test "${changed[2]}" = "routes/pmd-staff-portal-v1.php"

      - name: Commit reviewed V14 route authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main/routes.php app/main/routes/main-app-before.php routes/pmd-staff-portal-v1.php
          git commit -m 'Register Staff Portal before public catch-all (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
