name: ZCS Bridge Smali Inspect V20

on:
  push:
    branches:
      - fix/zcs-v124-settings-tables-reader
    paths:
      - '.github/workflows/zcs-bridge-smali-inspect-v20.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact 0.6.0 base
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 \
            'https://github.com/Amir3629/Paymydine-Update/releases/download/pmd-device-app-preview/PayMyDine-Device-App-0.6.0.apk' \
            -o base.apk
          echo '14a73d97ec5596019dfb5fbe4dcd20252fad8ae77adeae04f7df4c5b6513cff0  base.apk' | sha256sum -c -

      - name: Decode bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar' \
            -o apktool.jar
          java -jar apktool.jar d -f base.apk -o decoded
          BRIDGE="$(find decoded -type f -path '*com/paymydine/mobile/hardware/customerdisplay/PosCustomerDisplayJavascriptBridge.smali' -print -quit)"
          echo "BRIDGE=$BRIDGE"
          test -n "$BRIDGE"
          sed -n '1,320p' "$BRIDGE"
