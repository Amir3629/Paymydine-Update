name: PMD185 Shifts V11 compact hotfix

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  build-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply V11 patch
        run: python3 .github/pmd185_v11_compact_fix.py

      - name: Backend and JS syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/admin/controllers/Shifts.php
          node --check app/admin/assets/js/pmd-shifts-v1.js
          git diff --check

      - name: V11 invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "unique:staffs,staff_name" app/admin/controllers/Shifts.php
          grep -F "redirectTeamFailure" app/admin/controllers/Shifts.php
          grep -F "return $this->redirectTeamFailure($validator->errors()->first());" app/admin/controllers/Shifts.php
          grep -F "teamPasswordInput.required = enabled && !teamHasExistingAccess" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "teamUsernameInput.required = enabled" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "pmd-shifts-dashboard-reservations-v4.css?v=11" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "PMD_SHIFTS_COMPACT_OPERATIONS_V11" app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          grep -F "pmd-shifts__team-requests.is-empty" app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          grep -F "Kitchen capacity" app/admin/views/pmdshifts/index.blade.php
          grep -F ">PMD login<" app/admin/views/pmdshifts/index.blade.php
          if grep -F "Recommended for My Work" app/admin/views/pmdshifts/index.blade.php; then exit 1; fi
          if grep -F "Add or remove people for this Shift here" app/admin/views/pmdshifts/index.blade.php; then exit 1; fi

      - name: Exact product scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = "app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css"
          test "${changed[1]}" = "app/admin/assets/js/pmd-shifts-v1.js"
          test "${changed[2]}" = "app/admin/controllers/Shifts.php"
          test "${changed[3]}" = "app/admin/views/pmdshifts/index.blade.php"

      - name: Commit reviewed V11 product files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css \
            app/admin/assets/js/pmd-shifts-v1.js \
            app/admin/controllers/Shifts.php \
            app/admin/views/pmdshifts/index.blade.php
          git commit -m 'Fix Team save errors and compact Shifts UI (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
