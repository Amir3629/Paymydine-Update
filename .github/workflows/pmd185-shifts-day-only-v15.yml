name: PMD185 Shifts Day Only V15

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  qa-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply Shifts day-only V15
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/pmd185_shifts_day_only_v15.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css')
          path.write_text(path.read_text().rstrip() + '\n')
          PY

      - name: QA Shifts day-only V15
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/admin/assets/js/pmd-shifts-v1.js
          git diff --check

          VIEW="app/admin/views/pmdshifts/index.blade.php"
          JS="app/admin/assets/js/pmd-shifts-v1.js"
          CSS="app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css"

          grep -F "PMD_SHIFTS_DAY_ONLY_WORKSPACE_V15" "$VIEW"
          grep -F "data-pmd-shifts-day-surface" "$VIEW"
          grep -F "'open_hour_on_boot' => true" "$VIEW"
          ! grep -F "id=\"pmd-r2-calendar-surface-v160\"" "$VIEW"
          ! grep -F "class=\"pmd-yc-month is-month-view\"" "$VIEW"
          ! grep -F "data-pmd-shift-day-open" "$VIEW"

          grep -F "data-pmd-shifts-date-input" "$JS"
          grep -F "function openHourDay" "$JS"
          grep -F "function dayPageUrl" "$JS"
          grep -F "pmd-shifts-dashboard-reservations-v4.css?v=15" "$JS"
          ! grep -F "data-pmd-shifts-calendar-back" "$JS"
          ! grep -F "function loadCalendarUrl" "$JS"
          ! grep -F "data-pmd-shifts-month-nav" "$JS"

          grep -F "PMD_SHIFTS_DAY_ONLY_WORKSPACE_V15" "$CSS"
          grep -F "min-height:118px!important" "$CSS"
          grep -F "padding:15px!important" "$CSS"
          grep -F "font-size:30px!important" "$CSS"
          grep -F ".pmd-shifts-date-picker" "$CSS"

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          expected=(
            "app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css"
            "app/admin/assets/js/pmd-shifts-v1.js"
            "app/admin/views/pmdshifts/index.blade.php"
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

      - name: Commit Shifts day-only V15
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css \
            app/admin/assets/js/pmd-shifts-v1.js \
            app/admin/views/pmdshifts/index.blade.php
          git commit -m 'Make Shifts a day-only Dienstplan workspace (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
