name: PayMyDine Cashier V1.0.8 Print Routing

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cashier-desktop-print-routing-v108
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v108.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v108.yml'

permissions:
  contents: read

env:
  PMD_BRAND_LOGO_URL: https://tomo.paymydine.com/brand/paymydine-logo.svg

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V1.0.8 source and print-routing contract
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run brand:icon
          grep -q '"version": "1.0.8"' package.json
          grep -q 'PMD_CASHIER_PRINT_ROUTING_V108' src/main.js
          grep -q 'ORDER_CENTER_INVOICE_PATH' src/main.js
          grep -q 'isPrintableDocumentPath(parsed.pathname)' src/main.js
          grep -q 'hasConfiguredPrintTarget(readSettings())' src/main.js
          grep -q 'PMD_CASHIER_HARDWARE_TRUTH_V106' src/hardware.js
          grep -q 'PMD_HARDWARE_TRUTH_UI_V106' src/hardware-page.js
          grep -q 'PMD_CASHIER_HARDWARE_BRAND_V107' src/hardware.html
          grep -q 'PMD_CASHIER_SETUP_BRAND_V107' src/setup.html
          test -s src/paymydine-logo.svg
          test -s build/AppIcon.icon/icon.json
          test -s build/icon.svg
          echo 'PMD_V108_PRINT_ROUTING_CONTRACT=PASS'

  build-windows:
    needs: contract-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download Cashier V1.0.8 source without Windows git checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'apps/cashier-desktop'
          $files = @(
            'package.json',
            'scripts/apply-v104.js',
            'scripts/apply-v106.js',
            'scripts/apply-v108.js',
            'scripts/patch-chain-v106.js',
            'scripts/fetch-brand-icon.js',
            'scripts/after-sign-mac-v106.js',
            'src/main.js',
            'src/preload.js',
            'src/hardware.js',
            'src/receipt.js',
            'src/setup.html',
            'src/setup.js',
            'src/hardware.html',
            'src/hardware-page.js',
            'src/offline.html',
            'src/offline.js'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PayMyDine-Cashier-V108-Windows-Build'
          }
          foreach ($relative in $files) {
            $encodedPath = ($relative -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:PMD_REPOSITORY/contents/apps/cashier-desktop/$encodedPath`?ref=$env:PMD_REF"
            $item = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            if ($item.encoding -ne 'base64' -or [string]::IsNullOrWhiteSpace($item.content)) {
              throw "Unexpected GitHub response for $relative"
            }
            $destination = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String(($item.content -replace '\s', '')))
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Syntax and print-routing contract
        working-directory: apps/cashier-desktop
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path src/main.js -Pattern 'PMD_CASHIER_PRINT_ROUTING_V108' -Quiet | Out-Null
          if (-not $?) { throw 'V1.0.8 print routing marker missing after patch chain' }
          Select-String -Path src/main.js -Pattern 'ORDER_CENTER_INVOICE_PATH' -Quiet | Out-Null
          if (-not $?) { throw 'V1.0.8 invoice route missing after patch chain' }
      - name: Build Windows installer
        working-directory: apps/cashier-desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v108-windows
          path: apps/cashier-desktop/dist/PayMyDine-Cashier-Setup-1.0.8.exe
          if-no-files-found: error

  build-macos:
    needs: contract-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify macOS tooling
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun actool --version
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Syntax and contract
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build macOS app
        working-directory: apps/cashier-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Verify final bundle and signature
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name 'PayMyDine Cashier.app' -print -quit)"
          test -n "$app_path"
          test -s "$app_path/Contents/Resources/app.asar"
          test -s "$app_path/Contents/Resources/Assets.car"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          dmg_path="dist/PayMyDine-Cashier-1.0.8-mac-${{ matrix.arch }}.dmg"
          test -s "$dmg_path"
          echo "PACKAGED_APP=$app_path"
          echo "DMG=$dmg_path"
          echo 'PMD_V108_MAC_BUNDLE_SIGNATURE=VALID'
          spctl --assess --type execute --verbose=4 "$app_path" || true
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v108-macos-${{ matrix.arch }}
          path: apps/cashier-desktop/dist/PayMyDine-Cashier-1.0.8-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-preview:
    if: github.event_name != 'pull_request'
    needs: [contract-test, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pmd-v108-*
          path: release
          merge-multiple: true
      - name: Publish V1.0.8 packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s release/PayMyDine-Cashier-Setup-1.0.8.exe
          test -s release/PayMyDine-Cashier-1.0.8-mac-arm64.dmg
          test -s release/PayMyDine-Cashier-1.0.8-mac-x64.dmg
          tag='pmd-cashier-v1-preview'
          notes='PayMyDine Cashier V1.0.8: direct Desktop receipt/invoice routing without the Windows native print dialog, preserved Generic/Text raster printing, truthful hardware diagnostics, cash-drawer safety, fullscreen Cashier, Virtual PDF, and official PayMyDine branding.'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GH_REPO"
            gh release edit "$tag" --target "$GITHUB_SHA" --prerelease --title 'PayMyDine Cashier V1 Preview' --notes "$notes" --repo "$GH_REPO"
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title 'PayMyDine Cashier V1 Preview' --notes "$notes" --repo "$GH_REPO"
          fi
          echo 'PMD_V108_RELEASE_PUBLISHED'
