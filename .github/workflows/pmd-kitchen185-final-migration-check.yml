name: PMD Kitchen 185 Final Migration Check

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185
    paths:
      - '.github/workflows/pmd-kitchen185-final-migration-check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical PMD migration
        shell: bash
        run: |
          set -euo pipefail
          test -f app/system/database/migrations/2026_08_28_230000_create_pmd_kitchen_operations_foundation.php
          test ! -e app/database/migrations/2026_08_28_230000_create_pmd_kitchen_operations_foundation.php
          grep -F 'namespace System\Database\Migrations;' app/system/database/migrations/2026_08_28_230000_create_pmd_kitchen_operations_foundation.php
          php -l app/system/database/migrations/2026_08_28_230000_create_pmd_kitchen_operations_foundation.php
          git diff --check dd09751a199e35d76d0ba7f8e34e0291175574bb...HEAD
