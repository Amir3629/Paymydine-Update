name: PMD Menu Gallery V6

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - scripts/pmd-menu-gallery-v6-apply.py
      - .github/workflows/pmd-menu-gallery-v6.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903
          fetch-depth: 0

      - name: Apply V6 patch
        run: python3 scripts/pmd-menu-gallery-v6-apply.py

      - name: Validate Admin JavaScript syntax
        run: node --check app/admin/assets/js/pmd-menu-gallery-options-v6.js

      - name: Validate Admin asset manifest
        run: python3 -m json.tool app/admin/views/_meta/assets.json >/dev/null

      - name: Validate gallery persistence PHP
        run: php -l app/admin/traits/PmdMenuGalleryOptionsV1.php

      - name: Validate V6 markers
        run: |
          grep -q 'PMD_MENU_GALLERY_OPTIONS_V6_OWNER_PHOTOS' app/admin/assets/js/pmd-menu-gallery-options-v6.js
          grep -q 'PMD_MENU_GALLERY_OPTIONS_V6_OWNER_PHOTOS' app/admin/assets/css/pmd-menu-gallery-options-v6.css
          grep -q 'PMD_MENU_GALLERY_COVER_V6' app/admin/traits/PmdMenuGalleryOptionsV1.php
          grep -q 'pmd-menu-gallery-options-v6.js' app/admin/views/_meta/assets.json
          grep -q 'pmd-menu-gallery-options-v6.css' app/admin/views/_meta/assets.json

      - name: Diff safety
        run: |
          git diff --check
          printf '%s\n' \
            app/admin/assets/css/pmd-menu-gallery-options-v6.css \
            app/admin/assets/js/pmd-menu-gallery-options-v6.js \
            app/admin/traits/PmdMenuGalleryOptionsV1.php \
            app/admin/views/_meta/assets.json | sort > /tmp/expected
          git status --short | awk '{print $2}' | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit validated source changes
        run: |
          git config user.name 'Amir3629'
          git config user.email 'amirhossein.firoozi@hotmail.com'
          git add \
            app/admin/assets/css/pmd-menu-gallery-options-v6.css \
            app/admin/assets/js/pmd-menu-gallery-options-v6.js \
            app/admin/traits/PmdMenuGalleryOptionsV1.php \
            app/admin/views/_meta/assets.json
          git commit -m 'Menu: simplify photo editor and choose cover'
          git push origin HEAD:feature/menu-gallery-sides-options-20260903
