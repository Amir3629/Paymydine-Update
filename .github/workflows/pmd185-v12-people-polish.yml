name: PMD185 People V12 tiny polish

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0
      - name: Apply tiny People polish
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/admin/views/pmdpeople/index.blade.php')
          s = p.read_text()
          old = '<option value="{{ $key }}">{{ $label }}</option>'
          new = '<option value="{{ $key }}" {{ $key === \'other\' ? \'selected\' : \'\' }}>{{ $label }}</option>'
          if old not in s:
              raise SystemExit('quick add department anchor missing')
          s = s.replace(old, new, 1)
          old = "@if(!$fromManager && (string)$request->status === 'pending')"
          new = "@if(!$fromManager && in_array((string)$request->request_type, ['shift_change','time_off'], true) && (string)$request->status === 'pending')"
          if old not in s:
              raise SystemExit('request action anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -F "\$key === 'other' ? 'selected'" app/admin/views/pmdpeople/index.blade.php
          grep -F "['shift_change','time_off']" app/admin/views/pmdpeople/index.blade.php
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/admin/views/pmdpeople/index.blade.php"
      - name: Commit product polish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/views/pmdpeople/index.blade.php
          git commit -m 'Keep People creation and messages simple (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
