name: ZCS Customer Display APK V19

on:
  push:
    branches:
      - fix/zcs-customer-display-apk-v19
    paths:
      - 'app/admin/assets/js/pmd-quick-pos-v1.js'
      - 'app/admin/assets/js/pmd-qpos-web-parity-v112.js'
      - '.github/workflows/zcs-customer-display-apk-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/admin/assets/js/pmd-quick-pos-v1.js
            app/admin/assets/js/pmd-qpos-web-parity-v112.js
            .github/workflows/zcs-customer-display-apk-v19.yml
          sparse-checkout-cone-mode: false

      - name: Restore stable Device App signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paymydine-device-app-preview-keystore-v1

      - name: Require stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;35.0.0'

      - name: Download exact ZCS 0.5.9 base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='3384a692be5cbd9bee69461b8b3222458b3dcfc60cacad7b5b463fcbb73f8a9c'
          curl -fL --retry 2 --connect-timeout 10 --max-time 120 \
            'https://tomo.paymydine.com/public/downloads/paymydine/PayMyDine-Device-App-0.5.9.apk' \
            -o base-0.5.9.apk
          echo "$EXPECTED  base-0.5.9.apk" | sha256sum -c -

      - name: Record legacy signer
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs base-0.5.9.apk > base-cert.txt
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey > stable-cert.txt
          BASE_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-cert.txt | awk 'NR==1{print}' | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          STABLE_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' stable-cert.txt | awk 'NR==1{print}' | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          echo "Legacy 0.5.9 signer: $BASE_CERT"
          echo "Stable signer:       $STABLE_CERT"
          test -n "$BASE_CERT"
          test -n "$STABLE_CERT"
          if [[ "$BASE_CERT" == "$STABLE_CERT" ]]; then
            echo 'PMD_ANDROID_UPDATE_IN_PLACE=YES'
          else
            echo 'PMD_ANDROID_UPDATE_IN_PLACE=NO'
          fi

      - name: Validate V121 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app/admin/assets/js/pmd-quick-pos-v1.js
          node --check app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_SETTINGS_CARD_V119' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CACHED_IMAGE_V121' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CONTEXT_V121' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'pushCustomerDisplayTestOrder' app/admin/assets/js/pmd-qpos-web-parity-v112.js

      - name: Replace only bundled Quick POS assets
        shell: bash
        run: |
          set -euo pipefail
          zipinfo -1 base-0.5.9.apk > base-entries.txt
          echo '--- matching bundled POS assets ---'
          grep -E 'pmd-(quick-pos-v1|qpos-web-parity-v112)[.]js$' base-entries.txt || true

          QUICK_PATH="$(awk '/(^|\/)pmd-quick-pos-v1[.]js$/{if(!found){print;found=1}}' base-entries.txt)"
          PARITY_PATH="$(awk '/(^|\/)pmd-qpos-web-parity-v112[.]js$/{if(!found){print;found=1}}' base-entries.txt)"
          echo "QUICK_PATH=$QUICK_PATH"
          echo "PARITY_PATH=$PARITY_PATH"
          test -n "$QUICK_PATH"
          test -n "$PARITY_PATH"

          rm -rf patch-root
          mkdir -p "patch-root/$(dirname "$QUICK_PATH")"
          mkdir -p "patch-root/$(dirname "$PARITY_PATH")"
          cp app/admin/assets/js/pmd-quick-pos-v1.js "patch-root/$QUICK_PATH"
          cp app/admin/assets/js/pmd-qpos-web-parity-v112.js "patch-root/$PARITY_PATH"

          cp base-0.5.9.apk unsigned-r2.apk
          zip -q -d unsigned-r2.apk \
            'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' \
            'META-INF/*.SF' 'META-INF/*.MF' || true

          (
            cd patch-root
            zip -q -0 ../unsigned-r2.apk "$QUICK_PATH" "$PARITY_PATH"
          )

          unzip -p unsigned-r2.apk "$QUICK_PATH" > patched-quick.js
          unzip -p unsigned-r2.apk "$PARITY_PATH" > patched-parity.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CACHED_IMAGE_V121' patched-quick.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_SETTINGS_CARD_V119' patched-parity.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CONTEXT_V121' patched-parity.js
          grep -Fq 'pushCustomerDisplayTestOrder' patched-parity.js

      - name: Align and sign stable 0.5.9-r2
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK='PayMyDine-Device-App-0.5.9-r2.apk'

          "$ZIPALIGN" -f -p 4 unsigned-r2.apk aligned-r2.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$APK" \
            aligned-r2.apk

          "$ZIPALIGN" -c -p 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > final-cert.txt
          cat final-cert.txt

      - name: Verify package, V121 assets, and ZCS SDK
        shell: bash
        run: |
          set -euo pipefail
          APK='PayMyDine-Device-App-0.5.9-r2.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT" dump badging "$APK" > badging.txt
          BADGING="$(sed -n '1p' badging.txt)"
          echo "$BADGING"
          grep -Fq "package: name='com.paymydine.mobile.pospreview'" <<<"$BADGING"
          grep -Fq "versionCode='72'" <<<"$BADGING"
          grep -Fq "versionName='0.5.9-device-app-v18-debug'" <<<"$BADGING"

          zipinfo -1 "$APK" > final-entries.txt
          QUICK_PATH="$(awk '/(^|\/)pmd-quick-pos-v1[.]js$/{if(!found){print;found=1}}' final-entries.txt)"
          PARITY_PATH="$(awk '/(^|\/)pmd-qpos-web-parity-v112[.]js$/{if(!found){print;found=1}}' final-entries.txt)"
          unzip -p "$APK" "$QUICK_PATH" > final-quick.js
          unzip -p "$APK" "$PARITY_PATH" > final-parity.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CACHED_IMAGE_V121' final-quick.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_SETTINGS_CARD_V119' final-parity.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CONTEXT_V121' final-parity.js
          grep -Fq 'pushCustomerDisplayTestOrder' final-parity.js

          grep -E '^classes[0-9]*[.]dex$' final-entries.txt > dex-list.txt
          FOUND_DRIVER=0
          FOUND_DISPLAY_API=0
          while IFS= read -r DEX; do
            unzip -p "$APK" "$DEX" > one.dex
            strings one.dex > dex-strings.txt
            if grep -Eq 'com[./]zcs/sdk/DriverManager' dex-strings.txt; then
              FOUND_DRIVER=1
            fi
            if grep -Fq 'showBitmapOnSecondaryScreen' dex-strings.txt; then
              FOUND_DISPLAY_API=1
            fi
          done < dex-list.txt
          test "$FOUND_DRIVER" -eq 1
          test "$FOUND_DISPLAY_API" -eq 1
          grep -Fq 'lib/arm64-v8a/libSmartPosJni.so' final-entries.txt
          grep -Fq 'lib/armeabi-v7a/libSmartPosJni.so' final-entries.txt

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey > stable-cert-final.txt
          FINAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' final-cert.txt | awk 'NR==1{print}' | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          STABLE_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' stable-cert-final.txt | awk 'NR==1{print}' | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          test "$FINAL_CERT" = "$STABLE_CERT"

          echo 'PMD_ZCS_SDK_PRESERVED=PASS'
          echo 'PMD_CUSTOMER_DISPLAY_V121_BUNDLED=PASS'
          echo 'PMD_STABLE_SIGNING_KEY=PASS'

          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: PayMyDine-Device-App-0.5.9-r2-ZCS-V19
          path: |
            PayMyDine-Device-App-0.5.9-r2.apk
            PayMyDine-Device-App-0.5.9-r2.apk.sha256
          if-no-files-found: error

      - name: Publish verified 0.5.9-r2 preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pmd-device-app-preview
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            PayMyDine-Device-App-0.5.9-r2.apk \
            PayMyDine-Device-App-0.5.9-r2.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
