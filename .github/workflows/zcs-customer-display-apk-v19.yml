name: ZCS Customer Display APK V19

on:
  push:
    branches:
      - fix/zcs-customer-display-apk-v19
    paths:
      - 'app/admin/assets/js/pmd-quick-pos-v1.js'
      - 'app/admin/assets/js/pmd-qpos-web-parity-v112.js'
      - '.github/workflows/zcs-customer-display-apk-v19.yml'

permissions:
  contents: write

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore Device App preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paymydine-device-app-preview-keystore-v1

      - name: Require existing signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"

      - name: Install Android tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;35.0.0'

      - name: Download exact installed 0.5.9 base APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='3384a692be5cbd9bee69461b8b3222458b3dcfc60cacad7b5b463fcbb73f8a9c'
          FILE='base-0.5.9.apk'
          URLS=(
            'https://tomo.paymydine.com/public/downloads/paymydine/PayMyDine-Device-App-0.5.9.apk'
            'https://tomo.paymydine.com/downloads/paymydine/PayMyDine-Device-App-0.5.9.apk'
            'https://paymydine.com/public/downloads/paymydine/PayMyDine-Device-App-0.5.9.apk'
          )
          ok=0
          for url in "${URLS[@]}"; do
            echo "Trying $url"
            if curl -fL --retry 2 --connect-timeout 10 --max-time 120 "$url" -o "$FILE"; then
              ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
              if [[ "$ACTUAL" == "$EXPECTED" ]]; then
                ok=1
                break
              fi
              echo "Downloaded file hash mismatch: $ACTUAL"
            fi
          done
          if [[ "$ok" != 1 ]]; then
            echo "Could not retrieve the exact 0.5.9 APK."
            exit 1
          fi
          echo "$EXPECTED  $FILE" | sha256sum -c -

      - name: Record APK signing compatibility
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BASE_CERT="$("$APKSIGNER" verify --print-certs base-0.5.9.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          KEY_CERT="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          echo "Base cert: $BASE_CERT"
          echo "Stable key cert: $KEY_CERT"
          test -n "$BASE_CERT"
          test -n "$KEY_CERT"
          if [[ "$BASE_CERT" == "$KEY_CERT" ]]; then
            echo 'PMD_ANDROID_UPDATE_IN_PLACE=YES'
          else
            echo 'PMD_ANDROID_UPDATE_IN_PLACE=NO'
            echo 'The 0.5.9 build used a one-off signing key; 0.6.0 requires one clean reinstall.'
          fi

      - name: Install apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2             https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar             -o apktool.jar
          test -s apktool.jar

      - name: Decode and patch bundled Quick POS
        shell: bash
        run: |
          set -euo pipefail
          node --check app/admin/assets/js/pmd-quick-pos-v1.js
          node --check app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_SETTINGS_CARD_V119' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CACHED_IMAGE_V121' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CONTEXT_V121' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'pushCustomerDisplayTestOrder' app/admin/assets/js/pmd-qpos-web-parity-v112.js

          java -jar apktool.jar d -f base-0.5.9.apk -o decoded

          test -f decoded/assets/pmd-canonical/js/pmd-quick-pos-v1.js
          test -f decoded/assets/pmd-canonical/js/pmd-qpos-web-parity-v112.js

          cp app/admin/assets/js/pmd-quick-pos-v1.js             decoded/assets/pmd-canonical/js/pmd-quick-pos-v1.js
          cp app/admin/assets/js/pmd-qpos-web-parity-v112.js             decoded/assets/pmd-canonical/js/pmd-qpos-web-parity-v112.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('decoded/apktool.yml')
          s=p.read_text()
          import re
          s,n1=re.subn(r"versionCode:\s*'?72'?", "versionCode: '73'", s, count=1)
          s,n2=re.subn(r"versionName:\s*'?0\.5\.9-device-app-v18-debug'?", "versionName: 0.6.0-device-app-v19-debug", s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"version patch failed code={n1} name={n2}")
          p.write_text(s)
          PY

      - name: Rebuild and sign 0.6.0
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b decoded -o unsigned.apk

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$ZIPALIGN" -f -p 4 unsigned.apk aligned.apk
          "$APKSIGNER" sign             --ks "$HOME/.android/debug.keystore"             --ks-pass pass:android             --ks-key-alias androiddebugkey             --key-pass pass:android             --out PayMyDine-Device-App-0.6.0.apk             aligned.apk

          "$APKSIGNER" verify --verbose --print-certs PayMyDine-Device-App-0.6.0.apk

          BADGING="$("$AAPT" dump badging PayMyDine-Device-App-0.6.0.apk | head -1)"
          echo "$BADGING"
          grep -Fq "package: name='com.paymydine.mobile.pospreview'" <<<"$BADGING"
          grep -Fq "versionCode='73'" <<<"$BADGING"
          grep -Fq "versionName='0.6.0-device-app-v19-debug'" <<<"$BADGING"

          unzip -p PayMyDine-Device-App-0.6.0.apk             assets/pmd-canonical/js/pmd-qpos-web-parity-v112.js             | grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_CACHED_IMAGE_V121'

          unzip -p PayMyDine-Device-App-0.6.0.apk             assets/pmd-canonical/js/pmd-qpos-web-parity-v112.js             | grep -Fq 'PMD_ZCS_CUSTOMER_DISPLAY_SETTINGS_CARD_V119'

          sha256sum PayMyDine-Device-App-0.6.0.apk             > PayMyDine-Device-App-0.6.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PayMyDine-Device-App-0.6.0-ZCS-V19
          path: |
            PayMyDine-Device-App-0.6.0.apk
            PayMyDine-Device-App-0.6.0.apk.sha256
          if-no-files-found: error

      - name: Publish verified 0.6.0 preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pmd-device-app-preview
        run: |
          set -euo pipefail
          gh release upload "$TAG"             PayMyDine-Device-App-0.6.0.apk             PayMyDine-Device-App-0.6.0.apk.sha256             --repo "$GITHUB_REPOSITORY"             --clobber
