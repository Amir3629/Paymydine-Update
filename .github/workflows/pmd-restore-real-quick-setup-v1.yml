name: PMD Restore Real Quick Setup V1

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - .github/workflows/pmd-restore-real-quick-setup-v1.yml

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Restore original Quick Setup files
        shell: bash
        run: |
          set -euo pipefail
          OLD="e410c18cb48368f22f9522b337e65e92fb7a4ac9"
          PRE_R9="441a3bbdd89b8c0500d7a29e080e9293586ec89b"
          git fetch origin feature/tenant-quick-setup-v1
          git cat-file -e "$OLD^{commit}"
          git cat-file -e "$PRE_R9^{commit}"
          git checkout "$OLD" -- \
            app/admin/Services/PmdTenantQuickSetupService.php \
            app/admin/Services/PmdStarterMenuLibraryV1.php \
            app/admin/controllers/Pmdquicksetup.php \
            app/admin/views/pmdquicksetup/index.blade.php \
            app/admin/assets/css/pmd-tenant-quick-setup-v1.css \
            app/admin/assets/js/pmd-tenant-quick-setup-v1.js \
            app/admin/assets/css/pmd-onboarding-welcome-v1.css \
            app/admin/assets/js/pmd-onboarding-welcome-v1.js
          git checkout "$PRE_R9" -- app/admin/assets/js/pmd-new-tenant-onboarding-r7.js

      - name: Adapt original flow to current clean routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          welcome = Path('app/admin/assets/js/pmd-onboarding-welcome-v1.js')
          text = welcome.read_text()
          old = "if (path !== '/admin/dashboardlab') return;"
          new = "if (path !== '/admin/dashboardlab' && path !== '/admin/ownerdashboard') return;"
          if old not in text:
              raise SystemExit('old welcome path guard not found')
          welcome.write_text(text.replace(old, new, 1))

          splash = Path('frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx')
          text = splash.read_text()
          if 'href="/admin"' not in text:
              raise SystemExit('customer setup link not found')
          splash.write_text(text.replace('href="/admin"', 'href="/admin/pmdquicksetup"', 1))

          manifest = Path('app/admin/views/_meta/assets.json')
          data = json.loads(manifest.read_text())
          style_path = 'css/pmd-onboarding-welcome-v1.css'
          script_path = 'js/pmd-onboarding-welcome-v1.js'
          if not any(x.get('path') == style_path for x in data.get('style', [])):
              data.setdefault('style', []).append({'path': style_path, 'name': 'pmd-onboarding-welcome-v1-css'})
          if not any(x.get('path') == script_path for x in data.get('script', [])):
              data.setdefault('script', []).append({'path': script_path, 'name': 'pmd-onboarding-welcome-v1-js'})
          manifest.write_text(json.dumps(data, separators=(',', ':')))
          PY

      - name: Validate PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          php -l app/admin/Services/PmdTenantQuickSetupService.php
          php -l app/admin/Services/PmdStarterMenuLibraryV1.php
          php -l app/admin/controllers/Pmdquicksetup.php
          node --check app/admin/assets/js/pmd-tenant-quick-setup-v1.js
          node --check app/admin/assets/js/pmd-onboarding-welcome-v1.js
          node --check app/admin/assets/js/pmd-new-tenant-onboarding-r7.js
          python3 -m json.tool app/admin/views/_meta/assets.json >/dev/null

      - name: Contract guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Restaurant type" app/admin/views/pmdquicksetup/index.blade.php
          grep -q "Floors & tables" app/admin/views/pmdquicksetup/index.blade.php
          grep -q "data-pmd-staff-count" app/admin/views/pmdquicksetup/index.blade.php
          grep -q "Kitchen displays" app/admin/views/pmdquicksetup/index.blade.php
          grep -q "pmd_onboarding_status" app/admin/Services/PmdTenantQuickSetupService.php
          grep -q "/admin/pmdquicksetup" app/admin/assets/js/pmd-onboarding-welcome-v1.js
          grep -q "/admin/ownerdashboard" app/admin/assets/js/pmd-onboarding-welcome-v1.js
          grep -q 'href="/admin/pmdquicksetup"' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
          ! grep -q "pmd-owner-welcome-r9" app/admin/assets/js/pmd-new-tenant-onboarding-r7.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/package-lock.json

      - name: Install frontend
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run build

      - name: Commit restored Quick Setup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PayMyDine CI"
          git config user.email "ci@paymydine.local"
          git add \
            app/admin/Services/PmdTenantQuickSetupService.php \
            app/admin/Services/PmdStarterMenuLibraryV1.php \
            app/admin/controllers/Pmdquicksetup.php \
            app/admin/views/pmdquicksetup/index.blade.php \
            app/admin/assets/css/pmd-tenant-quick-setup-v1.css \
            app/admin/assets/js/pmd-tenant-quick-setup-v1.js \
            app/admin/assets/css/pmd-onboarding-welcome-v1.css \
            app/admin/assets/js/pmd-onboarding-welcome-v1.js \
            app/admin/assets/js/pmd-new-tenant-onboarding-r7.js \
            app/admin/views/_meta/assets.json \
            frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Restore original tenant Quick Setup V1"
          git push origin HEAD:feature/menu-gallery-sides-options-20260903
