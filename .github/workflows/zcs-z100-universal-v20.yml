name: PayMyDine ZCS Z100 Universal V20

on:
  push:
    branches:
      - fix/zcs-v124-settings-tables-reader
      - main
    paths:
      - 'mobile/android/**'
      - 'app/admin/assets/js/pmd-quick-pos-v1.js'
      - 'app/admin/assets/js/pmd-qpos-web-parity-v112.js'
      - 'app/admin/assets/css/pmd-quick-pos-v1.css'
      - 'app/admin/assets/css/pmd-qpos-web-parity-v112.css'
      - '.github/workflows/zcs-z100-universal-v20.yml'
  workflow_dispatch:

concurrency:
  group: pmd-zcs-z100-v20-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-zcs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mobile/android
            app/admin/assets/css
            app/admin/assets/js
            app/admin/assets/images
            .github/workflows/zcs-z100-universal-v20.yml
          sparse-checkout-cone-mode: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable Device App signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paymydine-device-app-preview-keystore-v1

      - name: Require stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"

      - name: Inject verified official ZCS SmartPos SDK
        shell: bash
        run: |
          set -euo pipefail
          bash mobile/android/scripts/prepare_zcs_sdk.sh
          test -f mobile/android/app/libs/SmartPos_2.0.6_R260615.aar
          echo 'fe2269746167064571ae23fc655838f203436deeb145606ff5c2d34b0054db18  mobile/android/app/libs/SmartPos_2.0.6_R260615.aar' | sha256sum -c -

      - name: Validate Quick POS V124 assets
        shell: bash
        run: |
          set -euo pipefail
          node --check app/admin/assets/js/pmd-quick-pos-v1.js
          node --check app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ZCS_AUTOMATIC_SETTINGS_V124' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ANDROID_NATIVE_BRIDGE_TABLE_GUARD_V124' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'PMD_ANDROID_NATIVE_VISUAL_CACHE_GUARD_V124' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          grep -Fq 'Test NFC / card reader' app/admin/assets/js/pmd-qpos-web-parity-v112.js
          if grep -Fq 'data-pmd-customer-display-enabled' app/admin/assets/js/pmd-qpos-web-parity-v112.js; then
            echo 'ERROR: customer display Enabled toggle still exists.'
            exit 1
          fi
          if grep -Fq 'data-pmd-customer-display-images' app/admin/assets/js/pmd-qpos-web-parity-v112.js; then
            echo 'ERROR: customer display image toggle still exists.'
            exit 1
          fi

      - name: Unit tests
        working-directory: mobile/android
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble universal Device App
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug

      - name: Verify ZCS Device App 0.6.1
        shell: bash
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APK"
          "$AAPT" dump badging "$APK" > badging.txt
          BADGING="$(sed -n '1p' badging.txt)"
          echo "$BADGING"
          grep -Fq "package: name='com.paymydine.mobile.pospreview'" <<<"$BADGING"
          grep -Fq "versionCode='74'" <<<"$BADGING"
          grep -Fq "versionName='0.6.1-device-app-v20-debug'" <<<"$BADGING"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          zipinfo -1 "$APK" > entries.txt
          grep -Fq 'assets/pmd-canonical/js/pmd-qpos-web-parity-v112.js' entries.txt
          grep -Fq 'assets/pmd-canonical/js/pmd-quick-pos-v1.js' entries.txt

          unzip -p "$APK" assets/pmd-canonical/js/pmd-qpos-web-parity-v112.js > parity.js
          grep -Fq 'PMD_ZCS_AUTOMATIC_SETTINGS_V124' parity.js
          grep -Fq 'PMD_ANDROID_NATIVE_BRIDGE_TABLE_GUARD_V124' parity.js
          grep -Fq 'PMD_ANDROID_NATIVE_VISUAL_CACHE_GUARD_V124' parity.js
          grep -Fq 'Test NFC / card reader' parity.js

          grep -E '^classes[0-9]*[.]dex$' entries.txt > dex-list.txt
          FOUND_DRIVER=0
          FOUND_DISPLAY_API=0
          FOUND_CARD_READER=0
          FOUND_HW_CAPABILITIES=0
          while IFS= read -r DEX; do
            unzip -p "$APK" "$DEX" > one.dex
            strings one.dex > dex-strings.txt
            if grep -Eq 'com[./]zcs/sdk/DriverManager' dex-strings.txt; then
              FOUND_DRIVER=1
            fi
            if grep -Fq 'showBitmapOnSecondaryScreen' dex-strings.txt; then
              FOUND_DISPLAY_API=1
            fi
            if grep -Eq 'com[./]zcs/sdk/card/CardReaderManager' dex-strings.txt; then
              FOUND_CARD_READER=1
            fi
            if grep -Fq 'deviceHardwareCapabilities' dex-strings.txt; then
              FOUND_HW_CAPABILITIES=1
            fi
          done < dex-list.txt

          test "$FOUND_DRIVER" -eq 1
          test "$FOUND_DISPLAY_API" -eq 1
          test "$FOUND_CARD_READER" -eq 1
          test "$FOUND_HW_CAPABILITIES" -eq 1
          grep -Fq 'lib/arm64-v8a/libSmartPosJni.so' entries.txt
          grep -Fq 'lib/armeabi-v7a/libSmartPosJni.so' entries.txt

          echo 'PMD_ZCS_DRIVER=PASS'
          echo 'PMD_ZCS_SECOND_SCREEN_API=PASS'
          echo 'PMD_ZCS_CONTACTLESS_READER_SDK=PASS'
          echo 'PMD_CONTACTLESS_DIAGNOSTICS_BRIDGE=PASS'
          echo 'PMD_V124_TABLE_GUARD_BUNDLED=PASS'
          echo 'PMD_V124_AUTOMATIC_SETTINGS_BUNDLED=PASS'

      - name: Prepare canonical APK
        shell: bash
        run: |
          set -euo pipefail
          APK_IN='mobile/android/app/build/outputs/apk/debug/app-debug.apk'
          APK_OUT='mobile/android/PayMyDine-Device-App-0.6.1.apk'
          cp "$APK_IN" "$APK_OUT"
          sha256sum "$APK_OUT" > "$APK_OUT.sha256"
          cat "$APK_OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: PayMyDine-Device-App-0.6.1-ZCS-V20
          path: |
            mobile/android/PayMyDine-Device-App-0.6.1.apk
            mobile/android/PayMyDine-Device-App-0.6.1.apk.sha256
          if-no-files-found: error

      - name: Publish canonical Device App preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pmd-device-app-preview
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            mobile/android/PayMyDine-Device-App-0.6.1.apk \
            mobile/android/PayMyDine-Device-App-0.6.1.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
