name: PMD185 People V12 final verify

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/admin/controllers/People.php
          node --check app/admin/assets/js/pmd-shifts-v1.js
          git diff --check 55d533dbf92d04466e2154f99e5740bd99cb0a14...HEAD

      - name: Runtime invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "class People extends AdminController" app/admin/controllers/People.php
          grep -F "Roster-first save" app/admin/controllers/People.php
          grep -F "request_type' => 'manager_message'" app/admin/controllers/People.php
          grep -F "admin_url('people/saveperson')" app/admin/views/pmdpeople/index.blade.php
          grep -F "admin_url('people/saveaccess')" app/admin/views/pmdpeople/index.blade.php
          grep -F "admin_url('people/sendmessage')" app/admin/views/pmdpeople/index.blade.php
          grep -F "Access only" app/admin/views/pmdpeople/index.blade.php
          grep -F "href=\"{{ admin_url('people') }}\"" app/admin/views/pmdshifts/index.blade.php
          grep -F "/admin/people?person=" app/admin/assets/js/pmd-shifts-v1.js
          grep -F "nav.people" app/admin/views/_partials/pmd_side_menu2_single_menu.blade.php
          grep -F "manager_message" app/admin/views/pmdmywork/index.blade.php

      - name: Exact V11 to V12 product scope
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=55d533dbf92d04466e2154f99e5740bd99cb0a14
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD -- app | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 8
          expected=(
            "app/admin/assets/css/pmd-people-v1.css"
            "app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css"
            "app/admin/assets/js/pmd-shifts-v1.js"
            "app/admin/controllers/People.php"
            "app/admin/views/_partials/pmd_side_menu2_single_menu.blade.php"
            "app/admin/views/pmdmywork/index.blade.php"
            "app/admin/views/pmdpeople/index.blade.php"
            "app/admin/views/pmdshifts/index.blade.php"
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
