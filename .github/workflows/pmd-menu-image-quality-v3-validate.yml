name: PMD Menu Image Quality V3 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - app/admin/assets/js/pmd-menu-image-quality-v3.js
      - app/admin/views/_meta/assets.json
      - .github/workflows/pmd-menu-image-quality-v3-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903
      - name: Admin JS syntax
        run: node --check app/admin/assets/js/pmd-menu-image-quality-v3.js
      - name: Manifest JSON
        run: python3 -m json.tool app/admin/views/_meta/assets.json >/dev/null
      - name: Non-blocking markers
        run: |
          grep -q "PMD_MENU_IMAGE_QUALITY_V3_NON_BLOCKING" app/admin/assets/js/pmd-menu-image-quality-v3.js
          grep -q "Photo added · quality could be better" app/admin/assets/js/pmd-menu-image-quality-v3.js
          grep -q "pmd-menu-image-quality-v3" app/admin/views/_meta/assets.json
          ! grep -q "MutationObserver" app/admin/assets/js/pmd-menu-image-quality-v3.js
          ! grep -q "DataTransfer" app/admin/assets/js/pmd-menu-image-quality-v3.js
          ! grep -q "stopImmediatePropagation" app/admin/assets/js/pmd-menu-image-quality-v3.js
