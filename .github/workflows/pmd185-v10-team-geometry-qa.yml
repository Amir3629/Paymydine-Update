name: PMD185 Shifts v10 team geometry QA

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  team-geometry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Align final Team modal authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css')
          css = path.read_text()
          old_card = 'body.pmd-shifts-page .pmd-shifts__team-card{width:min(880px,calc(100vw - 28px))!important}'
          new_card = 'body.pmd-shifts-page .pmd-shifts__team-card{width:min(1080px,calc(100vw - 30px))!important}'
          old_layout = 'body.pmd-shifts-page .pmd-shifts__team-layout{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:18px;padding:18px}'
          new_layout = 'body.pmd-shifts-page .pmd-shifts__team-layout{display:grid;grid-template-columns:minmax(280px,340px) minmax(250px,1fr) minmax(250px,1fr);gap:16px;padding:18px}'
          if old_card not in css: raise SystemExit('team card authority missing')
          if old_layout not in css: raise SystemExit('team layout authority missing')
          css = css.replace(old_card, new_card, 1).replace(old_layout, new_layout, 1)
          css += '''\n/* PMD_SHIFTS_TEAM_GEOMETRY_V10 */\n@media(max-width:1100px) and (min-width:761px){body.pmd-shifts-page .pmd-shifts__team-layout{grid-template-columns:minmax(280px,340px) minmax(0,1fr)}body.pmd-shifts-page .pmd-shifts__team-requests{grid-column:1/-1}}\n'''
          path.write_text(css)
          PY

      - name: QA
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -F 'width:min(1080px,calc(100vw - 30px))!important' app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          grep -F 'grid-template-columns:minmax(280px,340px) minmax(250px,1fr) minmax(250px,1fr)' app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          grep -F 'PMD_SHIFTS_TEAM_GEOMETRY_V10' app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -Fx 'app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css'

      - name: Commit geometry fix
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          git commit -m 'Finish unified Shifts Team modal geometry (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
