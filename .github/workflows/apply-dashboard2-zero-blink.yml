name: Apply Dashboard2 Zero Blink

on:
  push:
    branches:
      - fix/dashboard2-zero-blink
    paths:
      - scripts/pmd_fix_dashboard2_zero_blink_v1410.py
      - .github/workflows/apply-dashboard2-zero-blink.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard2-zero-blink
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/pmd_fix_dashboard2_zero_blink_v1410.py

      - name: Validate JavaScript syntax
        run: node --check app/admin/assets/js/pmd-dashboard2-kpis-v1.js

      - name: Validate patch invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          JS="app/admin/assets/js/pmd-dashboard2-kpis-v1.js"
          BLADE="app/admin/views/dashboard2_reservations2_exact.blade.php"

          grep -Fq "PMD_DASHBOARD2_V1410_ZERO_BLINK_CANONICAL_BOOT" "$JS"
          grep -Fq "pmd.dashboard2.salesChartMode.v1" "$JS"
          ! grep -Fq "pmd-dashboard2-chart-mode" "$JS"
          grep -Fq "dashboard2-v1410-zero-blink" "$BLADE"
          grep -Fq "initialVisibleCount" "$JS"
          grep -Fq "disabled-by-v1410" "$JS"
          git diff --check

      - name: Commit patched production files
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/admin/assets/js/pmd-dashboard2-kpis-v1.js \
            app/admin/views/dashboard2_reservations2_exact.blade.php

          git commit -m "Fix Dashboard2 initial chart blink"
          git push origin HEAD:fix/dashboard2-zero-blink
