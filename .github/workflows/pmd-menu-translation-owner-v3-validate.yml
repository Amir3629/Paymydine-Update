name: PMD Menu Translation Ownership V3 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - app/admin/assets/js/pmd-menu-content-translations-v2.js
      - app/admin/assets/js/pmd-category-content-translations-v1.js
      - app/admin/assets/css/pmd-category-content-translations-v1.css
      - app/admin/traits/PmdMenuContentTranslationsV1.php
      - app/admin/views/_meta/assets.json
      - app/main/routes/pmd-category-content-translations-v1.php
      - app/main/routes/main-app-before.php
      - .github/workflows/pmd-menu-translation-owner-v3-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903

      - name: JavaScript syntax
        run: |
          node --check app/admin/assets/js/pmd-menu-content-translations-v2.js
          node --check app/admin/assets/js/pmd-category-content-translations-v1.js

      - name: PHP syntax
        run: |
          php -l app/admin/traits/PmdMenuContentTranslationsV1.php
          php -l app/main/routes/pmd-category-content-translations-v1.php
          php -l app/main/routes/main-app-before.php

      - name: Manifest JSON
        run: python3 -m json.tool app/admin/views/_meta/assets.json >/dev/null

      - name: Translation ownership assertions
        run: |
          grep -q "PMD_MENU_TRANSLATION_ACTIVE_ADMIN_SOURCE_V3" app/admin/traits/PmdMenuContentTranslationsV1.php
          grep -q "activeAdminLocale" app/admin/assets/js/pmd-menu-content-translations-v2.js
          grep -q "pmd_menu_translation_source_locale" app/admin/assets/js/pmd-menu-content-translations-v2.js
          ! grep -q "selectedCategories" app/admin/assets/js/pmd-menu-content-translations-v2.js
          ! grep -q "\[categories\]" app/admin/assets/js/pmd-menu-content-translations-v2.js
          ! grep -q "translation\['categories'\]" app/admin/traits/PmdMenuContentTranslationsV1.php
          grep -q "PMD_CATEGORY_CONTENT_TRANSLATIONS_V1" app/main/routes/pmd-category-content-translations-v1.php
          grep -q "pmd_category_translation_source_locale" app/admin/assets/js/pmd-category-content-translations-v1.js
          grep -q "pmd-category-content-translations-v1.php" app/main/routes/main-app-before.php
          grep -q "pmd-menu-content-translations-v2.js" app/admin/views/_meta/assets.json
          grep -q "pmd-category-content-translations-v1.js" app/admin/views/_meta/assets.json
