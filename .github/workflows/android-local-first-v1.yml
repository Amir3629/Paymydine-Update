name: PayMyDine Android Local-First V1

on:
  push:
    branches: [feature/android-local-first-v1]
    paths:
      - 'mobile/android/**'
      - 'docs/ANDROID_LOCAL_FIRST_ARCHITECTURE_V1.md'
      - 'app/Services/PmdMobileSync/**'
      - 'app/Http/Controllers/PmdMobile*.php'
      - 'app/Services/PmdSiteAccessService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/admin/controllers/Login.php'
      - 'app/admin/routes.php'
      - 'app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php'
      - 'routes/pmd-mobile-sync-v1.php'
      - '.github/workflows/android-local-first-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'docs/ANDROID_LOCAL_FIRST_ARCHITECTURE_V1.md'
      - 'app/Services/PmdMobileSync/**'
      - 'app/Http/Controllers/PmdMobile*.php'
      - 'app/Services/PmdSiteAccessService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/admin/controllers/Login.php'
      - 'app/admin/routes.php'
      - 'app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php'
      - 'routes/pmd-mobile-sync-v1.php'
      - '.github/workflows/android-local-first-v1.yml'

concurrency:
  group: pmd-android-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          php -l app/Services/PmdMobileSync/PmdMobileDeviceAuthService.php
          php -l app/Services/PmdMobileSync/PmdMobileBootstrapService.php
          php -l app/Services/PmdMobileSync/PmdMobilePairingService.php
          php -l app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          php -l app/Http/Controllers/PmdMobileBootstrapController.php
          php -l app/Http/Controllers/PmdMobileEdgeController.php
          php -l app/Http/Controllers/PmdMobileSyncController.php
          php -l app/Http/Controllers/PmdMobilePairController.php
          php -l app/Http/Controllers/PmdMobileKdsController.php
          php -l app/Http/Controllers/PmdMobilePosSessionController.php
          php -l app/Http/Middleware/PmdSiteAccessGateMiddleware.php
          php -l app/Services/PmdSiteAccessService.php
          php -l app/Services/SuperAdminTenantLifecycleService.php
          php -l app/admin/controllers/Login.php
          php -l app/admin/controllers/PmdWaiterPosV1.php
          php -l app/admin/controllers/KitchenDisplay.php
          php -l app/admin/controllers/concerns/PmdWaiterPosBootstrapConcern.php
          php -l app/admin/controllers/concerns/PmdWaiterPosSaveEndpoint.php
          php -l routes.php
          php -l routes/pmd-mobile-sync-v1.php
      - name: Safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "trustedDeviceByRawToken" app/Services/PmdSiteAccessService.php
          grep -q "rotateTrustedDeviceToken" app/Services/PmdSiteAccessService.php
          grep -q "pmd_sync_commands" app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          grep -q "pmd_sync_events" app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          grep -q "ensureMobileSyncSchema" app/Services/SuperAdminTenantLifecycleService.php
          grep -q "ORDER_SEND_V1" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "KDS_STATUS_V1" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "pmdMobileSnapshot" app/admin/controllers/KitchenDisplay.php
          grep -q "saveMobilePayload" app/admin/controllers/concerns/PmdWaiterPosSaveEndpoint.php
          grep -q "request_hash" app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          grep -q "client_aggregate_id" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "canonicalizeForHash" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "sendCommandJson" mobile/android/app/src/main/java/com/paymydine/mobile/network/MobileApiClient.kt
          grep -q "cloudRoutingForCommand" mobile/android/app/src/main/java/com/paymydine/mobile/data/local/LocalPosRepository.kt
          grep -q "blockedAggregates" mobile/android/app/src/main/java/com/paymydine/mobile/sync/SyncEngine.kt
          grep -q "pmd_edge_inbox_scope_seq" mobile/android/app/src/main/java/com/paymydine/mobile/data/local/PmdDatabase.kt
          grep -q "routes/pmd-mobile-sync-v1.php" app/admin/routes.php
          grep -q "PmdMobilePairingService" app/admin/controllers/Login.php
          grep -q "code_challenge" app/Services/PmdMobileSync/PmdMobilePairingService.php
          grep -q "code_verifier" app/Http/Controllers/PmdMobilePairController.php
          grep -q "PairingPkce" mobile/android/app/src/main/java/com/paymydine/mobile/ui/PayMyDineApp.kt
          grep -q "pairingVerifier" mobile/android/app/src/main/java/com/paymydine/mobile/security/DeviceCredentialStore.kt
          grep -q "PMD_MOBILE_PAIR_TRANSPORT_BYPASS_V2" app/Http/Middleware/PmdSiteAccessGateMiddleware.php
          grep -q "pairCurrentVerifiedPersonalDevice" app/Services/PmdSiteAccessService.php
          grep -q "approveVerifiedSession" app/Services/PmdMobileSync/PmdMobilePairingService.php
          grep -q "mobile/pair/approve" routes/pmd-mobile-sync-v1.php
          grep -q "PMD_MOBILE_SYNC_EARLY_ROOT_LOADER_V8" routes.php
          grep -q "PMD_MOBILE_SYNC_DIRECT_REGISTER_V8" routes/pmd-mobile-sync-v1.php
          ! grep -q "App::before(function" routes/pmd-mobile-sync-v1.php
          grep -q "mobile/pos/open" routes/pmd-mobile-sync-v1.php
          grep -q "PMD_MOBILE_POS_WEB_SESSION_V1" app/Http/Controllers/PmdMobilePosSessionController.php
          grep -q "PMD_MOBILE_OWNER_POS_SESSION_V1" app/Services/PmdSiteAccessWorkspaceGateService.php
          grep -q "PMD_ANDROID_POS_DEDICATED_ACTIVITY_V6" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q "PMD_ANDROID_POS_SURFACE_PULSE_V6" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q "PMD_ANDROID_POS_GEOMETRY_NUDGE_V7" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q "PMD_ANDROID_POS_CSS_PIXEL_VIEWPORT_V8" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q "PMD_ANDROID_POS_SYSTEM_INSETS_V8" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q "devicePixelRatio" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q "WindowInsetsCompat" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q -- "--pmd-android-viewport-height" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          ! grep -q "LAYER_TYPE_SOFTWARE" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q 'android:name=".PosActivity"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorLandscape"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q "PMD_ANDROID_POS_ACTIVITY_LAUNCH_V9" mobile/android/app/src/main/java/com/paymydine/mobile/ui/PayMyDineApp.kt
          grep -q "PMD_ANDROID_OFFLINE_POS_V1" mobile/android/app/src/main/java/com/paymydine/mobile/OfflinePosActivity.kt
          grep -q "PMD_ANDROID_POS_OFFLINE_FAILOVER_V9" mobile/android/app/src/main/java/com/paymydine/mobile/PosActivity.kt
          grep -q "LocalPosScreen" mobile/android/app/src/main/java/com/paymydine/mobile/OfflinePosActivity.kt
          grep -q "PMD_ANDROID_LOCAL_POS_PROJECTION_REFRESH_V2" mobile/android/app/src/main/java/com/paymydine/mobile/ui/LocalPosScreen.kt
          grep -q "PMD_ANDROID_WORKSPACE_HUB_V1" mobile/android/app/src/main/java/com/paymydine/mobile/ui/PmdWorkspaceHome.kt
          grep -q "PMD_ANDROID_KDS_ACTIVITY_V1" mobile/android/app/src/main/java/com/paymydine/mobile/KdsActivity.kt
          grep -q "PMD_ANDROID_RESERVATIONS_ACTIVITY_V1" mobile/android/app/src/main/java/com/paymydine/mobile/ReservationsActivity.kt
          grep -q "PMD_MOBILE_PAIR_DASHBOARD_APPROVAL_V4" app/Services/PmdMobileSync/PmdMobilePairingService.php
          grep -q "pmd_mobile_pair_requests" app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          grep -q 'android:icon="@mipmap/ic_launcher"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q "SyncEngine(app).runOnce" mobile/android/app/src/main/java/com/paymydine/mobile/OfflinePosActivity.kt
          grep -q "outboxCount" mobile/android/app/src/main/java/com/paymydine/mobile/OfflinePosActivity.kt
          grep -q "offline_payment_enabled.*false" app/Services/PmdMobileSync/PmdMobileBootstrapService.php
          grep -q 'android:name=".OfflinePosActivity"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q "OfflinePosActivity::class.java" mobile/android/app/src/main/java/com/paymydine/mobile/MainActivity.kt
          grep -q "PosActivity::class.java" mobile/android/app/src/main/java/com/paymydine/mobile/MainActivity.kt
          ! grep -q "PosWebView(" mobile/android/app/src/main/java/com/paymydine/mobile/ui/PayMyDineApp.kt
          grep -q "pair/status" routes/pmd-mobile-sync-v1.php
          grep -q "pairExchangeSecret" app/Services/PmdMobileSync/PmdMobilePairingService.php
          grep -q "pair_request" app/Http/Controllers/PmdMobilePairController.php
          grep -q "pairStatus" mobile/android/app/src/main/java/com/paymydine/mobile/network/MobileApiClient.kt
          grep -q "pairingRequest" mobile/android/app/src/main/java/com/paymydine/mobile/security/DeviceCredentialStore.kt
          grep -q "Connect this Android device?" app/Http/Controllers/PmdMobilePairController.php
          echo "PMD_ANDROID_SERVER_CONTRACT=PASS"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable preview signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-local-first-v1'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paymydine-android-preview-debug-keystore-v1
      - name: Verify stable preview signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-local-first-v1'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PREVIEW_SHA256="C1:A7:58:7B:41:F3:87:3B:5C:1C:45:52:D3:80:FA:45:97:F3:30:52:35:47:50:A2:B6:8C:F6:2B:75:5D:B5:C1"

          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            echo "::error::Stable PayMyDine preview signing key is missing. Refusing to publish an APK with a new signature."
            exit 1
          fi

          ACTUAL_PREVIEW_SHA256="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -1)"

          [[ -n "$ACTUAL_PREVIEW_SHA256" ]] || {
            echo "::error::Unable to read PayMyDine preview signing certificate."
            exit 1
          }

          if [[ "$ACTUAL_PREVIEW_SHA256" != "$EXPECTED_PREVIEW_SHA256" ]]; then
            echo "::error::PayMyDine preview signing certificate changed. Refusing to publish an incompatible update."
            echo "expected=$EXPECTED_PREVIEW_SHA256"
            echo "actual=$ACTUAL_PREVIEW_SHA256"
            exit 1
          fi

          echo "PMD_PREVIEW_SIGNING_SHA256=$ACTUAL_PREVIEW_SHA256"
          echo "PMD_PREVIEW_SIGNING_PIN=PASS"
      - name: Create isolated PR debug signing key
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PayMyDine PR Debug,O=PayMyDine,C=DE" \
            -noprompt
          echo "PMD_PR_EPHEMERAL_SIGNING_KEY=READY"
      - name: Unit tests
        working-directory: mobile/android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - name: Lint
        working-directory: mobile/android
        run: gradle --no-daemon lintDebug
      - name: Prepare preview APK
        shell: bash
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            mobile/android/PayMyDine-POS-Tablet-Preview.apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            mobile/android/PayMyDine-POS-Tablet-Preview-0.3.0.apk
          sha256sum mobile/android/PayMyDine-POS-Tablet-Preview.apk \
            > mobile/android/PayMyDine-POS-Tablet-Preview.apk.sha256
          sha256sum mobile/android/PayMyDine-POS-Tablet-Preview-0.3.0.apk \
            > mobile/android/PayMyDine-POS-Tablet-Preview-0.3.0.apk.sha256
      - name: Verify preview APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/android/PayMyDine-POS-Tablet-Preview.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          grep -Fq "package: name='com.paymydine.mobile.pospreview'" <<<"$BADGING"
          grep -Fq "versionCode='13'" <<<"$BADGING"
          grep -Fq "versionName='0.3.0-pos-shell-debug'" <<<"$BADGING"

          echo "PMD_PREVIEW_PACKAGE=com.paymydine.mobile.pospreview"
          echo "PMD_PREVIEW_VERSION=0.3.0-pos-shell-debug"

          # PR checks intentionally use the runner's ephemeral debug key. Only a
          # direct push to the preview branch may verify/publish the pinned key.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/feature/android-local-first-v1" ]]; then
            EXPECTED_CERT="c1a7587b41f3873b5c1c4552d380fa4597f33052354750a2b68cf62b755db5c1"
            ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -1 \
              | tr '[:upper:]' '[:lower:]')"

            [[ "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
              echo "::error::Built APK signing certificate does not match the pinned PayMyDine POS preview certificate."
              echo "expected=$EXPECTED_CERT"
              echo "actual=$ACTUAL_CERT"
              exit 1
            }

            echo "PMD_PREVIEW_APK_SIGNING_PIN=PASS"
          else
            echo "PMD_PREVIEW_APK_SIGNING_PIN=SKIPPED_PR_EPHEMERAL_KEY"
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-local-first-v1'
        with:
          name: paymydine-pos-tablet-preview
          path: |
            mobile/android/PayMyDine-POS-Tablet-Preview.apk
            mobile/android/PayMyDine-POS-Tablet-Preview.apk.sha256
            mobile/android/PayMyDine-POS-Tablet-Preview-0.3.0.apk
            mobile/android/PayMyDine-POS-Tablet-Preview-0.3.0.apk.sha256
          if-no-files-found: error
      - name: Publish tablet preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-local-first-v1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pmd-android-local-first-preview
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PayMyDine Android Local-First Preview" \
              --prerelease \
              --notes "Android tablet/POS preview. Native local-first POS, Waiter and KDS with Restaurant Edge. This is a test build, not the production-signed Play release."
          fi
          gh release upload "$TAG" \
            mobile/android/PayMyDine-POS-Tablet-Preview.apk \
            mobile/android/PayMyDine-POS-Tablet-Preview.apk.sha256 \
            mobile/android/PayMyDine-POS-Tablet-Preview-0.3.0.apk \
            mobile/android/PayMyDine-POS-Tablet-Preview-0.3.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
