name: PayMyDine Device App V5

on:
  push:
    branches: [feature/unified-device-app-v2, feature/device-app-ui-theme-v3, feature/device-app-kiosk-v4, feature/kiosk-dedicated-fast-ui-v5, fix/kiosk-v2-production-authority-v6, fix/kiosk-v6-1-complete, restore/kiosk-v6-2-after-vps-sync, fix/live-release-kiosk-v6-3, feat/kiosk-dedicated-terminal-v7, fix/kiosk-v8-native-direct-load-v57, fix/kiosk-v8-dedicated-web-activity-v58, fix/kiosk-v8-software-render-v59, fix/device-app-046-restore-android-project, fix/kiosk-v9-theme-payment-sync, main]
    paths:
      - 'mobile/android/**'
      - 'app/admin/views/pmdsettings/index.blade.php'
      - 'app/Services/PmdDevicePlatformService.php'
      - 'app/Services/PmdDevicePlatformAuthService.php'
      - 'app/Services/PmdTableDisplayService.php'
      - 'app/Services/PmdTableDisplayPairingService.php'
      - 'app/Services/PmdKioskPairingService.php'
      - 'app/Http/Controllers/PmdKioskPublicController.php'
      - 'app/Http/Controllers/PmdDevicePlatformController.php'
      - 'app/admin/controllers/Pmddevices.php'
      - 'app/admin/views/pmddevices/index.blade.php'
      - 'frontend/features/customer-menu/checkout/paymentModalPaymentFlow.ts'
      - 'frontend/app/kiosk/**'
      - 'frontend/app/kiosk-reset/**'
      - 'frontend/features/kiosk/**'
      - 'kiosk/**'
      - 'kiosk-reset/**'
      - 'resources/views/pmd/kiosk-*.blade.php'
      - 'public/assets/pmd/kiosk-terminal-v8.*'
      - 'ops/nginx/pmd-kiosk-blade-v8-location.conf'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/**'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/**'
      - 'frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/app/**'
      - 'frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/src/**'
      - 'frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/package.json'
      - 'frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/package-lock.json'
      - 'app/Http/Controllers/Api/OrderController.php'
      - 'routes/admin-app-before.php'
      - 'routes/pmd-kiosk-v1.php'
      - 'routes.php'
      - 'app/admin/routes.php'
      - 'app/main/routes.php'
      - 'app/Services/PmdMobileSync/**'
      - 'app/Http/Controllers/PmdMobilePairController.php'
      - 'app/Http/Controllers/PmdMobileWorkspaceAuthController.php'
      - 'routes/pmd-device-platform-v1.php'
      - 'routes/pmd-mobile-sync-v1.php'
      - '.github/workflows/android-local-first-v1.yml'
  workflow_dispatch:

concurrency:
  group: pmd-device-app-v5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  frontend-kiosk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install customer frontend
        working-directory: frontend
        run: npm ci
      - name: Build customer frontend
        working-directory: frontend
        run: npm run build

      - name: Install production Frontend V2
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm ci

      - name: Typecheck production Frontend V2
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run typecheck

      - name: Build production Frontend V2
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run build

      - name: Install live Frontend V2 release
        working-directory: frontend-v2/releases/PayMyDine-V2-batch-20260912_013537
        run: npm ci

      - name: Typecheck live Frontend V2 release
        working-directory: frontend-v2/releases/PayMyDine-V2-batch-20260912_013537
        run: npm run typecheck

      - name: Build live Frontend V2 release
        working-directory: frontend-v2/releases/PayMyDine-V2-batch-20260912_013537
        run: npm run build

  server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Device App server and source contract
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Services/PmdDevicePlatformService.php
          php -l app/Services/PmdDevicePlatformAuthService.php
          php -l app/Services/PmdTableDisplayService.php
          php -l app/Services/PmdTableDisplayPairingService.php
          php -l app/Services/PmdKioskPairingService.php
          php -l app/Http/Controllers/PmdKioskPublicController.php
          php -l kiosk/index.php
          php -l kiosk-reset/index.php
          node --check public/assets/pmd/kiosk-terminal-v8.js
          test -f resources/views/pmd/kiosk-terminal.blade.php
          test -f resources/views/pmd/kiosk-reset.blade.php
          grep -Fq 'PMD_KIOSK_BLADE_TERMINAL_V8' app/Http/Controllers/PmdKioskPublicController.php
          grep -Fq "Route::get('/kiosk'" routes/pmd-kiosk-v1.php
          grep -Fq 'data-pmd-kiosk-terminal="blade-v8"' resources/views/pmd/kiosk-terminal.blade.php
          grep -Fq 'PMD_KIOSK_BLADE_TERMINAL_V8' public/assets/pmd/kiosk-terminal-v8.js
          grep -Fq 'PMD_KIOSK_CUSTOMER_THEME_SYNC_V9' app/Http/Controllers/PmdKioskPublicController.php
          grep -Fq 'PMD_KIOSK_CUSTOMER_THEME_SYNC_V9' public/assets/pmd/kiosk-terminal-v8.js
          grep -Fq 'PMD_KIOSK_CUSTOMER_THEME_SYNC_V9' public/assets/pmd/kiosk-terminal-v8.css
          grep -Fq 'v=9-theme-payment' resources/views/pmd/kiosk-terminal.blade.php
          grep -Fq 'PMD_KIOSK_QR_PAY_LATER_V9' public/assets/pmd/kiosk-terminal-v8.js
          grep -Fq 'PMD_KIOSK_QR_PAY_LATER_V9' routes/admin-app-before.php
          grep -Fq 'payment_method: "qr_pay_later"' public/assets/pmd/kiosk-terminal-v8.js
          grep -Fq 'payment_intent_token: null' public/assets/pmd/kiosk-terminal-v8.js
          grep -Fq '/api/v1/payments/stripe/create-intent' public/assets/pmd/kiosk-terminal-v8.js
          grep -Fq 'https://js.stripe.com/v3/' public/assets/pmd/kiosk-terminal-v8.js
          grep -Fq 'PMD_KIOSK_BLADE_V8_NGINX_NO_REDIRECT' ops/nginx/pmd-kiosk-blade-v8-location.conf
          grep -Fq 'PMD_KIOSK_DEDICATED_WEB_ACTIVITY_V58' mobile/android/app/src/main/java/com/paymydine/mobile/KioskMenuActivity.kt
          grep -Fq 'PMD_KIOSK_SOFTWARE_RENDER_V59' mobile/android/app/src/main/java/com/paymydine/mobile/KioskMenuActivity.kt
          grep -Fq 'setLayerType(View.LAYER_TYPE_SOFTWARE, null)' mobile/android/app/src/main/java/com/paymydine/mobile/KioskMenuActivity.kt
          ! grep -Fq 'setLayerType(View.LAYER_TYPE_NONE, null)' mobile/android/app/src/main/java/com/paymydine/mobile/KioskMenuActivity.kt
          grep -Fq 'android:hardwareAccelerated="false"' mobile/android/app/src/main/AndroidManifest.xml
          grep -Fq 'document.getElementById' mobile/android/app/src/main/java/com/paymydine/mobile/KioskMenuActivity.kt
          grep -Fq 'KioskMenuActivity.intent' mobile/android/app/src/main/java/com/paymydine/mobile/KioskActivity.kt
          php -l app/Http/Controllers/Api/OrderController.php
          php -l app/Http/Controllers/PmdDevicePlatformController.php
          php -l app/admin/controllers/Pmddevices.php
          php -l routes/pmd-kiosk-v1.php
          php -l routes/admin-app-before.php
          php -l routes.php
          php -l app/Services/PmdMobileSync/PmdMobilePairingService.php
          php -l app/Http/Controllers/PmdMobilePairController.php
          php -l app/Http/Controllers/PmdMobileWorkspaceAuthController.php
          php -l routes/pmd-device-platform-v1.php
          php -l routes/pmd-mobile-sync-v1.php
          grep -Fq 'TableDisplayActivity' mobile/android/app/src/main/AndroidManifest.xml
          grep -Fq 'KioskActivity' mobile/android/app/src/main/AndroidManifest.xml
          grep -Fq 'KioskMenuActivity' mobile/android/app/src/main/AndroidManifest.xml
          grep -Fq 'devicePurpose() == "kiosk"' mobile/android/app/src/main/java/com/paymydine/mobile/MainActivity.kt
          grep -Fq 'PayMyDineKiosk' mobile/android/app/src/main/java/com/paymydine/mobile/KioskMenuActivity.kt
          grep -Fq '__PMD_KIOSK_BRIDGE_SECRET__' mobile/android/app/src/main/java/com/paymydine/mobile/KioskMenuActivity.kt
          grep -Fq '__PMD_KIOSK_BRIDGE_SECRET__' frontend/features/customer-menu/checkout/paymentModalPaymentFlow.ts
          grep -Fq 'KIOSK_API_PATH' mobile/android/app/build.gradle.kts
          grep -Fq 'PmdKioskPublicController' routes/pmd-kiosk-v1.php
          grep -Fq "kiosk_order_type" frontend/features/customer-menu/checkout/paymentModalPaymentFlow.ts
          grep -Fq 'devicePurpose() == "table_display"' mobile/android/app/src/main/java/com/paymydine/mobile/MainActivity.kt
          grep -Fq 'UnifiedFirstRun' mobile/android/app/src/main/java/com/paymydine/mobile/ui/PayMyDineApp.kt
          grep -Fq 'versionCode = 59' mobile/android/app/build.gradle.kts
          grep -Fq 'versionName = "0.4.6-device-app-v5"' mobile/android/app/build.gradle.kts
          grep -Fq 'PayMyDine Device App · Android' app/admin/views/pmdsettings/index.blade.php
          grep -Fq 'customerMenuTheme' app/Services/PmdTableDisplayService.php
          grep -Fq 'Crossfade' mobile/android/app/src/main/java/com/paymydine/mobile/tabledisplay/TableDisplayApp.kt
          grep -Fq 'Staff app' mobile/android/app/src/main/java/com/paymydine/mobile/ui/PayMyDineApp.kt
          grep -Fq 'Customer app' mobile/android/app/src/main/java/com/paymydine/mobile/ui/PayMyDineApp.kt
          ! grep -Fq '"/kiosk-reset' mobile/android/app/src/main/java/com/paymydine/mobile/KioskActivity.kt
          grep -Fq '"/kiosk/?pmd_kiosk=1"' mobile/android/app/src/main/java/com/paymydine/mobile/KioskActivity.kt
          grep -Fq 'data-pmd-kiosk-menu="v5"' frontend/features/kiosk/KioskMenuPage.tsx
          test -f frontend/app/kiosk/page.tsx
          test -f frontend/app/kiosk-reset/page.tsx
          test -f frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/kiosk/page.tsx
          test -f frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/kiosk-reset/page.tsx
          grep -Fq "mode: 'kiosk'" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/CustomerMenuRoute.tsx
          grep -Fq 'submitKioskOrder' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/MenuRuntimeContext.tsx
          grep -Fq 'isKiosk' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/ThemeBottomToolBar.tsx
          grep -Fq 'PMD_KIOSK_DIRECT_ORDER_IDEMPOTENCY_V6' app/Http/Controllers/Api/OrderController.php
          grep -Fq 'PMD_KIOSK_LEGACY_ROOT_COMPAT_V6_1' frontend/proxy.ts
          grep -Fq 'url.pathname = isReset ? "/kiosk-reset" : "/kiosk"' frontend/proxy.ts
          grep -Fq 'PMD_KIOSK_SERVICE_CHROME_GUARD_V6_1' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/SharedPieces.tsx
          grep -Fq 'PMD_KIOSK_SERVICE_RUNTIME_GUARD_V6_1' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/MenuRuntimeContext.tsx
          grep -Fq 'data-pmd-kiosk-checkout={isKiosk ? "v6.1" : undefined}' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/RuntimeOverlays.tsx
          test -f frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/kiosk/KioskTerminal.tsx
          grep -Fq 'data-pmd-kiosk-terminal="v7"' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/kiosk/KioskTerminal.tsx
          grep -Fq '<KioskTerminal />' frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/CustomerMenuRoute.tsx
          test -f frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/app/kiosk/page.tsx
          test -f frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/app/kiosk-reset/page.tsx
          grep -Fq "mode: 'kiosk'" frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/app/CustomerMenuRoute.tsx
          grep -Fq 'submitKioskOrder' frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/src/runtime/MenuRuntimeContext.tsx
          grep -Fq 'PMD_KIOSK_SERVICE_RUNTIME_GUARD_V6_1' frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/src/runtime/MenuRuntimeContext.tsx
          grep -Fq 'PMD_KIOSK_SERVICE_CHROME_GUARD_V6_1' frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/src/runtime/components/SharedPieces.tsx
          grep -Fq 'data-pmd-kiosk-checkout={isKiosk ? "v6.1" : undefined}' frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/src/runtime/components/RuntimeOverlays.tsx
          test -f frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/src/kiosk/KioskTerminal.tsx
          grep -Fq 'data-pmd-kiosk-terminal="v7"' frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/src/kiosk/KioskTerminal.tsx
          grep -Fq '<KioskTerminal />' frontend-v2/releases/PayMyDine-V2-batch-20260912_013537/app/CustomerMenuRoute.tsx

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Device App preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paymydine-device-app-preview-keystore-v1

      - name: Prepare Device App preview key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=PayMyDine Device App Preview,O=PayMyDine,C=DE"               >/dev/null 2>&1
          fi

      - name: Unit tests
        working-directory: mobile/android
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble Device App
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug

      - name: Android lint
        working-directory: mobile/android
        run: gradle --no-daemon lintDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_IN="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="mobile/android/PayMyDine-Device-App-0.4.6.apk"
          test -f "$APK_IN"
          cp "$APK_IN" "$APK_OUT"
          sha256sum "$APK_OUT" > "$APK_OUT.sha256"

      - name: Verify package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/android/PayMyDine-Device-App-0.4.6.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          grep -Fq "package: name='com.paymydine.mobile.pospreview'" <<<"$BADGING"
          grep -Fq "versionCode='59'" <<<"$BADGING"
          grep -Fq "versionName='0.4.6-device-app-v5-debug'" <<<"$BADGING"
          "$APKSIGNER" verify "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: paymydine-device-app-v5
          path: |
            mobile/android/PayMyDine-Device-App-0.4.6.apk
            mobile/android/PayMyDine-Device-App-0.4.6.apk.sha256
          if-no-files-found: error

      - name: Publish Device App preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pmd-device-app-preview
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --title "PayMyDine Device App Preview"               --notes "Unified Android app for PayMyDine restaurant devices."               --prerelease
          fi
          gh release upload "$TAG"             mobile/android/PayMyDine-Device-App-0.4.6.apk             mobile/android/PayMyDine-Device-App-0.4.6.apk.sha256             --repo "$GITHUB_REPOSITORY"             --clobber
