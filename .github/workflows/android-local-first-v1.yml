name: PayMyDine Android Local-First V1

on:
  push:
    branches: [feature/android-local-first-v1, feature/android-local-first-v2-v104]
    paths:
      - 'mobile/android/**'
      - 'docs/ANDROID_LOCAL_FIRST_ARCHITECTURE_V1.md'
      - 'app/Services/PmdMobileSync/**'
      - 'app/Http/Controllers/PmdMobile*.php'
      - 'app/Http/Controllers/PmdRestaurantSignInApprovalController.php'
      - 'app/Http/Controllers/PmdSiteAccessHubDataController.php'
      - 'app/admin/assets/js/pmd-site-access-hub-v13.js'
      - 'app/admin/assets/js/pmd-quick-pos-v1.js'
      - 'app/admin/assets/css/pmd-quick-pos-v1.css'
      - 'app/admin/assets/js/pmd-ownerboard-workplace-access-v1.js'
      - 'app/Services/PmdSiteAccessService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/admin/controllers/Login.php'
      - 'app/admin/routes.php'
      - 'app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php'
      - 'routes/pmd-mobile-sync-v1.php'
      - '.github/workflows/android-local-first-v1.yml'
      - 'tests/pmd-responsive-matrix-v102.test.mjs'
      - 'deploy/pmd-android-operations-v18-direct-login-first-party.sh'
      - 'deploy/pmd-android-v18-first-party-download-hotfix.sh'
      - 'deploy/pmd-android-v18-2-throttle-isolation-hotfix.sh'
      - 'deploy/pmd-android-v18-3-shared-device-login-hotfix.sh'
      - 'deploy/pmd-android-v18-4-shared-device-pos-auth-hotfix.sh'
      - 'deploy/pmd-android-v18-5-mobile-session-reentry-hotfix.sh'
      - 'deploy/pmd-android-v18-6-final-session-authority.sh'
      - 'deploy/pmd-android-v18-7-canonical-login-offline.sh'
      - 'deploy/pmd-android-v18-13-seamless-offline-pos.sh'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'docs/ANDROID_LOCAL_FIRST_ARCHITECTURE_V1.md'
      - 'app/Services/PmdMobileSync/**'
      - 'app/Http/Controllers/PmdMobile*.php'
      - 'app/Services/PmdSiteAccessService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/admin/controllers/Login.php'
      - 'app/admin/routes.php'
      - 'app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php'
      - 'routes/pmd-mobile-sync-v1.php'
      - '.github/workflows/android-local-first-v1.yml'

concurrency:
  group: pmd-android-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          php -l app/Services/PmdMobileSync/PmdMobileDeviceAuthService.php
          php -l app/Services/PmdMobileSync/PmdMobileStaffGrantService.php
          php -l app/Services/PmdMobileSync/PmdMobileBootstrapService.php
          php -l app/Services/PmdMobileSync/PmdMobilePairingService.php
          php -l app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          php -l app/Http/Controllers/PmdMobileBootstrapController.php
          php -l app/Http/Controllers/PmdMobileEdgeController.php
          php -l app/Http/Controllers/PmdMobileSyncController.php
          php -l app/Http/Controllers/PmdMobilePairController.php
          php -l app/Http/Controllers/PmdMobileKdsController.php
          php -l app/Http/Controllers/PmdMobilePosSessionController.php
          php -l app/Http/Controllers/PmdMobileWorkspaceSessionController.php
          php -l app/Http/Controllers/PmdMobileWorkspaceAuthController.php
          php -l app/Http/Controllers/PmdRestaurantSignInApprovalController.php
          php -l app/Http/Controllers/PmdSiteAccessHubDataController.php
          php -l app/Http/Middleware/PmdSiteAccessGateMiddleware.php
          php -l app/Services/PmdSiteAccessService.php
          php -l app/Services/SuperAdminTenantLifecycleService.php
          php -l app/admin/controllers/Login.php
          php -l app/admin/controllers/Siteaccess.php
          php -l app/admin/controllers/PmdWaiterPosV1.php
          php -l app/admin/controllers/KitchenDisplay.php
          php -l app/admin/controllers/concerns/PmdWaiterPosBootstrapConcern.php
          php -l app/admin/controllers/concerns/PmdWaiterPosSaveEndpoint.php
          php -l routes.php
          php -l routes/pmd-mobile-sync-v1.php
      - name: Safety contract
        shell: bash
        run: |
          set -x
          set -euo pipefail
          bash -n deploy/pmd-android-operations-v18-direct-login-first-party.sh
          bash -n deploy/pmd-android-v18-first-party-download-hotfix.sh
