name: PayMyDine Android Local-First V1

on:
  push:
    branches: [feature/android-local-first-v1]
    paths:
      - 'mobile/android/**'
      - 'docs/ANDROID_LOCAL_FIRST_ARCHITECTURE_V1.md'
      - 'app/Services/PmdMobileSync/**'
      - 'app/Http/Controllers/PmdMobile*.php'
      - 'app/Services/PmdSiteAccessService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/admin/controllers/Login.php'
      - 'app/admin/routes.php'
      - 'app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php'
      - 'routes/pmd-mobile-sync-v1.php'
      - '.github/workflows/android-local-first-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'docs/ANDROID_LOCAL_FIRST_ARCHITECTURE_V1.md'
      - 'app/Services/PmdMobileSync/**'
      - 'app/Http/Controllers/PmdMobile*.php'
      - 'app/Services/PmdSiteAccessService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/admin/controllers/Login.php'
      - 'app/admin/routes.php'
      - 'app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php'
      - 'routes/pmd-mobile-sync-v1.php'
      - '.github/workflows/android-local-first-v1.yml'

concurrency:
  group: pmd-android-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          php -l app/Services/PmdMobileSync/PmdMobileDeviceAuthService.php
          php -l app/Services/PmdMobileSync/PmdMobileBootstrapService.php
          php -l app/Services/PmdMobileSync/PmdMobilePairingService.php
          php -l app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          php -l app/Http/Controllers/PmdMobileBootstrapController.php
          php -l app/Http/Controllers/PmdMobileEdgeController.php
          php -l app/Http/Controllers/PmdMobileSyncController.php
          php -l app/Http/Controllers/PmdMobilePairController.php
          php -l app/Http/Controllers/PmdMobileKdsController.php
          php -l app/Http/Middleware/PmdSiteAccessGateMiddleware.php
          php -l app/Services/PmdSiteAccessService.php
          php -l app/Services/SuperAdminTenantLifecycleService.php
          php -l app/admin/controllers/Login.php
          php -l app/admin/controllers/PmdWaiterPosV1.php
          php -l app/admin/controllers/KitchenDisplay.php
          php -l app/admin/controllers/concerns/PmdWaiterPosBootstrapConcern.php
          php -l app/admin/controllers/concerns/PmdWaiterPosSaveEndpoint.php
          php -l routes.php
          php -l routes/pmd-mobile-sync-v1.php
      - name: Safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "trustedDeviceByRawToken" app/Services/PmdSiteAccessService.php
          grep -q "rotateTrustedDeviceToken" app/Services/PmdSiteAccessService.php
          grep -q "pmd_sync_commands" app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          grep -q "pmd_sync_events" app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          grep -q "ensureMobileSyncSchema" app/Services/SuperAdminTenantLifecycleService.php
          grep -q "ORDER_SEND_V1" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "KDS_STATUS_V1" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "pmdMobileSnapshot" app/admin/controllers/KitchenDisplay.php
          grep -q "saveMobilePayload" app/admin/controllers/concerns/PmdWaiterPosSaveEndpoint.php
          grep -q "request_hash" app/system/database/migrations/2026_09_20_190000_create_pmd_mobile_sync_tables.php
          grep -q "client_aggregate_id" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "canonicalizeForHash" app/Services/PmdMobileSync/PmdMobileCommandProcessor.php
          grep -q "sendCommandJson" mobile/android/app/src/main/java/com/paymydine/mobile/network/MobileApiClient.kt
          grep -q "cloudRoutingForCommand" mobile/android/app/src/main/java/com/paymydine/mobile/data/local/LocalPosRepository.kt
          grep -q "blockedAggregates" mobile/android/app/src/main/java/com/paymydine/mobile/sync/SyncEngine.kt
          grep -q "pmd_edge_inbox_scope_seq" mobile/android/app/src/main/java/com/paymydine/mobile/data/local/PmdDatabase.kt
          grep -q "routes/pmd-mobile-sync-v1.php" app/admin/routes.php
          grep -q "PmdMobilePairingService" app/admin/controllers/Login.php
          grep -q "code_challenge" app/Services/PmdMobileSync/PmdMobilePairingService.php
          grep -q "code_verifier" app/Http/Controllers/PmdMobilePairController.php
          grep -q "PairingPkce" mobile/android/app/src/main/java/com/paymydine/mobile/ui/PayMyDineApp.kt
          grep -q "pairingVerifier" mobile/android/app/src/main/java/com/paymydine/mobile/security/DeviceCredentialStore.kt
          grep -q "PMD_MOBILE_PAIR_TRANSPORT_BYPASS_V2" app/Http/Middleware/PmdSiteAccessGateMiddleware.php
          grep -q "pairCurrentVerifiedPersonalDevice" app/Services/PmdSiteAccessService.php
          grep -q "approveVerifiedSession" app/Services/PmdMobileSync/PmdMobilePairingService.php
          grep -q "mobile/pair/approve" routes/pmd-mobile-sync-v1.php
          grep -q "PMD_MOBILE_SYNC_EARLY_ROOT_LOADER_V8" routes.php
          grep -q "PMD_MOBILE_SYNC_DIRECT_REGISTER_V8" routes/pmd-mobile-sync-v1.php
          ! grep -q "App::before(function" routes/pmd-mobile-sync-v1.php
          grep -q "pair/status" routes/pmd-mobile-sync-v1.php
          grep -q "pairExchangeSecret" app/Services/PmdMobileSync/PmdMobilePairingService.php
          grep -q "pair_request" app/Http/Controllers/PmdMobilePairController.php
          grep -q "pairStatus" mobile/android/app/src/main/java/com/paymydine/mobile/network/MobileApiClient.kt
          grep -q "pairingRequest" mobile/android/app/src/main/java/com/paymydine/mobile/security/DeviceCredentialStore.kt
          grep -q "Connect this Android device?" app/Http/Controllers/PmdMobilePairController.php
          echo "PMD_ANDROID_SERVER_CONTRACT=PASS"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paymydine-android-preview-debug-keystore-v1
      - name: Ensure stable preview signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PayMyDine Android Preview,O=PayMyDine,C=DE"
          fi
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null
      - name: Unit tests
        working-directory: mobile/android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - name: Lint
        working-directory: mobile/android
        run: gradle --no-daemon lintDebug
      - name: Prepare preview APK
        shell: bash
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            mobile/android/PayMyDine-Android-Local-First-Preview.apk
          sha256sum mobile/android/PayMyDine-Android-Local-First-Preview.apk \
            > mobile/android/PayMyDine-Android-Local-First-Preview.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: paymydine-android-local-first-v1-debug
          path: |
            mobile/android/PayMyDine-Android-Local-First-Preview.apk
            mobile/android/PayMyDine-Android-Local-First-Preview.apk.sha256
          if-no-files-found: error
      - name: Publish tablet preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-local-first-v1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pmd-android-local-first-preview
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PayMyDine Android Local-First Preview" \
              --prerelease \
              --notes "Android tablet/POS preview. Native local-first POS, Waiter and KDS with Restaurant Edge. This is a test build, not the production-signed Play release."
          fi
          gh release upload "$TAG" \
            mobile/android/PayMyDine-Android-Local-First-Preview.apk \
            mobile/android/PayMyDine-Android-Local-First-Preview.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
