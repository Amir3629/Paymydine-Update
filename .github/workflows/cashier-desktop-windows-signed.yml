name: Build Signed PayMyDine Cashier Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Require PayMyDine Windows signing secrets
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.PMD_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.PMD_WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw 'Missing GitHub secret PMD_WINDOWS_CSC_LINK. A trusted Authenticode code-signing certificate is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw 'Missing GitHub secret PMD_WINDOWS_CSC_KEY_PASSWORD.'
          }
          Write-Host 'WINDOWS_SIGNING_SECRETS=READY'

      - name: Download Cashier app files through GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'apps/cashier-desktop'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'src') | Out-Null
          $files = @(
            'package.json',
            'README.md',
            'src/main.js',
            'src/preload.js',
            'src/hardware.js',
            'src/receipt.js',
            'src/setup.html',
            'src/setup.js',
            'src/hardware.html',
            'src/hardware-page.js',
            'src/offline.html',
            'src/offline.js'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PayMyDine-Cashier-Signed-Build'
          }
          foreach ($relative in $files) {
            $encodedPath = ($relative -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:PMD_REPOSITORY/contents/apps/cashier-desktop/$encodedPath`?ref=$env:PMD_REF"
            $item = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            if ($item.encoding -ne 'base64' -or [string]::IsNullOrWhiteSpace($item.content)) {
              throw "Unexpected GitHub response for $relative"
            }
            $destination = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String(($item.content -replace '\s', '')))
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install

      - name: Syntax check
        working-directory: apps/cashier-desktop
        run: npm run check

      - name: Build Authenticode-signed Windows installer
        working-directory: apps/cashier-desktop
        env:
          CSC_LINK: ${{ secrets.PMD_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.PMD_WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'apps/cashier-desktop/dist/PayMyDine-Cashier-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "INSTALLER=$($installer.Name)"
          Write-Host "SIGNATURE_STATUS=$($signature.Status)"
          Write-Host "SIGNER=$($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode signature is not valid: $($signature.Status)"
          }
          Write-Host 'AUTHENTICODE_SIGNATURE=PASS'

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: PayMyDine-Cashier-Windows-Signed
          path: apps/cashier-desktop/dist/PayMyDine-Cashier-Setup-*.exe
          if-no-files-found: error
