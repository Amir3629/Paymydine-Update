name: PMD185 Staff Portal Route Hotfix

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185

permissions:
  contents: write

jobs:
  qa-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply route hotfix
        run: python3 .github/pmd185_staff_portal_route_hotfix.py

      - name: QA route authority
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/admin/routes.php
          php -l app/main/routes.php
          git diff --check
          grep -F "PMD_STAFF_PORTAL_V1_PUBLIC_ROUTE_LOADER" app/main/routes.php
          grep -F "require_once base_path('routes/pmd-staff-portal-v1.php');" app/main/routes.php
          if grep -F "require_once base_path('routes/pmd-staff-portal-v1.php');" app/admin/routes.php; then
            echo "ERROR: loader still exists in Admin route authority"
            exit 1
          fi
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/admin/routes.php app/main/routes.php "

      - name: Commit reviewed route hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/routes.php app/main/routes.php
          git commit -m 'Fix Staff Portal public route authority (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
