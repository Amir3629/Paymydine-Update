name: PMD185 Shifts combined workspace v8

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kitchen-operations-foundation-185
          fetch-depth: 0

      - name: Apply reviewed patch
        run: python3 .github/pmd185_patch_shift_workspace_v8.py

      - name: QA combined Shifts workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/admin/controllers/Shifts.php
          php -l app/admin/controllers/Pmdsettings.php
          node --check app/admin/assets/js/pmd-shifts-v1.js
          git diff --check

          grep -F "PMD_SHIFTS_COMBINED_WORKSPACE_V8" app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          grep -F "PMD_SHIFTS_MONTH_TEAM_SUMMARY_V8" app/admin/views/pmdshifts/index.blade.php
          grep -F "data-pmd-calendar-shift-edit" app/admin/views/pmdshifts/index.blade.php
          grep -F "data-pmd-team-modal" app/admin/views/pmdshifts/index.blade.php
          grep -F "data-pmd-team-open" app/admin/views/pmdshifts/index.blade.php
          grep -F "request()->exists('staff_id')" app/admin/controllers/Shifts.php

          if grep -F "Preparation & ETA', 'Food prep ranges" app/admin/controllers/Pmdsettings.php; then
            echo 'Old Preparation & ETA settings tile still present'
            exit 1
          fi
          if grep -F "People & shifts', 'Plan operational roles" app/admin/controllers/Pmdsettings.php; then
            echo 'Old People & shifts settings tile still present'
            exit 1
          fi
          if grep -F "pmd-shifts-resource-table{width:100%" app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css; then
            echo 'Resource table still stretches to full width'
            exit 1
          fi

      - name: Commit product files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/admin/controllers/Pmdsettings.php \
            app/admin/controllers/Shifts.php \
            app/admin/views/pmdshifts/index.blade.php \
            app/admin/assets/js/pmd-shifts-v1.js \
            app/admin/assets/css/pmd-shifts-dashboard-reservations-v4.css
          git commit -m "Combine Shifts scheduling and restaurant team workspace (#185)"
          git push origin HEAD:feature/kitchen-operations-foundation-185
