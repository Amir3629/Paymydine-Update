name: PayMyDine Cashier V1.0.5 Branded Signed macOS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cashier-desktop-macos-brand-sign-v105
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-macos-brand-sign-v105.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-macos-brand-sign-v105.yml'

permissions:
  contents: read

env:
  PMD_BRAND_LOGO_URL: https://tomo.paymydine.com/brand/paymydine-logo.svg

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V1.0.5 source and canonical brand icon
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run brand:icon
          test -s build/icon.svg
          grep -Eqi '<svg([[:space:]]|>)' build/icon.svg
          grep -q '"version": "1.0.5"' package.json
          grep -q '"icon": "build/icon.svg"' package.json
          grep -q '"hardenedRuntime": true' package.json
          grep -q '"notarize": true' package.json
          grep -q 'com.apple.security.cs.allow-jit' build/entitlements.mac.plist
          grep -q 'com.apple.security.cs.allow-jit' build/entitlements.mac.inherit.plist
          echo 'V105_BRAND_AND_MAC_CONTRACT=PASS'

  build-windows:
    needs: contract-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download Cashier V1.0.5 source without Windows git checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'apps/cashier-desktop'
          $files = @(
            'package.json',
            'README.md',
            'scripts/apply-v104.js',
            'scripts/fetch-brand-icon.js',
            'src/main.js',
            'src/preload.js',
            'src/hardware.js',
            'src/receipt.js',
            'src/setup.html',
            'src/setup.js',
            'src/hardware.html',
            'src/hardware-page.js',
            'src/offline.html',
            'src/offline.js'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PayMyDine-Cashier-V105-Build'
          }
          foreach ($relative in $files) {
            $encodedPath = ($relative -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:PMD_REPOSITORY/contents/apps/cashier-desktop/$encodedPath`?ref=$env:PMD_REF"
            $item = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $destination = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String(($item.content -replace '\s', '')))
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Syntax and V1.0.5 contract
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build branded Windows installer
        working-directory: apps/cashier-desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v105-windows
          path: apps/cashier-desktop/dist/PayMyDine-Cashier-Setup-1.0.5.exe
          if-no-files-found: error

  macos-packaging-smoke:
    needs: contract-test
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Build branded unsigned PR smoke package only
        working-directory: apps/cashier-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --${{ matrix.arch }} --config.mac.notarize=false
      - name: Verify PayMyDine icon was packaged
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name 'PayMyDine Cashier.app' -print -quit)"
          test -n "$app_path"
          icon_path="$(find "$app_path/Contents/Resources" -maxdepth 1 -type f -name '*.icns' -print -quit)"
          test -n "$icon_path"
          test -s "$icon_path"
          echo "PACKAGED_APP=$app_path"
          echo "PACKAGED_ICON=$icon_path"
          echo 'V105_MAC_BRAND_SMOKE=PASS'

  build-macos-signed:
    needs: contract-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse unsigned or unnotarized release build
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_REQUIRED_SECRET=$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'PMD_MAC_RELEASE_REFUSED: Apple Developer signing/notarization secrets are not configured.'
            exit 1
          fi
          echo 'PMD_MAC_SIGNING_SECRETS_PRESENT'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Build, Developer-ID sign and notarize macOS DMG
        working-directory: apps/cashier-desktop
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Gate release on code signature, Gatekeeper and stapled ticket
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name 'PayMyDine Cashier.app' -print -quit)"
          dmg_path="$(find dist -type f -name 'PayMyDine-Cashier-1.0.5-mac-${{ matrix.arch }}.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | tee /tmp/pmd-v105-codesign.txt
          grep -q 'Authority=Developer ID Application' /tmp/pmd-v105-codesign.txt
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          mounted_app="$mount_dir/PayMyDine Cashier.app"
          test -d "$mounted_app"
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          spctl --assess --type execute --verbose=4 "$mounted_app"
          xcrun stapler validate "$mounted_app"
          icon_path="$(find "$mounted_app/Contents/Resources" -maxdepth 1 -type f -name '*.icns' -print -quit)"
          test -n "$icon_path"
          test -s "$icon_path"
          echo "SIGNED_DMG=$dmg_path"
          echo "SIGNED_APP=$mounted_app"
          echo "BRANDED_ICON=$icon_path"
          echo 'PMD_MAC_SIGNED_NOTARIZED_STAPLED=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v105-macos-${{ matrix.arch }}-signed
          path: apps/cashier-desktop/dist/PayMyDine-Cashier-1.0.5-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-preview:
    if: github.event_name != 'pull_request'
    needs: [contract-test, build-windows, build-macos-signed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pmd-v105-*
          path: release
          merge-multiple: true
      - name: Publish V1.0.5 only after signed/notarized Mac gates pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s release/PayMyDine-Cashier-Setup-1.0.5.exe
          test -s release/PayMyDine-Cashier-1.0.5-mac-arm64.dmg
          test -s release/PayMyDine-Cashier-1.0.5-mac-x64.dmg
          tag='pmd-cashier-v1-preview'
          notes='PayMyDine Cashier V1.0.5. Uses the canonical PayMyDine SVG brand icon instead of the Electron default icon. macOS artifacts are Developer ID signed, Apple notarized, Gatekeeper-assessed and stapled before publication. V1.0.4 Virtual PDF / Print Debug Mode and physical printing behavior are preserved.'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GH_REPO"
            gh release edit "$tag" --target "$GITHUB_SHA" --prerelease --title 'PayMyDine Cashier V1 Preview' --notes "$notes" --repo "$GH_REPO"
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title 'PayMyDine Cashier V1 Preview' --notes "$notes" --repo "$GH_REPO"
          fi
