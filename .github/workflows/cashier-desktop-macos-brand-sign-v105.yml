name: PayMyDine Cashier V1.0.5 Tahoe Native Icon + Brand

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cashier-desktop-macos-brand-sign-v105
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-macos-brand-sign-v105.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-macos-brand-sign-v105.yml'

permissions:
  contents: read

env:
  PMD_BRAND_LOGO_URL: https://tomo.paymydine.com/brand/paymydine-logo.svg

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V1.0.5 source and native macOS icon package
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run brand:icon
          test -s build/icon.svg
          test -s build/AppIcon.icon/icon.json
          test -s build/AppIcon.icon/Assets/PayMyDine.svg
          grep -q '"version": "1.0.5"' package.json
          grep -q '"icon": "build/icon.svg"' package.json
          grep -q '"icon": "build/AppIcon.icon"' package.json
          grep -q '"automatic-gradient": "extended-gray:1.00000,1.00000"' build/AppIcon.icon/icon.json
          grep -q '"image-name": "PayMyDine.svg"' build/AppIcon.icon/icon.json
          grep -q '"translucency"' build/AppIcon.icon/icon.json
          if grep -q '"notarize"' package.json; then
            echo 'REFUSED: classic V1.0.5 must not require notarization'
            exit 1
          fi
          echo 'V105_TAHOE_NATIVE_ICON_CONTRACT=PASS'

  build-windows:
    needs: contract-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download Cashier V1.0.5 source without Windows git checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'apps/cashier-desktop'
          $files = @(
            'package.json',
            'README.md',
            'scripts/apply-v104.js',
            'scripts/fetch-brand-icon.js',
            'src/main.js',
            'src/preload.js',
            'src/hardware.js',
            'src/receipt.js',
            'src/setup.html',
            'src/setup.js',
            'src/hardware.html',
            'src/hardware-page.js',
            'src/offline.html',
            'src/offline.js'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PayMyDine-Cashier-V105-Native-Icon-Build'
          }
          foreach ($relative in $files) {
            $encodedPath = ($relative -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:PMD_REPOSITORY/contents/apps/cashier-desktop/$encodedPath`?ref=$env:PMD_REF"
            $item = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $destination = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String(($item.content -replace '\s', '')))
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Syntax and V1.0.5 contract
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build branded Windows installer
        working-directory: apps/cashier-desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v105-windows
          path: apps/cashier-desktop/dist/PayMyDine-Cashier-Setup-1.0.5.exe
          if-no-files-found: error

  build-macos:
    needs: contract-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Download Cashier app files through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          root="$PWD/apps/cashier-desktop"
          mkdir -p "$root/src" "$root/scripts"
          files=(
            package.json
            README.md
            scripts/apply-v104.js
            scripts/fetch-brand-icon.js
            src/main.js
            src/preload.js
            src/hardware.js
            src/receipt.js
            src/setup.html
            src/setup.js
            src/hardware.html
            src/hardware-page.js
            src/offline.html
            src/offline.js
          )
          for relative in "${files[@]}"; do
            destination="$root/$relative"
            mkdir -p "$(dirname "$destination")"
            api="https://api.github.com/repos/$PMD_REPOSITORY/contents/apps/cashier-desktop/$relative?ref=$PMD_REF"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: PayMyDine-Cashier-V105-Tahoe-macOS-Build" \
              "$api" \
              | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
              > "$destination"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Xcode 26 tooling
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun actool --version
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Syntax check
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build macOS app with native Tahoe Icon Composer asset
        working-directory: apps/cashier-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Verify native Tahoe app icon is packaged
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name 'PayMyDine Cashier.app' -print -quit)"
          test -n "$app_path"
          test -s "$app_path/Contents/Resources/Assets.car"
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app_path/Contents/Info.plist")"
          test "$icon_name" = 'Icon'
          legacy_icon="$(find "$app_path/Contents/Resources" -maxdepth 1 -type f -name '*.icns' -print -quit)"
          test -n "$legacy_icon"
          test -s "$legacy_icon"
          dmg_path="dist/PayMyDine-Cashier-1.0.5-mac-${{ matrix.arch }}.dmg"
          test -s "$dmg_path"
          echo "PACKAGED_APP=$app_path"
          echo "CFBundleIconName=$icon_name"
          echo "ASSET_CATALOG=$app_path/Contents/Resources/Assets.car"
          echo "LEGACY_ICON=$legacy_icon"
          echo "DMG=$dmg_path"
          echo 'V105_MAC_TAHOE_NATIVE_ICON=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v105-macos-${{ matrix.arch }}
          path: apps/cashier-desktop/dist/PayMyDine-Cashier-1.0.5-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-preview:
    if: github.event_name != 'pull_request'
    needs: [contract-test, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pmd-v105-*
          path: release
          merge-multiple: true
      - name: Publish branded V1.0.5 native-icon packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s release/PayMyDine-Cashier-Setup-1.0.5.exe
          test -s release/PayMyDine-Cashier-1.0.5-mac-arm64.dmg
          test -s release/PayMyDine-Cashier-1.0.5-mac-x64.dmg
          tag='pmd-cashier-v1-preview'
          notes='PayMyDine Cashier V1.0.5. Preserves Virtual PDF and physical printing. Windows keeps the official PayMyDine icon. macOS 26 now receives a native Icon Composer / Assets.car app icon with a white enclosure and the official PayMyDine mark, removing the Tahoe legacy gray icon-jail fallback.'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GH_REPO"
            gh release edit "$tag" --target "$GITHUB_SHA" --prerelease --title 'PayMyDine Cashier V1 Preview' --notes "$notes" --repo "$GH_REPO"
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title 'PayMyDine Cashier V1 Preview' --notes "$notes" --repo "$GH_REPO"
          fi
          echo 'PMD_V105_NATIVE_ICON_RELEASE_PUBLISHED'
