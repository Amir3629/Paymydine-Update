name: PayMyDine Desktop V1.2.1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cashier-real-app-v110
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v110.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v110.yml'

permissions:
  contents: read

env:
  PMD_BRAND_LOGO_URL: https://tomo.paymydine.com/brand/paymydine-logo.svg

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V1.2.1 platform-cache contract
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q '"version": "1.2.1"' package.json
          grep -q '"main": "src/local-first-entry.js"' package.json
          grep -q '"productName": "PayMyDine"' package.json
          grep -q "require('./local-first-bootstrap').install()" src/local-first-entry.js
          grep -q "savePage(file, 'HTMLComplete')" src/local-first-bootstrap.js
          grep -q 'platform-snapshots-v121' src/local-first-bootstrap.js
          grep -q 'pmd:v121-json-get' src/local-first-bootstrap.js
          grep -q 'localCacheV121: true' src/preload.js
          grep -q '__PMD_DESKTOP_JSON_CACHE_V121__' src/preload.js
          grep -q "const PLATFORM_PATH = '/admin'" src/main.js
          grep -q 'mainWindow.loadURL(tenantUrl(tenant, PLATFORM_PATH))' src/main.js
          grep -q 'external-preload.js' src/main.js
          grep -q 'PMD_DESKTOP_SETUP_V120' src/setup.html
          if grep -q "loadFile(path.join(__dirname, 'app.html'))" src/main.js; then
            echo 'Desktop must keep the canonical PayMyDine Platform as its online UI.' >&2
            exit 1
          fi
          echo 'PMD_V121_PLATFORM_CACHE_CONTRACT=PASS'

  build-windows:
    needs: contract-test
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Download Desktop V1.2.1 source without full Windows git checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'apps/cashier-desktop'
          $files = @(
            'package.json',
            'scripts/fetch-brand-icon.js',
            'scripts/after-sign-mac-v106.js',
            'src/local-first-entry.js',
            'src/local-first-bootstrap.js',
            'src/local-store.js',
            'src/main.js',
            'src/preload.js',
            'src/external-preload.js',
            'src/hardware.js',
            'src/receipt.js',
            'src/setup.html',
            'src/setup.js',
            'src/hardware.html',
            'src/hardware-page.js',
            'src/offline.html',
            'src/offline.js'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PayMyDine-Desktop-V121-Windows-Build'
          }
          foreach ($relative in $files) {
            $encodedPath = ($relative -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:PMD_REPOSITORY/contents/apps/cashier-desktop/$encodedPath`?ref=$env:PMD_REF"
            $item = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $destination = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String(($item.content -replace '\s', '')))
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Verify source
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build Windows installer
        working-directory: apps/cashier-desktop
        run: npm run dist:win
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $path = 'apps/cashier-desktop/dist/PayMyDine-Desktop-Setup-1.2.1.exe'
          if (-not (Test-Path $path)) { throw 'Windows V1.2.1 installer missing' }
          $item = Get-Item $path
          if ($item.Length -lt 1000000) { throw 'Windows V1.2.1 installer is unexpectedly small' }
          Write-Host "PMD_V121_WINDOWS_INSTALLER_BYTES=$($item.Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v121-windows
          path: apps/cashier-desktop/dist/PayMyDine-Desktop-Setup-1.2.1.exe
          if-no-files-found: error

  build-macos-arm64:
    needs: contract-test
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Verify source
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build Apple Silicon app
        working-directory: apps/cashier-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --arm64
      - name: Verify Apple Silicon artifact
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          dmg='dist/PayMyDine-Desktop-1.2.1-mac-arm64.dmg'
          test -s "$dmg"
          echo "PMD_V121_MAC_ARM64_ARTIFACT=$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v121-macos-arm64
          path: apps/cashier-desktop/dist/PayMyDine-Desktop-1.2.1-mac-arm64.dmg
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/cashier-real-app-v110')
    needs: [contract-test, build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pmd-v121-*
          path: release
          merge-multiple: true
      - name: Publish V1.2.1 preview installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PMD_RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s release/PayMyDine-Desktop-Setup-1.2.1.exe
          test -s release/PayMyDine-Desktop-1.2.1-mac-arm64.dmg
          tag='pmd-desktop-v121-preview'
          notes='PayMyDine Desktop V1.2.1 preview. Canonical PayMyDine Platform UI remains authoritative online. The Desktop runtime now keeps bounded HTMLComplete snapshots of successful tenant Admin pages, caches safe operational GET payloads for Cashier table/menu data, preconnects the tenant and warms hovered internal navigation. When the cloud is unreachable it can fall back to the last cached real Platform screen instead of only showing a blank offline shell. Cached/offline mode never fakes kitchen submission, payment settlement or other writes.'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GH_REPO"
            gh release edit "$tag" --target "$PMD_RELEASE_TARGET" --prerelease --title 'PayMyDine Desktop V1.2.1 Preview' --notes "$notes" --repo "$GH_REPO"
          else
            gh release create "$tag" release/* --target "$PMD_RELEASE_TARGET" --prerelease --title 'PayMyDine Desktop V1.2.1 Preview' --notes "$notes" --repo "$GH_REPO"
          fi
          echo 'PMD_V121_PREVIEW_RELEASE=PASS'
