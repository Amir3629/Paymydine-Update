name: PayMyDine Desktop V1.5.0

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cashier-real-app-v110
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v110.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v110.yml'

concurrency:
  group: pmd-desktop-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PMD_BRAND_LOGO_URL: https://tomo.paymydine.com/brand/paymydine-logo.svg

jobs:
  contract-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V1.5.0 desktop and appliance contract
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q '"version": "1.5.0"' package.json
          grep -q '"dist:linux"' package.json
          grep -q '"executableName": "paymydine"' package.json
          grep -q "require('./linux-appliance').install()" src/local-first-entry.js
          grep -q 'linuxApplianceV150: true' src/preload.js
          grep -q 'pmd:linux-appliance-state' src/linux-appliance.js
          grep -q 'developer-desktop-once' src/linux-appliance.js
          grep -q "'win32', 'darwin', 'linux'" src/hardware.js
          grep -q 'Linux CUPS' src/hardware.js
          grep -q 'Ubuntu 24.04 LTS' scripts/linux/install-appliance.sh
          grep -q 'autologin-user=paymydine' scripts/linux/install-appliance.sh
          grep -q 'autologin-session=paymydine-kiosk' scripts/linux/install-appliance.sh
          grep -q 'exec startxfce4' scripts/linux/paymydine-kiosk-session.sh
          grep -q 'PAYMYDINE_APPLIANCE_DISABLED=YES' scripts/linux/disable-appliance.sh
          bash -n scripts/linux/install-appliance.sh
          bash -n scripts/linux/disable-appliance.sh
          bash -n scripts/linux/paymydine-kiosk-session.sh
          grep -q 'Client-EmbeddedShellLauncher' scripts/windows/enable-device-mode.ps1
          grep -q "const PLATFORM_PATH = '/admin'" src/main.js
          if grep -q "loadFile(path.join(__dirname, 'app.html'))" src/main.js; then
            echo 'Desktop must keep the canonical PayMyDine Platform as its UI authority.' >&2
            exit 1
          fi
          echo 'PMD_V150_LINUX_APPLIANCE_CONTRACT=PASS'

  build-windows:
    needs: contract-test
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Download Desktop V1.5.0 source without full Windows git checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'apps/cashier-desktop'
          $files = @(
            'package.json',
            'scripts/fetch-brand-icon.js',
            'scripts/after-sign-mac-v106.js',
            'scripts/windows/enable-device-mode.ps1',
            'scripts/windows/disable-device-mode.ps1',
            'scripts/linux/install-appliance.sh',
            'scripts/linux/disable-appliance.sh',
            'scripts/linux/paymydine-kiosk-session.sh',
            'scripts/linux/paymydine-kiosk.desktop',
            'scripts/linux/openbox-rc.xml',
            'src/local-first-entry.js',
            'src/local-cache-privacy.js',
            'src/local-first-bootstrap.js',
            'src/offline-blank-guard.js',
            'src/fast-route-pool.js',
            'src/fast-route-pool-v140.js',
            'src/device-mode.js',
            'src/linux-appliance.js',
            'src/local-store.js',
            'src/main.js',
            'src/preload.js',
            'src/developer-preload.js',
            'src/developer-unlock.html',
            'src/developer-unlock.js',
            'src/linux-developer-preload.js',
            'src/linux-developer-unlock.html',
            'src/linux-developer-unlock.js',
            'src/external-preload.js',
            'src/hardware.js',
            'src/receipt.js',
            'src/setup.html',
            'src/setup.js',
            'src/hardware.html',
            'src/hardware-page.js',
            'src/offline.html',
            'src/offline.js'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PayMyDine-Desktop-V150-Windows-Build'
          }
          foreach ($relative in $files) {
            $encodedPath = ($relative -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:PMD_REPOSITORY/contents/apps/cashier-desktop/$encodedPath`?ref=$env:PMD_REF"
            $item = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $destination = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String(($item.content -replace '\s', '')))
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Windows Device Mode PowerShell
        working-directory: apps/cashier-desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('scripts/windows/enable-device-mode.ps1','scripts/windows/disable-device-mode.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax validation failed: $script" }
          }
          Write-Host 'PMD_V150_WINDOWS_DEVICE_MODE_PARSE=PASS'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Verify source
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build Windows installer
        working-directory: apps/cashier-desktop
        run: npm run dist:win
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $path = 'apps/cashier-desktop/dist/PayMyDine-Desktop-Setup-1.5.0.exe'
          if (-not (Test-Path $path)) { throw 'Windows V1.5.0 installer missing' }
          if ((Get-Item $path).Length -lt 1000000) { throw 'Windows V1.5.0 installer is unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v150-windows
          path: apps/cashier-desktop/dist/PayMyDine-Desktop-Setup-1.5.0.exe
          if-no-files-found: error

  build-macos-arm64:
    needs: contract-test
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Verify source
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build Apple Silicon app
        working-directory: apps/cashier-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --arm64
      - name: Verify Apple Silicon artifact
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/PayMyDine-Desktop-1.5.0-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v150-macos-arm64
          path: apps/cashier-desktop/dist/PayMyDine-Desktop-1.5.0-mac-arm64.dmg
          if-no-files-found: error

  build-linux-amd64:
    needs: contract-test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Verify source
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build Linux packages
        working-directory: apps/cashier-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:linux
      - name: Build appliance kit
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/cashier-desktop/dist/PayMyDine-Desktop-1.5.0-linux-x86_64.AppImage || test -s apps/cashier-desktop/dist/PayMyDine-Desktop-1.5.0-linux-x64.AppImage
          deb="$(find apps/cashier-desktop/dist -maxdepth 1 -name 'PayMyDine-Desktop-1.5.0-linux-*.deb' -print -quit)"
          test -n "$deb" && test -s "$deb"
          tar -C apps/cashier-desktop/scripts/linux -czf PayMyDine-Appliance-Kit-1.5.0.tar.gz \
            install-appliance.sh disable-appliance.sh paymydine-kiosk-session.sh paymydine-kiosk.desktop openbox-rc.xml
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v150-linux-amd64
          path: |
            apps/cashier-desktop/dist/PayMyDine-Desktop-1.5.0-linux-*.deb
            apps/cashier-desktop/dist/PayMyDine-Desktop-1.5.0-linux-*.AppImage
            PayMyDine-Appliance-Kit-1.5.0.tar.gz
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/cashier-real-app-v110'
    needs: [contract-test, build-windows, build-macos-arm64, build-linux-amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pmd-v150-*
          path: release
          merge-multiple: true
      - name: Publish immutable V1.5.0 preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PMD_RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
          PMD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$GH_REPO/pulls/$PMD_PR_NUMBER" --jq '.head.sha')"
          if [[ "$current_head" != "$PMD_RELEASE_TARGET" ]]; then
            echo "PMD_V150_STALE_RUN_SKIPPED current=$current_head run=$PMD_RELEASE_TARGET"
            exit 0
          fi

          mkdir -p publish
          win="$(find release -type f -name 'PayMyDine-Desktop-Setup-1.5.0.exe' -print -quit)"
          mac="$(find release -type f -name 'PayMyDine-Desktop-1.5.0-mac-arm64.dmg' -print -quit)"
          kit="$(find release -type f -name 'PayMyDine-Appliance-Kit-1.5.0.tar.gz' -print -quit)"
          deb="$(find release -type f -name 'PayMyDine-Desktop-1.5.0-linux-*.deb' -print -quit)"
          appimage="$(find release -type f -name 'PayMyDine-Desktop-1.5.0-linux-*.AppImage' -print -quit)"

          for file in "$win" "$mac" "$kit" "$deb" "$appimage"; do
            test -n "$file" && test -s "$file"
            cp "$file" publish/
          done

          test "$(find publish -maxdepth 1 -type f | wc -l)" -eq 5
          echo 'PMD_V150_RELEASE_SHA256:'
          sha256sum publish/*

          tag='pmd-desktop-v150-preview'
          notes='PayMyDine Desktop V1.5.0 preview adds the first Ubuntu 24.04 LTS appliance path. Windows may remain installed in dual boot for evaluation. Linux packages include amd64 DEB/AppImage, CUPS printer/cash-drawer support, a restricted paymydine POS account, LightDM auto-login into a minimal Openbox kiosk session, password-protected DEV exit to an XFCE support desktop, and reboot-to-kiosk behavior. The appliance kit never repartitions or deletes Windows. Offline financial/order writes remain fail-closed.'

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'PMD_V150_RELEASE_ALREADY_EXISTS; immutable preview left unchanged'
            exit 0
          fi

          gh release create "$tag" publish/* --target "$PMD_RELEASE_TARGET" --prerelease --title 'PayMyDine Desktop V1.5.0 Linux Appliance Preview' --notes "$notes" --repo "$GH_REPO"
          echo 'PMD_V150_PREVIEW_RELEASE=PASS'
