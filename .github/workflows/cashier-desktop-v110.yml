name: PayMyDine Desktop V1.4.0

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cashier-real-app-v110
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v110.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/cashier-desktop/**'
      - '.github/workflows/cashier-desktop-v110.yml'

permissions:
  contents: read

env:
  PMD_BRAND_LOGO_URL: https://tomo.paymydine.com/brand/paymydine-logo.svg

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V1.4.0 seamless desktop contract
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q '"version": "1.4.0"' package.json
          grep -q '"main": "src/local-first-entry.js"' package.json
          grep -q '"productName": "PayMyDine"' package.json
          grep -q '"extraResources"' package.json
          grep -q "require('./local-cache-privacy').install()" src/local-first-entry.js
          grep -q "require('./local-first-bootstrap').install()" src/local-first-entry.js
          grep -q "require('./offline-blank-guard').install()" src/local-first-entry.js
          grep -q "require('./device-mode').install()" src/local-first-entry.js
          grep -q "require('./fast-route-pool-v140').install()" src/local-first-entry.js
          grep -q 'new WebContentsView' src/fast-route-pool-v140.js
          grep -q 'waitForPresentedFrame' src/fast-route-pool-v140.js
          grep -q "setBackgroundColor('#00000000')" src/fast-route-pool-v140.js
          grep -q 'pmd:v140-navigate' src/fast-route-pool-v140.js
          grep -q 'pmd:v140-warm-routes' src/preload.js
          grep -q 'windowsDeviceModeV140: true' src/preload.js
          grep -q 'pmd-device-mode-exit-v140' src/preload.js
          grep -q 'PASSWORD_SHA256' src/device-mode.js
          grep -q 'explorer.exe' src/device-mode.js
          grep -q 'PMD_DESKTOP_SETUP_V140' src/setup.html
          grep -q 'Dedicated POS computer' src/setup.html
          grep -q 'Client-EmbeddedShellLauncher' scripts/windows/enable-device-mode.ps1
          grep -q 'WESL_UserSetting' scripts/windows/enable-device-mode.ps1
          grep -q 'SetCustomShell' scripts/windows/enable-device-mode.ps1
          grep -q "savePage(file, 'MHTML')" src/local-first-bootstrap.js
          grep -q 'capturePage' src/local-first-bootstrap.js
          grep -q 'cached MHTML rendered blank' src/offline-blank-guard.js
          grep -q "const PLATFORM_PATH = '/admin'" src/main.js
          grep -q 'external-preload.js' src/main.js
          if grep -q "loadFile(path.join(__dirname, 'app.html'))" src/main.js; then
            echo 'Desktop must keep the canonical PayMyDine Platform as its UI authority.' >&2
            exit 1
          fi
          echo 'PMD_V140_SEAMLESS_DEVICE_MODE_CONTRACT=PASS'

  build-windows:
    needs: contract-test
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Download Desktop V1.4.0 source without full Windows git checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PMD_REPOSITORY: ${{ github.repository }}
          PMD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'apps/cashier-desktop'
          $files = @(
            'package.json',
            'scripts/fetch-brand-icon.js',
            'scripts/after-sign-mac-v106.js',
            'scripts/windows/enable-device-mode.ps1',
            'scripts/windows/disable-device-mode.ps1',
            'src/local-first-entry.js',
            'src/local-cache-privacy.js',
            'src/local-first-bootstrap.js',
            'src/offline-blank-guard.js',
            'src/fast-route-pool.js',
            'src/fast-route-pool-v140.js',
            'src/device-mode.js',
            'src/local-store.js',
            'src/main.js',
            'src/preload.js',
            'src/developer-preload.js',
            'src/developer-unlock.html',
            'src/developer-unlock.js',
            'src/external-preload.js',
            'src/hardware.js',
            'src/receipt.js',
            'src/setup.html',
            'src/setup.js',
            'src/hardware.html',
            'src/hardware-page.js',
            'src/offline.html',
            'src/offline.js'
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PayMyDine-Desktop-V140-Windows-Build'
          }
          foreach ($relative in $files) {
            $encodedPath = ($relative -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:PMD_REPOSITORY/contents/apps/cashier-desktop/$encodedPath`?ref=$env:PMD_REF"
            $item = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $destination = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String(($item.content -replace '\s', '')))
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Windows Device Mode PowerShell
        working-directory: apps/cashier-desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('scripts/windows/enable-device-mode.ps1','scripts/windows/disable-device-mode.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $script"
            }
          }
          Write-Host 'PMD_V140_DEVICE_MODE_POWERSHELL_PARSE=PASS'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Verify source
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build Windows installer
        working-directory: apps/cashier-desktop
        run: npm run dist:win
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $path = 'apps/cashier-desktop/dist/PayMyDine-Desktop-Setup-1.4.0.exe'
          if (-not (Test-Path $path)) { throw 'Windows V1.4.0 installer missing' }
          $item = Get-Item $path
          if ($item.Length -lt 1000000) { throw 'Windows V1.4.0 installer is unexpectedly small' }
          Write-Host "PMD_V140_WINDOWS_INSTALLER_BYTES=$($item.Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v140-windows
          path: apps/cashier-desktop/dist/PayMyDine-Desktop-Setup-1.4.0.exe
          if-no-files-found: error

  build-macos-arm64:
    needs: contract-test
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/cashier-desktop
        run: npm install
      - name: Verify source
        working-directory: apps/cashier-desktop
        run: npm run check
      - name: Build Apple Silicon app
        working-directory: apps/cashier-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --arm64
      - name: Verify Apple Silicon artifact
        working-directory: apps/cashier-desktop
        shell: bash
        run: |
          set -euo pipefail
          dmg='dist/PayMyDine-Desktop-1.4.0-mac-arm64.dmg'
          test -s "$dmg"
          echo "PMD_V140_MAC_ARM64_ARTIFACT=$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: pmd-v140-macos-arm64
          path: apps/cashier-desktop/dist/PayMyDine-Desktop-1.4.0-mac-arm64.dmg
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/cashier-real-app-v110')
    needs: [contract-test, build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pmd-v140-*
          path: release
          merge-multiple: true
      - name: Publish V1.4.0 preview installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PMD_RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s release/PayMyDine-Desktop-Setup-1.4.0.exe
          test -s release/PayMyDine-Desktop-1.4.0-mac-arm64.dmg
          tag='pmd-desktop-v140-preview'
          notes='PayMyDine Desktop V1.4.0 preview. V1.4 removes route-switch blinking with double-buffered transparent WebContentsView transitions: the old live page stays visible until the incoming page has presented real renderer frames. The canonical PayMyDine UI, role permissions, MHTML/screenshot offline fallback, printer and cash drawer remain intact. Windows adds opt-in Dedicated POS Device Mode using Microsoft Shell Launcher on supported Enterprise/Education/IoT Enterprise editions. Device Mode makes PayMyDine the user shell, restarts into PayMyDine after reboot/sign-in, blocks normal app-exit shortcuts, and adds a small password-protected Developer Exit that temporarily launches Explorer without disabling Device Mode. Offline writes/payments remain fail-closed.'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GH_REPO"
            gh release edit "$tag" --target "$PMD_RELEASE_TARGET" --prerelease --title 'PayMyDine Desktop V1.4.0 Preview' --notes "$notes" --repo "$GH_REPO"
          else
            gh release create "$tag" release/* --target "$PMD_RELEASE_TARGET" --prerelease --title 'PayMyDine Desktop V1.4.0 Preview' --notes "$notes" --repo "$GH_REPO"
          fi
          echo 'PMD_V140_PREVIEW_RELEASE=PASS'
