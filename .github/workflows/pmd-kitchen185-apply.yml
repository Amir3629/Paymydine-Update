name: PMD Kitchen Foundation Apply

on:
  push:
    branches:
      - feature/kitchen-operations-foundation-185
    paths:
      - '.pmd/kitchen185.patch.gz.b64.part*'
      - '.pmd/apply_frontend_kitchen185.py'
      - '.github/workflows/pmd-kitchen185-apply.yml'

permissions:
  contents: write

concurrency:
  group: pmd-kitchen185-apply
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct backend patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pmd/kitchen185.patch.gz.b64.part* > /tmp/kitchen185.patch.gz.b64
          base64 -d /tmp/kitchen185.patch.gz.b64 | gzip -d > /tmp/kitchen185.full.patch
          awk '/^--- a\/frontend-v2\//{exit} {print}' /tmp/kitchen185.full.patch > /tmp/kitchen185.backend.patch
          test -s /tmp/kitchen185.backend.patch
          patch --dry-run -p1 < /tmp/kitchen185.backend.patch

      - name: Apply backend changes
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < /tmp/kitchen185.backend.patch

      - name: Apply asserted frontend changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .pmd/apply_frontend_kitchen185.py

      - name: PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/database/migrations/2026_08_28_230000_create_pmd_kitchen_operations_foundation.php
            app/Services/PmdKitchenWorkforceService.php
            app/Services/PmdKitchenEtaLifecycleService.php
            app/Services/OrderEtaService.php
            app/admin/controllers/Shifts.php
            app/admin/controllers/Dashboardlab.php
            app/admin/controllers/Managerlab.php
            app/admin/controllers/Pmdsettings.php
            app/admin/controllers/Pmdadvanced.php
            app/admin/controllers/Pmdmenus.php
            app/admin/controllers/KitchenDisplay.php
            app/admin/controllers/concerns/PmdWaiterPosSaveEndpoint.php
            app/main/routes/api-v1-guest-order-flow-r60t.php
          )
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Admin JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app/admin/assets/js/pmd-shifts-v1.js
          node --check app/admin/assets/js/pmd-menu-prep-presets.js
          node --check app/admin/assets/js/pmd-menu-manager-v129.js
          node --check app/admin/assets/js/pmd-cashier-order-composer-r51.js

      - name: KDS workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "cardClickStartsPreparing: true" app/admin/views/kitchendisplay/index.blade.php
          grep -F "visibleStatusButtons: ['Ready']" app/admin/views/kitchendisplay/index.blade.php
          if grep -Fq '>Start prep<' app/admin/views/kitchendisplay/index.blade.php; then
            echo 'Unexpected Start prep button was introduced.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/package-lock.json

      - name: Frontend install
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run typecheck

      - name: Theme isolation audit
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run theme:audit

      - name: Source safety audit with known main baseline
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        shell: bash
        run: |
          set +e
          output="$(npm run source:audit 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          printf '%s\n' "$output" | grep -F -- '- src/runtime/components/RuntimeOverlays.tsx: runtime style.setProperty is not allowed'
          printf '%s\n' "$output" | grep -F -- '- src/runtime/components/ThemeTableBadge.tsx: runtime style.setProperty is not allowed'
          extras="$(printf '%s\n' "$output" | grep '^- ' | grep -Fv -- '- src/runtime/components/RuntimeOverlays.tsx: runtime style.setProperty is not allowed' | grep -Fv -- '- src/runtime/components/ThemeTableBadge.tsx: runtime style.setProperty is not allowed' || true)"
          if [ -n "$extras" ]; then
            printf '%s\n' 'New source-safety violations detected:' "$extras" >&2
            exit 1
          fi
          echo 'Only the two pre-existing main-branch source-safety debts are present.'

      - name: Structure audit
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run structure:audit

      - name: Frontend production build
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
        run: npm run build

      - name: Verify source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          grep -F "cardClickStartsPreparing: true" app/admin/views/kitchendisplay/index.blade.php
          grep -F "5–10 min" app/admin/views/pmdmenus/_modal_host.blade.php
          grep -F "guest_paid_release" app/main/routes/api-v1-guest-order-flow-r60t.php

      - name: Commit tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PMD Kitchen Foundation CI'
          git config user.email 'pmd-kitchen-foundation@users.noreply.github.com'
          git add app frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'Kitchen operations foundation (#185)'
          git push origin HEAD:feature/kitchen-operations-foundation-185
