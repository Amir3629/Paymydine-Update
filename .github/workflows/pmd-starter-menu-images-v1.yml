name: PMD Starter Menu Images V1

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - .github/workflows/pmd-starter-menu-images-v1.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903
          fetch-depth: 0

      - name: Add starter image service and wire Quick Setup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          image_service = r'''<?php

namespace Admin\Services;

use Admin\Models\Menus_model;
use Illuminate\Support\Facades\Http;
use Illuminate\Support\Str;

/**
 * PMD_STARTER_MENU_IMAGES_V1
 *
 * Best-effort starter-photo provider for Quick Setup.
 *
 * - Searches only Openverse results marked CC0 / Public Domain.
 * - Uses a small allow-list of image CDN hosts.
 * - Preserves the source aspect ratio; no crop is performed.
 * - Re-encodes accepted photos to WEBP and caches them globally on disk.
 * - Never makes Quick Setup fail if the external image service is unavailable.
 * - Stores source metadata in storage/app for auditability.
 */
class PmdStarterMenuImageServiceV1
{
    public const VERSION = '1.0.0';

    protected const OPENVERSE_ENDPOINT = 'https://api.openverse.org/v1/images/';
    protected const MAX_SOURCE_BYTES = 10 * 1024 * 1024;
    protected const MAX_EDGE = 1600;
    protected const TARGET_BYTES = 700000;

    /** @var array<string,bool> */
    protected array $usedSourceIds = [];

    public function attachToMenu(Menus_model $menu, array $item, string $restaurantType): array
    {
        $menuId = (int)($menu->menu_id ?? 0);
        if ($menuId < 1) {
            return ['attached' => false, 'missing' => true, 'reason' => 'menu_id'];
        }

        try {
            $connection = $menu->getConnection();
            $schema = $connection->getSchemaBuilder();
            if (!$schema->hasTable('menu_images')) {
                return ['attached' => false, 'missing' => true, 'reason' => 'menu_images'];
            }

            if ($connection->table('menu_images')->where('menu_id', $menuId)->exists()) {
                return ['attached' => false, 'missing' => false, 'reason' => 'existing_image'];
            }

            $directory = base_path('assets/media/uploads');
            if (!is_dir($directory) && !@mkdir($directory, 0755, true) && !is_dir($directory)) {
                return ['attached' => false, 'missing' => true, 'reason' => 'directory'];
            }

            $filename = $this->filename($restaurantType, (string)($item['name'] ?? 'food'));
            $path = $directory.DIRECTORY_SEPARATOR.$filename;
            $cached = is_file($path) && (int)@filesize($path) > 0;
            $source = null;

            if (!$cached) {
                $source = $this->materialize($item, $restaurantType, $path);
                if (!$source) {
                    return ['attached' => false, 'missing' => true, 'reason' => 'no_safe_photo'];
                }
            }

            if (!is_file($path) || (int)@filesize($path) < 1) {
                return ['attached' => false, 'missing' => true, 'reason' => 'file_missing'];
            }

            $row = ['menu_id' => $menuId, 'image_path' => $filename];
            if ($schema->hasColumn('menu_images', 'sort_order')) $row['sort_order'] = 1;
            if ($schema->hasColumn('menu_images', 'created_at')) $row['created_at'] = now();
            if ($schema->hasColumn('menu_images', 'updated_at')) $row['updated_at'] = now();
            $connection->table('menu_images')->insert($row);

            return [
                'attached' => true,
                'cached' => $cached,
                'missing' => false,
                'filename' => $filename,
                'source' => $source,
            ];
        } catch (\Throwable $error) {
            return [
                'attached' => false,
                'missing' => true,
                'reason' => 'exception',
            ];
        }
    }

    protected function materialize(array $item, string $restaurantType, string $targetPath): ?array
    {
        if (!function_exists('imagecreatefromstring') || !function_exists('imagewebp')) {
            return null;
        }

        foreach ($this->queries($item, $restaurantType) as $query) {
            foreach ($this->search($query) as $candidate) {
                $id = trim((string)($candidate['id'] ?? ''));
                if ($id !== '' && isset($this->usedSourceIds[$id])) continue;

                if ($this->downloadAsWebp($candidate, $targetPath)) {
                    if ($id !== '') $this->usedSourceIds[$id] = true;
                    $this->recordSource($targetPath, $candidate, $query);

                    return [
                        'id' => $id,
                        'license' => strtolower(trim((string)($candidate['license'] ?? ''))),
                        'source' => trim((string)($candidate['source'] ?? '')),
                        'landing_url' => trim((string)($candidate['foreign_landing_url'] ?? '')),
                    ];
                }
            }
        }

        return null;
    }

    /** @return array<int,string> */
    protected function queries(array $item, string $restaurantType): array
    {
        $name = trim((string)($item['name'] ?? ''));
        $category = trim((string)($item['category'] ?? ''));
        $cuisine = $this->cuisineTerm($restaurantType);

        $queries = [
            trim($name.' food'),
            trim($name.' dish'),
            trim($cuisine.' '.$category.' food'),
            trim($cuisine.' food'),
        ];

        return array_values(array_unique(array_filter($queries)));
    }

    protected function cuisineTerm(string $type): string
    {
        return [
            'arabic' => 'middle eastern cuisine',
            'fine_dining' => 'fine dining plated dish',
            'bar' => 'cocktail bar drink',
            'cafe' => 'cafe brunch',
            'steakhouse' => 'steak grill',
            'mediterranean' => 'mediterranean seafood',
            'mexican' => 'mexican latin cuisine',
        ][strtolower(trim($type))] ?? str_replace('_', ' ', strtolower(trim($type))).' cuisine';
    }

    /** @return array<int,array<string,mixed>> */
    protected function search(string $query): array
    {
        try {
            $response = Http::acceptJson()
                ->withHeaders(['User-Agent' => 'PayMyDine-StarterMenu/1.0 (+https://paymydine.com)'])
                ->timeout(8)
                ->get(self::OPENVERSE_ENDPOINT, [
                    'q' => mb_substr($query, 0, 180),
                    'license' => 'cc0,pdm',
                    'category' => 'photograph',
                    'source' => 'stocksnap,wikimedia,flickr',
                    'mature' => 'false',
                    'page_size' => 20,
                ]);

            if (!$response->successful()) return [];
            $payload = (array)$response->json();
            $results = isset($payload['results']) && is_array($payload['results'])
                ? $payload['results']
                : [];

            $accepted = [];
            foreach ($results as $candidate) {
                if (!is_array($candidate) || !$this->candidateIsSafe($candidate)) continue;
                $accepted[] = $candidate;
            }

            return $accepted;
        } catch (\Throwable $error) {
            return [];
        }
    }

    protected function candidateIsSafe(array $candidate): bool
    {
        $license = strtolower(trim((string)($candidate['license'] ?? '')));
        if (!in_array($license, ['cc0', 'pdm'], true)) return false;
        if (!empty($candidate['mature'])) return false;

        $url = trim((string)($candidate['url'] ?? ''));
        if (!$this->urlIsAllowed($url)) return false;

        $title = strtolower(trim((string)($candidate['title'] ?? '')));
        foreach (['logo', 'icon', 'diagram', 'vector', 'map', 'menu board', 'poster'] as $blocked) {
            if ($title !== '' && str_contains($title, $blocked)) return false;
        }

        $width = (int)($candidate['width'] ?? 0);
        $height = (int)($candidate['height'] ?? 0);
        if ($width > 0 && $height > 0 && ($width * $height) < 300000) return false;

        return true;
    }

    protected function urlIsAllowed(string $url): bool
    {
        if (!str_starts_with(strtolower($url), 'https://')) return false;
        $host = strtolower((string)parse_url($url, PHP_URL_HOST));
        if ($host === 'cdn.stocksnap.io' || $host === 'upload.wikimedia.org') return true;
        if ($host === 'live.staticflickr.com' || str_ends_with($host, '.staticflickr.com')) return true;
        return false;
    }

    protected function downloadAsWebp(array $candidate, string $targetPath): bool
    {
        $url = trim((string)($candidate['url'] ?? ''));
        if (!$this->urlIsAllowed($url)) return false;

        $download = $targetPath.'.download-'.bin2hex(random_bytes(4));
        $output = $targetPath.'.tmp-'.bin2hex(random_bytes(4));

        try {
            $response = Http::withHeaders(['User-Agent' => 'PayMyDine-StarterMenu/1.0 (+https://paymydine.com)'])
                ->timeout(15)
                ->withOptions(['sink' => $download])
                ->get($url);

            if (!$response->successful() || !is_file($download)) return false;
            $bytes = (int)@filesize($download);
            if ($bytes < 15000 || $bytes > self::MAX_SOURCE_BYTES) return false;

            $raw = @file_get_contents($download);
            if ($raw === false || $raw === '') return false;
            $source = @imagecreatefromstring($raw);
            if (!$source) return false;

            $width = imagesx($source);
            $height = imagesy($source);
            if ($width < 1 || $height < 1 || ($width * $height) < 300000) {
                imagedestroy($source);
                return false;
            }

            $scale = min(1, self::MAX_EDGE / max($width, $height));
            $targetWidth = max(1, (int)round($width * $scale));
            $targetHeight = max(1, (int)round($height * $scale));

            $canvas = imagecreatetruecolor($targetWidth, $targetHeight);
            imagealphablending($canvas, false);
            imagesavealpha($canvas, true);
            $transparent = imagecolorallocatealpha($canvas, 255, 255, 255, 127);
            imagefilledrectangle($canvas, 0, 0, $targetWidth, $targetHeight, $transparent);
            imagecopyresampled(
                $canvas,
                $source,
                0,
                0,
                0,
                0,
                $targetWidth,
                $targetHeight,
                $width,
                $height
            );

            $ok = imagewebp($canvas, $output, 78);
            if ($ok && is_file($output) && (int)@filesize($output) > self::TARGET_BYTES) {
                $ok = imagewebp($canvas, $output, 70);
            }
            if ($ok && is_file($output) && (int)@filesize($output) > self::TARGET_BYTES) {
                $ok = imagewebp($canvas, $output, 64);
            }

            imagedestroy($canvas);
            imagedestroy($source);

            if (!$ok || !is_file($output) || (int)@filesize($output) < 10000) return false;
            @chmod($output, 0644);
            if (!@rename($output, $targetPath)) return false;

            return true;
        } catch (\Throwable $error) {
            return false;
        } finally {
            if (is_file($download)) @unlink($download);
            if (is_file($output)) @unlink($output);
        }
    }

    protected function filename(string $type, string $name): string
    {
        $typeSlug = Str::slug($type) ?: 'restaurant';
        $itemSlug = Str::slug($name) ?: 'food';
        return 'pmdstarter_v1_'.$typeSlug.'_'.$itemSlug.'.webp';
    }

    protected function recordSource(string $targetPath, array $candidate, string $query): void
    {
        try {
            $manifest = storage_path('app/pmd-starter-menu-image-sources-v1.json');
            $directory = dirname($manifest);
            if (!is_dir($directory)) @mkdir($directory, 0755, true);

            $handle = @fopen($manifest, 'c+');
            if (!$handle) return;
            if (!flock($handle, LOCK_EX)) {
                fclose($handle);
                return;
            }

            rewind($handle);
            $existing = stream_get_contents($handle);
            $data = json_decode((string)$existing, true);
            if (!is_array($data)) $data = [];

            $data[basename($targetPath)] = [
                'query' => $query,
                'openverse_id' => trim((string)($candidate['id'] ?? '')),
                'title' => trim((string)($candidate['title'] ?? '')),
                'creator' => trim((string)($candidate['creator'] ?? '')),
                'license' => strtolower(trim((string)($candidate['license'] ?? ''))),
                'license_url' => trim((string)($candidate['license_url'] ?? '')),
                'source' => trim((string)($candidate['source'] ?? '')),
                'landing_url' => trim((string)($candidate['foreign_landing_url'] ?? '')),
                'download_url' => trim((string)($candidate['url'] ?? '')),
                'saved_at' => now()->toIso8601String(),
            ];

            ftruncate($handle, 0);
            rewind($handle);
            fwrite($handle, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
            fflush($handle);
            flock($handle, LOCK_UN);
            fclose($handle);
        } catch (\Throwable $error) {
            // Audit metadata must never make onboarding fail.
        }
    }
}
'''

          service_path = Path('app/admin/Services/PmdStarterMenuImageServiceV1.php')
          service_path.write_text(image_service, encoding='utf-8')

          quick_path = Path('app/admin/Services/PmdTenantQuickSetupService.php')
          quick = quick_path.read_text(encoding='utf-8')

          old = """        $itemPriority = 10;\n        foreach ($pack['items'] as $item) {\n"""
          new = """        // PMD_STARTER_MENU_IMAGES_V1\n        // One shared resolver instance prevents duplicate source photos inside\n        // the same starter pack. Image lookup is best-effort and never blocks setup.\n        $imageService = app(PmdStarterMenuImageServiceV1::class);\n        $imageSummary = ['attached' => 0, 'cached' => 0, 'missing' => 0];\n\n        $itemPriority = 10;\n        foreach ($pack['items'] as $item) {\n"""
          if old not in quick:
              raise SystemExit('seed loop marker not found')
          quick = quick.replace(old, new, 1)

          old = """            if ($allergenIds) $menu->allergens()->sync(array_values(array_unique($allergenIds)));\n\n            $itemPriority += 10;\n"""
          new = """            if ($allergenIds) $menu->allergens()->sync(array_values(array_unique($allergenIds)));\n\n            try {\n                $imageResult = $imageService->attachToMenu($menu, $item, $type);\n                if (!empty($imageResult['attached'])) $imageSummary['attached']++;\n                if (!empty($imageResult['cached'])) $imageSummary['cached']++;\n                if (!empty($imageResult['missing'])) $imageSummary['missing']++;\n            } catch (\\Throwable $ignored) {\n                $imageSummary['missing']++;\n            }\n\n            $itemPriority += 10;\n"""
          if old not in quick:
              raise SystemExit('allergen marker not found')
          quick = quick.replace(old, new, 1)

          old = """            'items' => count($pack['items']),\n            'review_required' => true,\n"""
          new = """            'items' => count($pack['items']),\n            'images' => $imageSummary,\n            'review_required' => true,\n"""
          if old not in quick:
              raise SystemExit('result marker not found')
          quick = quick.replace(old, new, 1)
          quick_path.write_text(quick, encoding='utf-8')

          view_path = Path('app/admin/views/pmdquicksetup/index.blade.php')
          view = view_path.read_text(encoding='utf-8')
          old = 'Includes categories, item descriptions, suggested prices, nutrition and allergen suggestions. Review these against your real recipes before publishing.'
          new = 'Includes categories, item descriptions, suggested prices, lightweight starter photos, nutrition and allergen suggestions. Review these against your real recipes before publishing.'
          if old not in view:
              raise SystemExit('starter-menu copy marker not found')
          view = view.replace(old, new, 1)
          view_path.write_text(view, encoding='utf-8')
          PY

      - name: Validate PHP and contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l app/admin/Services/PmdStarterMenuImageServiceV1.php
          php -l app/admin/Services/PmdTenantQuickSetupService.php
          grep -n "PMD_STARTER_MENU_IMAGES_V1" app/admin/Services/PmdStarterMenuImageServiceV1.php
          grep -n "attachToMenu" app/admin/Services/PmdTenantQuickSetupService.php
          grep -n "lightweight starter photos" app/admin/views/pmdquicksetup/index.blade.php
          grep -n "license' => 'cc0,pdm'" app/admin/Services/PmdStarterMenuImageServiceV1.php
          grep -n "imagewebp" app/admin/Services/PmdStarterMenuImageServiceV1.php

      - name: Audit restaurant-type coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/admin/Services/PmdStarterMenuLibraryV1.php').read_text(encoding='utf-8')
          types_block = text.split('public function restaurantTypes(): array',1)[1].split('public function pack(',1)[0]
          types = re.findall(r"'([a-z_]+)'\s*=>\s*\['label'", types_block)
          packs = re.findall(r'private function pack([A-Za-z]+)\(\): array\s*\{(.*?)\n\s*\}', text, re.S)
          counts = {name: body.count('$this->i(') for name, body in packs}
          print('restaurant_types=', len(types), types)
          print('pack_item_counts=', counts)
          print('total_starter_items=', sum(counts.values()))
          if len(types) < 15:
              raise SystemExit('Expected all restaurant types to remain available')
          if any(v < 1 for v in counts.values()):
              raise SystemExit('A starter pack has no menu items')
          PY

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PayMyDine CI"
          git config user.email "ci@paymydine.local"
          git add \
            app/admin/Services/PmdStarterMenuImageServiceV1.php \
            app/admin/Services/PmdTenantQuickSetupService.php \
            app/admin/views/pmdquicksetup/index.blade.php
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Quick setup: add starter menu image seeding"
          git push origin HEAD:feature/menu-gallery-sides-options-20260903
