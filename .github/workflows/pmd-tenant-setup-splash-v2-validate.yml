name: PMD Tenant Setup Splash V2 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/page.tsx
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/domain/model.ts
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/server/bootstrap.ts
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
      - frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.module.css
      - .github/workflows/pmd-tenant-setup-splash-v2-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Setup splash wiring guard
        working-directory: .
        run: |
          grep -q "TenantSetupSplashV1" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/app/page.tsx
          grep -q "is_frontend_configured" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/server/bootstrap.ts
          grep -q "has_categories" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/server/bootstrap.ts
          grep -q "href=\"/admin\"" frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/TenantSetupSplashV1.tsx
          test ! -e app/main/routes/pmd-new-tenant-quick-setup-v1.php
          ! grep -q "PMD_NEW_TENANT_OWNER_QUICK_SETUP_R8" app/admin/assets/js/pmd-new-tenant-onboarding-r7.js
