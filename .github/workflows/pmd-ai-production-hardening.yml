name: PMD AI Production Hardening

on:
  pull_request:
    paths:
      - 'app/Services/AI/**'
      - 'app/admin/controllers/Pmdintelligence.php'
      - 'app/main/routes/api-v1-guest-ai.php'
      - 'config/pmd_ai.php'
      - 'scripts/pmd-ai-*.php'
      - 'docs/PMD_INTELLIGENCE*.md'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/GuestAiConcierge.tsx'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/scripts/guest-ai-contract-audit.mjs'
      - '.github/workflows/pmd-ai-production-hardening.yml'
  push:
    branches: [main]
    paths:
      - 'app/Services/AI/**'
      - 'app/admin/controllers/Pmdintelligence.php'
      - 'app/main/routes/api-v1-guest-ai.php'
      - 'config/pmd_ai.php'
      - 'scripts/pmd-ai-*.php'
      - 'docs/PMD_INTELLIGENCE*.md'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/src/runtime/components/GuestAiConcierge.tsx'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/scripts/guest-ai-contract-audit.mjs'
      - '.github/workflows/pmd-ai-production-hardening.yml'

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l config/pmd_ai.php
          php -l app/Services/AI/AiHealthService.php
          php -l app/Services/AI/AiUsageLedger.php
          php -l app/Services/AI/AiCapabilityPolicy.php
          php -l app/Services/AI/AiRetentionService.php
          php -l app/Services/AI/GuestAiContextBuilder.php
          php -l app/Services/AI/AiBudgetService.php
          php -l app/Services/AI/AiOrchestrator.php
          php -l app/Services/AI/GuestMenuAiService.php
          php -l scripts/pmd-ai-maintenance.php
          php -l scripts/pmd-ai-production-contract-audit.php
      - name: Production AI contract
        run: php scripts/pmd-ai-production-contract-audit.php

  guest-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guest AI source contract
        run: node scripts/guest-ai-contract-audit.mjs
