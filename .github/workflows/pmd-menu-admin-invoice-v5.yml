name: PMD Menu Admin Invoice V5

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - scripts/pmd-menu-admin-invoice-v5-apply.py
      - .github/workflows/pmd-menu-admin-invoice-v5.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/menu-gallery-sides-options-20260903
          fetch-depth: 0

      - name: Apply V5 patch
        run: python3 scripts/pmd-menu-admin-invoice-v5-apply.py

      - name: Validate Admin JavaScript syntax
        run: node --check app/admin/assets/js/pmd-menu-gallery-options-v5.js

      - name: Validate Admin asset manifest
        run: python3 -m json.tool app/admin/views/_meta/assets.json >/dev/null

      - name: Validate invoice source markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/admin/views/orders/customer_invoice.blade.php')
          s = p.read_text()
          required = [
              'PMD_CUSTOMER_INVOICE_OPTION_LINES_V5',
              "$orderMenuOptionPayloads = collect();",
              "menu_option_values as mov",
              "base_line_total",
              '<tr class="option-row">',
          ]
          for needle in required:
              assert needle in s, needle
          assert s.count('PMD_CUSTOMER_INVOICE_OPTION_LINES_V5') == 1
          print('invoice markers OK')
          PY
          php -l app/admin/views/orders/customer_invoice.blade.php

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/admin/assets/js/pmd-menu-gallery-options-v5.js \
            app/admin/assets/css/pmd-menu-gallery-options-v5.css \
            app/admin/views/_meta/assets.json \
            app/admin/views/orders/customer_invoice.blade.php
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Menu: cache-bust admin options and split invoice modifiers"
          git push origin HEAD:feature/menu-gallery-sides-options-20260903
