name: PayMyDine Staff Android (separate APK)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/staff/**'
      - 'mobile/android/settings.gradle.kts'
      - '.github/workflows/paymydine-staff-android-v1.yml'
      - 'app/Http/Controllers/PmdStaffPortalV6Controller.php'
      - 'app/Services/PmdStaffClockGeofenceV1.php'
      - 'app/admin/controllers/Shifts.php'
      - 'app/admin/Services/PmdStaffOperationsCenterV1.php'
      - 'app/admin/assets/js/pmd-staff-time-clock-v1.js'
      - 'app/admin/assets/js/pmd-shifts-staff-center-v1.js'
      - 'app/admin/controllers/Mywork.php'
      - 'app/admin/controllers/Pmdsettings.php'
      - 'app/admin/views/pmdsettings/restaurant.blade.php'
      - 'app/admin/views/pmdsettings/index.blade.php'
      - 'scripts/pmd-staff-apk-settings-v1-deploy.sh'
      - 'pmd-qa/scripts/staff-settings-download-contract.test.cjs'
      - 'app/admin/assets/css/pmd-staff-time-clock-v1.css'
      - 'scripts/pmd-install-staff-platform-v1.sh'
      - 'app/admin/views/pmdshifts/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/staff/**'
      - 'app/admin/assets/js/pmd-staff-time-clock-v1.js'
      - 'app/Http/Controllers/PmdStaffPortalV6Controller.php'
      - '.github/workflows/paymydine-staff-android-v1.yml'
      - 'pmd-qa/scripts/staff-native-gps-contract.test.cjs'
      - 'app/admin/views/pmdsettings/index.blade.php'
      - 'scripts/pmd-staff-apk-settings-v1-deploy.sh'
      - 'pmd-qa/scripts/staff-settings-download-contract.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-contract:
    name: Validate tenant attendance and operations center
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/Services/PmdStaffClockGeofenceV1.php
          php -l app/Http/Controllers/PmdStaffPortalV6Controller.php
          php -l app/admin/Services/PmdStaffOperationsCenterV1.php
          php -l app/admin/controllers/Shifts.php
          php -l app/admin/controllers/Mywork.php
          php -l app/admin/controllers/Pmdsettings.php
          bash -n scripts/pmd-install-staff-platform-v1.sh
          bash -n scripts/pmd-staff-native-gps-v1-deploy.sh
          bash -n scripts/pmd-staff-apk-settings-v1-deploy.sh
      - name: Browser script syntax
        run: |
          node --check app/admin/assets/js/pmd-staff-time-clock-v1.js
          node --check app/admin/assets/js/pmd-shifts-staff-center-v1.js
          node pmd-qa/scripts/staff-native-gps-contract.test.cjs
          node pmd-qa/scripts/staff-settings-download-contract.test.cjs
      - name: Separation, auth and privacy contracts
        run: |
          set -eu
          grep -Fq 'applicationId = "com.paymydine.staff"' mobile/android/staff/build.gradle.kts
          grep -Fq 'applicationId = "com.paymydine.mobile"' mobile/android/app/build.gradle.kts
          grep -Fq 'PMD_STAFF_GEOFENCE_SERVER_V1_20261021' app/Services/PmdStaffClockGeofenceV1.php
          grep -Fq 'validatePunch' app/Http/Controllers/PmdStaffPortalV6Controller.php
          grep -Fq 'assertOwnerOrManager' app/admin/controllers/Shifts.php
          ! grep -Fq 'ACCESS_BACKGROUND_LOCATION' mobile/android/staff/src/main/AndroidManifest.xml
          grep -Fq 'PMD_STAFF_WORKFORCE_DAILY_RELIABILITY_V2_20261021' mobile/android/staff/src/main/java/com/paymydine/staff/StaffActivity.kt
          grep -Fq 'PMD_STAFF_NATIVE_CLOCK_GPS_V1_20261022' mobile/android/staff/src/main/java/com/paymydine/staff/StaffActivity.kt
          grep -Fq 'PMD_STAFF_NATIVE_CLOCK_GPS_V1_20261022' app/admin/assets/js/pmd-staff-time-clock-v1.js
          grep -Fq 'pmdstaffgeo://clock?request=' app/admin/assets/js/pmd-staff-time-clock-v1.js
          grep -Fq 'PMD_STAFF_UNSCHEDULED_ATTENDANCE_V1_20261022' app/Http/Controllers/PmdStaffPortalV6Controller.php
          grep -Fq "'schedule_status' => \$hasPlannedShift ? 'scheduled' : 'unscheduled'" app/Http/Controllers/PmdStaffPortalV6Controller.php
          grep -Fq 'PMD_STAFF_UNSCHEDULED_ATTENDANCE_V1_20261022' app/admin/Services/PmdStaffOperationsCenterV1.php
          grep -Fq 'pmd-staff-ops__unscheduled' app/admin/views/pmdshifts/_staff_operations_center_v1.blade.php
          grep -Fq 'PMD_STAFF_UNSCHEDULED_ATTENDANCE_V1_20261022' scripts/pmd-staff-native-gps-v1-deploy.sh
          grep -Fq 'PMD_STAFF_APP_SETTINGS_DOWNLOAD_V1_20261022' app/admin/views/pmdsettings/index.blade.php
          grep -Fq 'PMD_STAFF_APP_SETTINGS_DOWNLOAD_V1_20261022' scripts/pmd-staff-apk-settings-v1-deploy.sh
          grep -Fq 'PMD_MY_WORK_STAFF_PORTAL_V6' scripts/pmd-install-staff-platform-v1.sh
          grep -Fq 'pmd-staff-time-clock-v1.css' scripts/pmd-install-staff-platform-v1.sh
          grep -Fq 'PMD_STAFF_RESTAURANT_GPS_PIN_V1_20261021' app/admin/controllers/Pmdsettings.php
          grep -Fq 'PMD_STAFF_RESTAURANT_GPS_PIN_V1_20261021' app/admin/views/pmdsettings/restaurant.blade.php

  staff-apk:
    name: Build standalone Staff APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v3 still requests retired SDK package 'tools' and fails before compiling.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build ONLY dedicated Staff application
        working-directory: mobile/android
        run: gradle --no-daemon :staff:assembleDebug
      - name: Publish separate installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PayMyDine-Staff-Android-debug
          path: mobile/android/staff/build/outputs/apk/debug/staff-debug.apk
          if-no-files-found: error
          retention-days: 14
