name: PMD Staff Attendance

on:
  pull_request:
    paths:
      - 'app/Services/AI/PmdWorkforcePersonHoursService.php'
      - 'app/Services/AI/PmdWorkforceToolFactCompactor.php'
      - 'app/Services/Workforce/PmdStaffAttendanceSchemaService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/Http/Controllers/PmdStaffPortalV6Controller.php'
      - 'scripts/pmd-staff-attendance-canary.php'
      - 'scripts/pmd-staff-attendance-contract-audit.php'
      - 'scripts/pmd-staff-attendance-rollout.sh'
      - '.github/workflows/pmd-intelligence-chat-actions.yml'
  push:
    branches: [main]
    paths:
      - 'app/Services/AI/PmdWorkforcePersonHoursService.php'
      - 'app/Services/AI/PmdWorkforceToolFactCompactor.php'
      - 'app/Services/Workforce/PmdStaffAttendanceSchemaService.php'
      - 'app/Services/SuperAdminTenantLifecycleService.php'
      - 'app/Http/Controllers/PmdStaffPortalV6Controller.php'
      - 'scripts/pmd-staff-attendance-canary.php'
      - 'scripts/pmd-staff-attendance-contract-audit.php'
      - 'scripts/pmd-staff-attendance-rollout.sh'
      - '.github/workflows/pmd-intelligence-chat-actions.yml'

permissions:
  contents: read

jobs:
  attendance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP and shell syntax
        run: |
          php -l app/Services/AI/PmdWorkforcePersonHoursService.php
          php -l app/Services/AI/PmdWorkforceToolFactCompactor.php
          php -l app/Services/Workforce/PmdStaffAttendanceSchemaService.php
          php -l app/Services/SuperAdminTenantLifecycleService.php
          php -l app/Http/Controllers/PmdStaffPortalV6Controller.php
          php -l scripts/pmd-staff-attendance-canary.php
          php -l scripts/pmd-staff-attendance-contract-audit.php
          bash -n scripts/pmd-staff-attendance-rollout.sh
      - name: Staff attendance authority contract
        run: php scripts/pmd-staff-attendance-contract-audit.php
