name: PMD Intelligence Chat Actions

on:
  pull_request:
    paths:
      - 'app/Services/AI/**'
      - 'app/Services/Workforce/**'
      - 'app/Http/Controllers/PmdStaffPortalV6Controller.php'
      - 'app/admin/controllers/Pmdintelligence.php'
      - 'app/admin/middleware/LogUserLastSeen.php'
      - 'app/admin/views/pmdintelligence/**'
      - 'app/admin/assets/js/pmd-intelligence-v1.js'
      - 'app/admin/assets/css/pmd-intelligence-v1.css'
      - 'app/main/routes/api-v1-guest-ai.php'
      - 'app/system/database/migrations/*admin_ai*'
      - 'app/system/database/migrations/*shift_audit*'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/**'
      - 'scripts/pmd-intelligence-chat-actions-audit.php'
      - 'scripts/pmd-workforce-fact-guard-audit.php'
      - 'scripts/pmd-workforce-fact-guard-runtime-test.php'
      - 'scripts/pmd-staff-attendance-canary.php'
      - 'scripts/pmd-staff-attendance-contract-audit.php'
      - 'scripts/pmd-staff-attendance-rollout.sh'
      - 'tests/Unit/PmdIntelligenceConversationActionsTest.php'
      - '.github/workflows/pmd-intelligence-chat-actions.yml'
  push:
    branches: [main]
    paths:
      - 'app/Services/AI/**'
      - 'app/Services/Workforce/**'
      - 'app/Http/Controllers/PmdStaffPortalV6Controller.php'
      - 'app/admin/controllers/Pmdintelligence.php'
      - 'app/admin/middleware/LogUserLastSeen.php'
      - 'app/admin/views/pmdintelligence/**'
      - 'app/admin/assets/js/pmd-intelligence-v1.js'
      - 'app/admin/assets/css/pmd-intelligence-v1.css'
      - 'app/main/routes/api-v1-guest-ai.php'
      - 'app/system/database/migrations/*admin_ai*'
      - 'app/system/database/migrations/*shift_audit*'
      - 'frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/**'
      - 'scripts/pmd-intelligence-chat-actions-audit.php'
      - 'scripts/pmd-workforce-fact-guard-audit.php'
      - 'scripts/pmd-workforce-fact-guard-runtime-test.php'
      - 'scripts/pmd-staff-attendance-canary.php'
      - 'scripts/pmd-staff-attendance-contract-audit.php'
      - 'scripts/pmd-staff-attendance-rollout.sh'
      - 'tests/Unit/PmdIntelligenceConversationActionsTest.php'
      - '.github/workflows/pmd-intelligence-chat-actions.yml'

permissions:
  contents: read

jobs:
  php-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP and shell syntax
        run: |
          php -l app/Services/AI/AdminAiConversationStore.php
          php -l app/Services/AI/PmdAdminWorkforceIntelligenceService.php
          php -l app/Services/AI/PmdShiftAuditService.php
          php -l app/Services/AI/PmdWorkforcePersonHoursService.php
          php -l app/Services/AI/PmdWorkforceToolFactCompactor.php
          php -l app/Services/AI/PmdIntelligenceActionRegistry.php
          php -l app/Services/AI/AiOrchestrator.php
          php -l app/Services/Workforce/PmdStaffAttendanceSchemaService.php
          php -l app/Http/Controllers/PmdStaffPortalV6Controller.php
          php -l app/admin/controllers/Pmdintelligence.php
          php -l app/admin/middleware/LogUserLastSeen.php
          php -l app/main/routes/api-v1-guest-ai.php
          php -l scripts/pmd-intelligence-chat-actions-audit.php
          php -l scripts/pmd-workforce-fact-guard-audit.php
          php -l scripts/pmd-workforce-fact-guard-runtime-test.php
          php -l scripts/pmd-staff-attendance-canary.php
          php -l scripts/pmd-staff-attendance-contract-audit.php
          bash -n scripts/pmd-staff-attendance-rollout.sh
      - name: Shared Intelligence contract
        run: php scripts/pmd-intelligence-chat-actions-audit.php
      - name: Workforce fact guard contract
        run: php scripts/pmd-workforce-fact-guard-audit.php
      - name: Workforce fact guard runtime regression
        run: php scripts/pmd-workforce-fact-guard-runtime-test.php
      - name: Staff attendance authority contract
        run: php scripts/pmd-staff-attendance-contract-audit.php

  frontend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-v2/PayMyDine-Frontend-V2-Integrated-Final-R2-20260815/package-lock.json
      - name: Install locked V2 dependencies
        run: npm ci --ignore-scripts
      - name: Guest AI contract audit
        run: npm run guest-ai:audit
      - name: Offline typecheck
        run: npm run typecheck:offline
      - name: Theme isolation audit
        run: npm run theme:audit
      - name: Intelligence delta source safety
        run: node scripts/pmd-intelligence-delta-source-audit.mjs
