name: PMD Starter Menu Images V3 Validate

on:
  push:
    branches:
      - feature/menu-gallery-sides-options-20260903
    paths:
      - app/admin/Services/PmdStarterMenuImageServiceV2.php
      - app/admin/Services/PmdStarterMenuImageServiceV3.php
      - .github/workflows/pmd-starter-menu-images-v3-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/admin/Services/PmdStarterMenuImageServiceV2.php
          php -l app/admin/Services/PmdStarterMenuImageServiceV3.php
      - name: Verify V3 contracts
        run: |
          grep -q "pmdstarter_v3_" app/admin/Services/PmdStarterMenuImageServiceV3.php
          grep -q "pmd-studio-light-v3" app/admin/Services/PmdStarterMenuImageServiceV3.php
          grep -q "skin_edge_ratio" app/admin/Services/PmdStarterMenuImageServiceV3.php
          grep -q "neutral_light_edge_ratio" app/admin/Services/PmdStarterMenuImageServiceV3.php
          grep -q "extends PmdStarterMenuImageServiceV3" app/admin/Services/PmdStarterMenuImageServiceV2.php
