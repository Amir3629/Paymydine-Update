name: Export ZCS Z100 V18 Build Kit

on:
  push:
    branches:
      - feature/zcs-z100-auto-secondary-v18
    paths:
      - '.github/workflows/zcs-export-build-kit-v18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare temporary preview signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PayMyDine ZCS Build Kit,O=PayMyDine,C=DE" \
            -noprompt >/dev/null 2>&1

      - name: Prime dependencies without proprietary ZCS AAR
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/libs
          gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Package portable build kit
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pmd-zcs-v18-build-kit"
          rm -rf "$OUT"
          mkdir -p "$OUT/source" "$OUT/toolchain/android-sdk"

          cp -a mobile/android "$OUT/source/android"
          cp -aL "$JAVA_HOME" "$OUT/toolchain/jdk17"

          mkdir -p "$OUT/toolchain/android-sdk/platforms"
          mkdir -p "$OUT/toolchain/android-sdk/build-tools"
          cp -a "$ANDROID_HOME/platforms/android-36" "$OUT/toolchain/android-sdk/platforms/android-36"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$OUT/toolchain/android-sdk/build-tools/35.0.0"
          cp -a "$ANDROID_HOME/platform-tools" "$OUT/toolchain/android-sdk/platform-tools"
          if [[ -d "$ANDROID_HOME/licenses" ]]; then
            cp -a "$ANDROID_HOME/licenses" "$OUT/toolchain/android-sdk/licenses"
          fi

          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          cp -a "$GRADLE_HOME" "$OUT/toolchain/gradle-8.13"

          mkdir -p "$OUT/toolchain/gradle-user-home"
          cp -a "$GRADLE_USER_HOME/caches" "$OUT/toolchain/gradle-user-home/caches"

          cat > "$OUT/BUILD_KIT_INFO.txt" <<EOF
          source_commit=$GITHUB_SHA
          version=0.5.9-device-app-v18
          version_code=72
          java_home=toolchain/jdk17
          android_home=toolchain/android-sdk
          gradle_home=toolchain/gradle-8.13
          gradle_user_home=toolchain/gradle-user-home
          zcs_aar_expected=SmartPos_2.0.6_R260615.aar
          zcs_aar_sha256=fe2269746167064571ae23fc655838f203436deeb145606ff5c2d34b0054db18
          EOF

          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pmd-zcs-v18-build-kit.tar.gz" pmd-zcs-v18-build-kit
          ls -lh "$RUNNER_TEMP/pmd-zcs-v18-build-kit.tar.gz"
          sha256sum "$RUNNER_TEMP/pmd-zcs-v18-build-kit.tar.gz" | tee "$RUNNER_TEMP/pmd-zcs-v18-build-kit.tar.gz.sha256"
          split -b 350M "$RUNNER_TEMP/pmd-zcs-v18-build-kit.tar.gz" "$RUNNER_TEMP/pmd-zcs-v18-build-kit.part-"
          ls -lh "$RUNNER_TEMP"/pmd-zcs-v18-build-kit.part-*
          test -f "$RUNNER_TEMP/pmd-zcs-v18-build-kit.part-aa"
          test -f "$RUNNER_TEMP/pmd-zcs-v18-build-kit.part-ab"
          test -f "$RUNNER_TEMP/pmd-zcs-v18-build-kit.part-ac"

      - uses: actions/upload-artifact@v4
        with:
          name: pmd-zcs-v18-build-kit-part-aa
          path: ${{ runner.temp }}/pmd-zcs-v18-build-kit.part-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: pmd-zcs-v18-build-kit-part-ab
          path: ${{ runner.temp }}/pmd-zcs-v18-build-kit.part-ab
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: pmd-zcs-v18-build-kit-part-ac
          path: ${{ runner.temp }}/pmd-zcs-v18-build-kit.part-ac
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: pmd-zcs-v18-build-kit-sha256
          path: ${{ runner.temp }}/pmd-zcs-v18-build-kit.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
