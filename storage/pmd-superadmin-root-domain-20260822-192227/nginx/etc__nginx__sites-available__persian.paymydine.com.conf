server {
    listen 80;
    listen [::]:80;
    server_name persian.paymydine.com;

    root /var/www/paymydine;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paymydine;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name persian.paymydine.com;

    # ✅ حذف شد چون duplicate می‌داد و مقصدش هم اشتباه بود:
    # --- Compatibility aliases for frontend (legacy endpoints) ---
    # location = /simple-theme { return 302 /api/v1/settings-wrapped; }
    # location = /tax-settings  { return 302 /api/v1/tax-settings; }

    # PMD_THEME_FIX_START
    location = /simple-theme {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location = /settings-wrapped {
      return 302 /api-server-multi-tenant.php/api/v1/settings;
    }

    location = /api/v1/settings-wrapped {
      return 302 /api-server-multi-tenant.php/api/v1/settings;
    }

    location = /api/v1/theme-settings {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location = /api/v1/settings {
      try_files $uri $uri/ /index.php?$query_string;
    }
    # PMD_THEME_FIX_END
    # --- /Compatibility aliases ---

    # (اگر tax-settings میخوای، این یکی رو نگه دار ولی فقط همینجا و بدون simple-theme)
    location = /tax-settings  { return 302 /api/v1/tax-settings; }

    # Laravel admin entry
    # DISABLED_BY_ADMIN_FIX_START
# location = /admin {
#       return 302 /superadmin/index;
#     }
# DISABLED_BY_ADMIN_FIX_END

    # DISABLED_BY_ADMIN_FIX_START
# location = /admin/ {
#       return 302 /superadmin/index;
#     }
# DISABLED_BY_ADMIN_FIX_END

    location ^~ /superadmin/ {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/(menu|checkout|table|dashboard|valet)(/|$) {
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      try_files $uri $uri/ @next;
    }

    # --- PMD: mimoza theme/settings FIX (single source of truth) ---
    # DISABLED_BY_FIX: # DISABLED_BY_THEME_FIX # DISABLED_BY_THEME_FIX location = /simple-theme     { return 302 /api-server-multi-tenant.php/api/v1/theme-settings; }
    # DISABLED_BY_FIX: # DISABLED_BY_THEME_FIX # DISABLED_BY_THEME_FIX location = /settings-wrapped { return 302 /api-server-multi-tenant.php/api/v1/settings; }
    # DISABLED_BY_FIX: # DISABLED_BY_THEME_FIX # DISABLED_BY_THEME_FIX location = /api/v1/theme-settings { return 302 /api-server-multi-tenant.php/api/v1/theme-settings; }
    # DISABLED_BY_FIX: # DISABLED_BY_THEME_FIX # DISABLED_BY_THEME_FIX location = /api/v1/settings       { return 302 /api-server-multi-tenant.php/api/v1/settings; }
    # --- /PMD ---

    # --- PMD: route media API to PHP/Laravel (not Next) ---
    location ^~ /api/media/ {
      try_files $uri $uri/ /index.php?$query_string;
    }
    # --- /PMD ---


    # Laravel admin entry (restored)
    location = /admin {
      return 301 /admin/;
    }

    location ^~ /admin/ {
      try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Next.js routing (fixed) ---
    location ^~ /_next/static/ {
        # PMD_V2_NEXT_STATIC_AUTHORITY_R29G
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /_next/image/ {
        # PMD_V2_NEXT_IMAGE_AUTHORITY_R29G
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # IMPORTANT: keep /api/v1/* for Laravel, but everything else under /api/* goes to Next
    # ✅ Frontend alias -> Laravel (internal, no 302)


    # ✅ Frontend alias -> Laravel (direct FastCGI, no rewrite, no 302)


    # Frontend alias -> Laravel tax settings


    # Frontend alias -> Laravel tax settings


    # Frontend aliases -> backend/Laravel
    location = /api/theme {
        return 302 /api-server-multi-tenant.php/api/v1/theme-settings;
    }

    location = /api/settings {
        return 302 /api-server-multi-tenant.php/api/v1/settings;
    }

    location = /api/tax-settings {
        return 302 /api/v1/tax-settings;
    }

    location ^~ /api/v1/ {
      try_files $uri $uri/ /index.php?$query_string;
    }
    # ✅ Backend API (must NOT go to Next)

    # --- PMD FIX: allow /api-server-multi-tenant.php/... to be executed by PHP-FPM (PATH_INFO) ---
    location ~ ^/api-server-multi-tenant\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        include fastcgi_params;
    }
    # --- /PMD FIX ---

    ssl_certificate /etc/letsencrypt/live/persian.paymydine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/persian.paymydine.com/privkey.pem;

    root /var/www/paymydine;
    index index.php index.html;

    # Main app routes -> Next (fallback)

    # ✅ API aliases for frontend



    # ✅ Frontend alias -> Laravel (tax settings)

    # (Optional) Option B: 302 redirect instead of internal routing
    # location = /api/tax-settings { return 302 /api/v1/tax-settings; }






    location = /api/bootstrap {
        # PMD_V2_BOOTSTRAP_AUTHORITY_R29G
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ @next;
    }

    # PHP HANDLER
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location @next {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # >>> R2O DIRECT WEBHOOK START >>>
    location = /api/r2o/webhook {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/paymydine/public/r2o_webhook.php;
        fastcgi_param SCRIPT_NAME /r2o_webhook.php;
        fastcgi_param DOCUMENT_ROOT /var/www/paymydine/public;
        fastcgi_param DOCUMENT_URI /api/r2o/webhook;
        fastcgi_param REQUEST_URI /api/r2o/webhook;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    # <<< R2O DIRECT WEBHOOK END <<<

}
