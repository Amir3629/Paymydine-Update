# PMD_TEST_TENANT_R30F_CANONICAL_NGINX
server {
    listen 80;
    listen [::]:80;
    server_name kult.paymydine.com;
    root /var/www/paymydine;
    add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paymydine;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kult.paymydine.com;

    ssl_certificate /etc/letsencrypt/live/kult.paymydine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kult.paymydine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/paymydine;
    index index.php index.html;
    add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;

    # Runtime server-selection probe. This is Nginx-only and never reaches PHP/Next.
    location = /__pmd_r30f_vhost_probe {
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "exact-vhost-probe" always;
        return 204;
    }

    # V2 customer root must be an exact Next authority.
    # Do NOT use try_files for "/": the Laravel document root exists as a
    # directory, so `try_files $uri $uri/ @next` would select index.php and
    # bypass the intended V2 root route.
    location = / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "v2-root" always;
    }

    # PMD_COUPON_VALIDATE_ROUTING_V1_START
    # Frontend V2 currently receives /validate-coupon, while its proxy resolves
    # PMD_BACKEND_ORIGIN=auto back through this same tenant host. Without this
    # exact compatibility hop the request re-enters Next on port 3002.
    # The canonical business authority remains Laravel /api/v1/validate-coupon.
    location = /validate-coupon {
        return 307 /api/v1/validate-coupon;
    }
    # PMD_COUPON_VALIDATE_ROUTING_V1_END

    # V2-only authorities.
    location = /api/bootstrap {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "v2-bootstrap" always;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "v2-static" always;
    }

    location ^~ /_next/image/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "v2-image" always;
    }

    # Laravel tenant API goes straight to the single PHP front controller.
    # This avoids any internal redirect being re-selected by a customer Next route.
    location ^~ /api/v1/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/paymydine/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/paymydine;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS on;
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "laravel-api-v1" always;
    }

    location ^~ /api/media/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/paymydine/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/paymydine;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS on;
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "laravel-media" always;
    }

    location = /api/health {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/paymydine/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/paymydine;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS on;
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "laravel-health" always;
    }

    # Admin remains TastyIgniter/Laravel.
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

location ~ ^/api-server-multi-tenant\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root/api-server-multi-tenant.php;
        fastcgi_param SCRIPT_NAME /api-server-multi-tenant.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    location = /api/r2o/webhook {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/paymydine/public/r2o_webhook.php;
        fastcgi_param SCRIPT_NAME /r2o_webhook.php;
        fastcgi_param DOCUMENT_ROOT /var/www/paymydine/public;
        fastcgi_param DOCUMENT_URI /api/r2o/webhook;
        fastcgi_param REQUEST_URI /api/r2o/webhook;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        try_files $uri $uri/ @next;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location @next {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-PMD-R30F-Vhost "kult.paymydine.com" always;
        add_header X-PMD-R30F-Route "v2-customer" always;
    }

    # PMD_SUPERADMIN_TENANT_REDIRECT_R2_START
    # Tenant hosts never execute the Super Admin control plane.
    location = /superadmin {
        return 307 https://paymydine.com/superadmin;
    }

    location ^~ /superadmin/ {
        return 307 https://paymydine.com$request_uri;
    }
    # PMD_SUPERADMIN_TENANT_REDIRECT_R2_END
}
