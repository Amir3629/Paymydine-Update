# PMD_WORKLOAD_ISOLATION_R1
# Public /api/v1/payments and /api/v1/payments/config-public stay on main FPM.
location = /api/v1/guest-ai/ask {
    include /etc/nginx/snippets/pmd-isolated-fastcgi-common-r1.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-pmd-ai.sock;
    fastcgi_read_timeout 40s; fastcgi_send_timeout 40s;
}
location = /admin/pmdintelligence/ask {
    include /etc/nginx/snippets/pmd-isolated-fastcgi-common-r1.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-pmd-ai.sock;
    fastcgi_read_timeout 40s; fastcgi_send_timeout 40s;
}
location = /api/v1/payments/card/create-session {
    include /etc/nginx/snippets/pmd-isolated-fastcgi-common-r1.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-pmd-payment.sock;
    fastcgi_read_timeout 155s; fastcgi_send_timeout 155s;
}
location ^~ /api/v1/payments/paypal/ {
}
location ^~ /api/v1/payments/worldline/ {
}
location ^~ /api/v1/payments/sumup/ {
}
location ^~ /api/v1/payments/square/ {
}
location ^~ /api/v1/payments/vr-payment/ {
}
location ^~ /api/v1/payments/wero/ {
}
